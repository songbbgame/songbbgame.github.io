<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Pages 测试 0922</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #111318;
      color: #f5f7fb;
    }

    main {
      width: min(32rem, calc(100% - 3rem));
      padding: 2rem;
      box-sizing: border-box;
      border: 1px solid #ffffff20;
      border-radius: 1.25rem;
      background: #ffffff0d;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 8vw, 3rem);
    }

    p {
      margin: 0;
      color: #c7ccd8;
      font-size: 1.05rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>测试成功</h1>
    <p>Codex 已在 2026-09-22 成功修改并推送 songbbgame.github.io。</p>
  </main>

</html>
