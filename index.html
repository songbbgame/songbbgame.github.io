<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SongBB Game办公室 Demo">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/203songbbgame办公室-07-分支1碰撞.obj" as="fetch" crossorigin>
  <title>SongBB Game办公室 Demo</title>
  <script type="module" crossorigin src="/assets/demo-Bc2RSvr3.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/配置-jthH7Iut.js">
  <link rel="stylesheet" crossorigin href="/assets/demo-C_-vKBxd.css">
</head>
<body>
  <canvas id="画布" tabindex="-1"></canvas>
  <div id="加载层">
    <div class="加载卡片">
      <div class="标题">SongBB Game办公室 Demo</div>
      <div id="加载文字">正在初始化渲染器</div>
      <div class="进度轨道"><div id="加载进度"></div></div>
      <div id="加载百分比">0%</div>
    </div>
  </div>
  <div id="准星" hidden></div>
  <div id="桌面提示" hidden>点击画面控制视角　WASD移动　Shift奔跑　空格跳跃　Esc释放鼠标</div>
  <div id="横屏提示" hidden>
    <div>
      <strong>请横向握持手机</strong>
      <span>横屏能获得更好的视野和操控空间</span>
      <button id="进入横屏" type="button">进入横屏</button>
    </div>
  </div>
  <div id="触屏控制" hidden>
    <div id="移动摇杆" class="摇杆"><i></i></div>
    <div id="视角区域" aria-label="滑动控制视角"></div>
    <div id="手机工具">
      <button id="全屏按钮" type="button" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button>
      <button id="设置按钮" type="button" aria-label="设置"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </div>
    <section id="手机设置" hidden>
      <header><strong>设置</strong><button id="关闭设置" type="button" aria-label="关闭">×</button></header>
      <label>画质<select id="画质选项"><option>流畅</option><option selected>均衡</option><option>清晰</option></select></label>
      <label>分辨率<select id="分辨率选项"></select></label>
      <div id="画质说明"></div>
      <label>移动速度<input id="移动速度" type="range" min="0.6" max="1.4" step="0.1" value="1"></label>
      <label>视角速度<input id="视角速度" type="range" min="0.6" max="1.8" step="0.1" value="1"></label>
      <label>镜头<select id="镜头倍率"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      <button id="设置全屏" type="button">进入全屏</button>
      <div id="全屏说明" hidden>iPhone需添加到主屏幕后全屏</div>
    </section>
  </div>
  <aside id="开发面板" hidden>
    <h1>开发模式</h1>
    <div id="开发状态"></div>
    <label><input id="显示碰撞" type="checkbox" checked>显示碰撞模型</label>
    <label>测试点位<select id="测试点位"></select></label>
    <label>检查视角<input id="检查视角" value="0,0,0,0,0" aria-label="检查视角"></label>
    <div class="开发按钮">
      <button id="传送点位" type="button">传送</button>
      <button id="回到出生" type="button">回到出生</button>
      <button id="应用视角" type="button">应用检查视角</button>
      <button id="复制视角" type="button">复制当前视角</button>
    </div>
    <a href="/" id="展示链接">打开展示模式</a>
  </aside>
</body>
</html>
