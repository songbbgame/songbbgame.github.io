<!doctype html>

<head>

<title>真实的梦 2 · 第一章 · 可玩性修复 1.2</title>
<style>
/* DOR2 文字版：两种画面
   1 连接之前：一个2019年的旧网页（浅色、蓝链接、小字）
   2 连接之后：R07 的摄像头画面（深色、等宽 HUD、按房间换色） */
:root {
  --bg: #0d0e10; --panel: #15171a; --ink: #d9d6cf; --dim: #8a8780; --faint: #55534e;
  --accent: #e8c26a; --place: #8fc3e8; --dl: #9fe0a8; --me: #b9b4aa; --line: #26282c;
  --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "SF Mono", "Menlo", "Consolas", "Noto Sans Mono CJK SC", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.85; transition: background 2.5s ease, color 2.5s ease; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }

/* ---------- 场景色 ---------- */
body[data-scene="office"] { --bg: #111317; --accent: #e3c27a; }
body[data-scene="corridor"], body[data-scene="dark"] { --bg: #07080a; --ink: #c9c6be; --accent: #d9b35e; }
body[data-scene="dark"].lit { --bg: #101412; }
body[data-scene="atrium"] { --bg: #14120e; --accent: #f0c66b; }
body[data-scene="atrium"].rain { --bg: #0f1418; --accent: #a9d0e8; }
body[data-scene="horror"], body[data-scene="staff"] { --bg: #0b0606; --ink: #cfc3bd; --accent: #d9776a; }
body[data-scene="garden"] { --bg: #0e1410; --accent: #a8d49a; }
body[data-scene="backway"], body[data-scene="service"], body[data-scene="staffdoor"] { --bg: #121416; }
body[data-scene="desert"] { --bg: #e9dcc2; --ink: #2d2518; --dim: #6f6350; --faint: #a39479; --panel: #f3e9d5; --line: #d6c7a8; --accent: #9a5b12; --place: #2f6f95; --dl: #2f7a3c; --me: #5b513f; }
body.black, body.black[data-scene] { --bg: #000; --ink: #ddd; }

/* ---------- 摄像头画面 ---------- */
#cam { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 0 16px; }
#hud { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 10px 0 8px; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; color: var(--dim); background: linear-gradient(var(--bg) 70%, transparent); transition: background 2.5s ease; }
#hud .rec { color: #e0564a; }
#hud .rec::before { content: "●"; margin-right: 4px; animation: blink 1.6s steps(1) infinite; }
#hud b { color: var(--ink); font-weight: 500; }
#hud .sp { flex: 1; }
#hud button { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; font-size: 12px; color: var(--dim); cursor: pointer; line-height: 22px; }
@keyframes blink { 50% { opacity: 0; } }

#feed { flex: 1; padding: 8px 0 24px; }
#feed p { margin: 0 0 .9em; white-space: pre-wrap; animation: fadein .5s ease both; }
#feed p.narr { }
#feed p.sys { font-size: 13px; line-height: 1.7; color: var(--dim); font-family: var(--mono); }
#feed p.me { color: var(--me); font-size: 14px; margin-top: 1.6em; opacity: .75; }
#feed p.me::before { content: "› "; }
#feed .dl { font-family: var(--mono); color: var(--dl); font-size: 16px; margin: 0 0 .5em; padding-left: 12px; border-left: 2px solid var(--dl); white-space: pre-wrap; }
#feed .dl .cur { display: inline-block; width: .55em; background: var(--dl); animation: blink 1s steps(1) infinite; margin-left: 1px; }
#feed .typing { font-family: var(--mono); font-size: 13px; color: var(--dim); padding-left: 12px; margin: 0 0 .5em; }
#feed .title { text-align: center; font-size: 26px; letter-spacing: .3em; margin: 2.4em 0; font-weight: 300; animation: fadein 3s ease both; }
#feed .rule { text-align: center; font-family: var(--mono); font-size: 12px; color: var(--faint); margin: 1.6em 0; letter-spacing: .2em; }
#feed .record, #feed .reel { font-family: var(--mono); font-size: 13px; line-height: 1.75; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin: 0 0 1em; white-space: pre-wrap; overflow-x: auto; }
#feed .reel .f { display: block; animation: fadein .3s ease both; }
#feed .reel .ts { color: var(--dim); margin-right: .8em; }
#feed .record.still { border-color: var(--accent); }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.o, .pl { cursor: pointer; border-bottom: 1px dashed currentColor; }
.o { color: var(--accent); }
.pl { color: var(--place); }
.o:hover, .pl:hover { border-bottom-style: solid; }

/* ---------- 输入区 ---------- */
#bar { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 18%); padding: 18px 0 14px; z-index: 5; transition: background 2.5s ease; }
#acts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; max-height: 30vh; overflow-y: auto; }
#acts button { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 14px; line-height: 1.6; cursor: pointer; color: var(--ink); }
#acts button.g-移动 { color: var(--place); }
#acts button.g-导览, #acts button.g-驾驶 { border-color: var(--accent); }
#acts button:hover { border-color: var(--ink); }
#acts .more { color: var(--dim); }
#inrow { display: flex; gap: 8px; }
#cmd { flex: 1; min-width: 0; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 16px; outline: none; }
#cmd:focus { border-color: var(--accent); }
#go { background: var(--accent); color: var(--bg); border: 0; border-radius: 8px; padding: 0 16px; cursor: pointer; font-size: 15px; }
#skiphint { font-family: var(--mono); font-size: 11px; color: var(--faint); text-align: center; height: 16px; }

/* 物体弹出菜单 */
#pop { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: none; box-shadow: 0 6px 24px rgba(0,0,0,.4); max-width: 280px; }
#pop .h { font-size: 13px; color: var(--dim); padding: 2px 6px 6px; }
#pop button { display: inline-block; margin: 2px; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 14px; }
#pop button:hover { border-color: var(--accent); }

/* 录鸣笛 */
#rec { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.72); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; color: #eee; }
#rec .big { width: 140px; height: 140px; border-radius: 50%; border: 0; background: #c9443a; color: #fff; font-size: 18px; cursor: pointer; box-shadow: 0 0 0 6px rgba(201,68,58,.3); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#rec .big.on { transform: scale(.94); background: #e05a4f; }
#rec .t { font-family: var(--mono); font-size: 13px; opacity: .8; }

/* 连接过场 */
#noise { position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0; transition: opacity .4s; }
#noise.on { opacity: 1; }

/* ---------- 2019年的网页 ---------- */
#browser { display: none; min-height: 100%; background: #e9ebee; color: #222; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; line-height: 1.6; }
body.web #browser { display: block; }
body.web #cam { display: none; }
body.web { background: #e9ebee; }
#chrome { position: sticky; top: 0; z-index: 5; background: #dfe1e5; border-bottom: 1px solid #c4c7cc; padding: 6px 10px; display: flex; gap: 8px; align-items: center; }
#chrome .dots span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; background: #c4c7cc; }
#url { flex: 1; background: #fff; border-radius: 14px; padding: 2px 12px; font-size: 13px; color: #555; font-family: Arial, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#page { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
.w-card { background: #fff; border: 1px solid #dcdfe3; border-radius: 3px; padding: 14px 16px; margin-bottom: 10px; }
.w-board { font-size: 12px; color: #888; }
.w-title { font-size: 20px; font-weight: bold; color: #333; margin: 4px 0 6px; }
.w-meta { font-size: 12px; color: #999; margin-bottom: 10px; }
.w-body p { margin: 0 0 .6em; }
a.w-link, .w-link { color: #2d64b3; text-decoration: underline; cursor: pointer; }
.w-cm { border-top: 1px solid #eee; padding: 9px 0; display: flex; gap: 10px; }
.w-cm .av { width: 32px; height: 32px; border-radius: 3px; flex: none; }
.w-cm .nm { color: #2d64b3; font-size: 13px; }
.w-cm .fl { color: #aaa; font-size: 12px; float: right; }
.w-cm .tx { color: #333; }
.w-cm.mine .tx { color: #111; font-weight: bold; }
.w-more { text-align: center; padding: 10px; color: #2d64b3; cursor: pointer; }
.w-reply textarea { width: 100%; height: 64px; border: 1px solid #ccc; border-radius: 2px; padding: 6px; font: inherit; resize: vertical; }
.w-btn { background: #3b7ddd; color: #fff; border: 0; border-radius: 2px; padding: 5px 16px; cursor: pointer; font-size: 14px; }
.w-btn.gray { background: #999; }
.w-site-top { background: #1b1f2a; color: #eee; padding: 14px 16px; border-radius: 3px 3px 0 0; }
.w-site-top .logo { font-size: 18px; font-weight: bold; letter-spacing: .05em; }
.w-nav { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 16px; background: #2b3242; border-radius: 0 0 3px 3px; margin-bottom: 10px; }
.w-nav span { color: #cfd6e6; cursor: pointer; font-size: 13px; }
.w-nav span:hover { color: #fff; text-decoration: underline; }
.w-banner { background: linear-gradient(135deg, #3d4a6b, #7a5c8a); color: #fff; padding: 46px 18px; text-align: center; font-size: 18px; border-radius: 3px; margin-bottom: 10px; }
.w-input { border: 1px solid #bbb; padding: 5px 8px; font: inherit; width: 220px; max-width: 100%; }
.w-err { font-family: Arial, sans-serif; color: #555; white-space: pre-wrap; }
.w-table { width: 100%; border-collapse: collapse; font-family: Consolas, Menlo, monospace; font-size: 12.5px; }
.w-table td, .w-table th { border: 1px solid #ddd; padding: 5px 8px; text-align: left; }
.w-table th { background: #f3f4f6; }
.st-ONLINE { color: #1a8f3a; } .st-OFFLINE { color: #999; } .st-SLEEP { color: #b58a00; } .st-TRANSFERRED { color: #555; }
.w-q { font-size: 44px; text-align: center; font-family: Arial, sans-serif; color: #333; padding: 18px 0 6px; }
.w-toast { font-size: 13px; color: #666; background: #fffbe6; border: 1px solid #f0e2a8; padding: 6px 10px; margin-bottom: 10px; border-radius: 2px; white-space: pre-wrap; }
.w-chat .ln { padding: 4px 0; border-bottom: 1px dotted #eee; }
.w-chat .who { color: #2d64b3; margin-right: 6px; }
.w-foot { text-align: center; color: #aaa; font-size: 12px; padding: 20px 0; }
.webcard { background: #fff; color: #222; border-radius: 6px; padding: 10px 12px; margin: 0 0 1em; font-size: 14px; line-height: 1.6; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
.webcard .w-card { border: 0; padding: 0; margin: 0; }

/* 开始界面 */
#start { position: fixed; inset: 0; z-index: 50; background: #000; color: #ccc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
#start h1 { font-weight: 300; letter-spacing: .4em; font-size: 20px; color: #eee; margin: 0 0 8px; }
#start p { font-size: 13px; color: #888; max-width: 420px; line-height: 1.8; margin: 0; }
#start button { background: none; border: 1px solid #555; color: #ddd; padding: 8px 26px; border-radius: 4px; cursor: pointer; font-size: 15px; min-width: 180px; }
#start button:hover { border-color: #ddd; }

@media (max-width: 560px) {
  body { font-size: 16px; }
  #feed .title { font-size: 21px; }
  #hud { font-size: 11px; gap: 2px 10px; }
}

</style>
<style>
/* V1.1：全屏像素画面 + 对话框。网页阶段（2019年的帖子等）沿用文字版的样式。 */
body.v11 { background: #000; overscroll-behavior: none; }
body.v11 #cam, body.v11 #pop { display: none !important; }
body.v11.web #screen { display: none; }
#screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#view { position: relative; width: var(--cvw); height: var(--cvh); flex: none; }
#view canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }

/* 面前的东西：画面上方一个小牌子 */
#focus { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-size: 13px; color: #f4e6bd; background: rgba(8,8,10,.8); border: 1px solid #5a4f33; padding: 2px 10px; border-radius: 3px; pointer-events: none; opacity: 0; transition: opacity .15s; white-space: nowrap; }
#focus.on { opacity: 1; }
#toast { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); max-width: 88%; font-size: 13px; color: #cfe8d6; background: rgba(8,12,10,.88); border: 1px solid #2f5a3f; padding: 4px 12px; border-radius: 3px; pointer-events: none; opacity: 0; transition: opacity .3s; text-align: center; }
#toast.on { opacity: 1; }
#bigTitle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; letter-spacing: .5em; color: #eee; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.2s; }
#bigTitle.on { opacity: 1; }
body.v11black #view canvas { opacity: 0; transition: opacity 1.2s; }

/* 对话框：像素风的双线框 */
#dlg { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(50% - var(--cvh) / 2 + 8px); width: min(calc(var(--cvw) - 16px), 760px); box-sizing: border-box; min-height: 5.6em; padding: 12px 16px 12px; background: rgba(10,10,16,.94); color: #f2ecdd; border: 3px solid #e9e1c9; box-shadow: 0 0 0 3px #0a0a10, inset 0 0 0 2px #0a0a10, inset 0 0 0 3px #6d6656; font-size: 17px; line-height: 1.65; letter-spacing: .02em; display: none; z-index: 5; }
#dlg.on { display: block; }
#dlg .name { display: none; position: absolute; left: 10px; top: -15px; padding: 1px 10px; background: #0a0a10; border: 2px solid #7fe0a0; color: #9ff0b8; font-family: var(--mono, monospace); font-size: 13px; }
#dlg.dl { border-color: #7fe0a0; }
#dlg.dl .name { display: block; }
#dlg.dl #dlgText { color: #a8f5c0; font-family: var(--mono, monospace); letter-spacing: .06em; }
#dlgText .o { color: #f2cc5c; }
#dlgText .p { color: #8fc3ff; }
#dlgText .ts { color: #8a8474; font-family: var(--mono, monospace); font-size: .85em; }
#dlgText .typing { color: #6fb58a; }
#dlgText .cur { display: inline-block; width: .5em; height: 1em; vertical-align: -.1em; background: #a8f5c0; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#dlgMore { position: absolute; right: 12px; bottom: 4px; font-size: 12px; color: #e9e1c9; animation: bob .8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

/* 菜单 / 选项 */
#menu { display: none; position: absolute; z-index: 7; background: rgba(10,10,16,.97); border: 3px solid #e9e1c9; box-shadow: 0 0 0 3px #0a0a10; padding: 8px 6px; min-width: 180px; max-width: 86vw; max-height: 60vh; overflow-y: auto; }
#menu.on { display: block; }
#menu.center { left: 50%; top: 50%; transform: translate(-50%, -50%); }
#menu.dlg { right: calc(50% - var(--cvw) / 2 + 14px); bottom: calc(50% - var(--cvh) / 2 + 14px); }
#menu .h { color: #9a937f; font-size: 13px; padding: 0 10px 4px; }
#menu button { display: block; width: 100%; text-align: left; font: inherit; font-size: 16px; color: #f2ecdd; background: none; border: 0; padding: 7px 12px 7px 26px; position: relative; cursor: pointer; }

#menu button.hi { color: #f2cc5c; }
#menu button.dim { color: #8a8474; }

/* 显示器面板：第二天的记录、回看 */
#panel { display: none; position: absolute; z-index: 8; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 640px); height: min(78vh, 560px); background: #07100b; border: 3px solid #5fae7c; box-shadow: 0 0 0 3px #000, 0 0 30px rgba(80,200,130,.15); flex-direction: column; }
#panel.on { display: flex; }
#panel .body { flex: 1; overflow-y: auto; padding: 14px 16px; color: #b9f0c9; font-family: var(--mono, monospace); font-size: 14px; line-height: 1.7; white-space: normal; }
#panel .body .webcard, #panel .body > div { color: #222; }

#ask { display: none; position: absolute; z-index: 9; left: 50%; top: 40%; transform: translate(-50%, -50%); width: min(90vw, 420px); background: #0a0a10; border: 3px solid #7fe0a0; padding: 12px; gap: 8px; flex-wrap: wrap; }

#ask .h { width: 100%; color: #9ff0b8; font-size: 14px; }
#ask input { flex: 1; font: inherit; font-size: 16px; padding: 8px; background: #111; color: #eee; border: 1px solid #333; }

/* 电脑：键盘说明 */
#keys { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 12px; color: #5f5a4e; pointer-events: none; }
#keys b { color: #a39b86; font-weight: normal; }
body.touch #keys { display: none; }

#touch { display: none; }
body.touch #touch { display: flex; position: absolute; left: 0; right: 0; bottom: 0; justify-content: space-between; align-items: center; padding: 14px 22px calc(44px + env(safe-area-inset-bottom)); box-sizing: border-box; pointer-events: none; }
#stick, #ab { pointer-events: auto; }
#stick { width: 112px; height: 112px; border-radius: 50%; background: radial-gradient(circle, rgba(40,40,46,.7) 0%, rgba(20,20,24,.7) 70%); border: 1px solid #3a3a42; position: relative; touch-action: none; }

#btnA { width: 76px; height: 76px; font-size: 22px; background: #e9c46a; box-shadow: inset 0 -5px 0 #a7832f, 0 3px 8px rgba(0,0,0,.5); margin-bottom: 26px; }

/* 竖屏手机：画面在上，对话框在画面下面，按钮在最下面 */
body.portrait #screen { justify-content: flex-start; padding-top: env(safe-area-inset-top); }

/* 竖屏：菜单、选项也固定在画面下面的空白处（和对话框同一块），两列，按钮大一点方便手指点 */
body.portrait #menu, body.portrait #menu.center, body.portrait #menu.dlg { left: 10px; right: 10px; top: calc(var(--cvh) + 12px + env(safe-area-inset-top)); bottom: 24px; transform: none; max-width: none; max-height: none; min-width: 0; box-sizing: border-box; }

/* 结局 */

  }
  DOR.goSpot = goSpot;

  function goExit(s, o, ex) {
    let cost = 0;
    if (ex.spot && ex.spot !== s.spot) { cost = goSpot(s, o, ex.spot); if (s.spot !== ex.spot) return cost; }
    if (ex.cond) { const ok = ex.cond(s, o); if (!ok) return 4; }
    DOR.enterRoom(s, o, ex.to, ex.toSpot, ex.text);
    return cost + (ex.cost || 15);
  }
  DOR.enterRoom = function (s, o, to, spot, text) {
    const prev = s.room;
    if (C.rooms[prev] && C.rooms[prev].leave) C.rooms[prev].leave(s, o, to);
    s.room = to; s.spot = spot || C.rooms[to].start || Object.keys(C.rooms[to].spots)[0] || null;
    const cnt = U.cnt(s, 'enter:' + to);
    DOR.log(s, 'enter', { room: to, from: prev });
    o.scene(to);
    if (text) o.say(typeof text === 'function' ? text(s) : text);
    const r = C.rooms[to];
    if (r.enter) r.enter(s, o, cnt, prev);
    else DOR.describeRoom(s, o, cnt > 1);
    o.hud();
  };

  V['前进'] = (s, o, c) => nav(s, o, '前进');
  V['后退'] = (s, o, c) => nav(s, o, '后退');
  V['左转'] = (s, o, c) => nav(s, o, '左转');
  V['右转'] = (s, o, c) => nav(s, o, '右转');
  V['转身'] = (s, o, c) => nav(s, o, '转身');
  function nav(s, o, v) {
    const r = room(s);
    if (r.nav) { const res = r.nav(s, o, v); if (res !== false && res !== undefined) return res; }
    if (v === '左转' || v === '右转' || v === '转身') {
      s.face = (s.face + (v === '左转' ? 3 : v === '右转' ? 1 : 2)) % 4;
      o.say(U.cycle(s, 'turnline', [
        '四个轮子反向转动，小车在原地' + (v === '转身' ? '转了半圈' : '转了九十度') + '。摄像头杆晃了一下才停稳。',
        '原地转向。画面横着扫过去，' + (r.turnSee ? r.turnSee(s) : '房间换了一个角度。'),
        '车身转过去了。杆子比车身慢半拍。',
      ]));
      return 3;
    }
    if (v === '前进') {
      const ids = Object.keys(r.spots).filter(id => !(r.spots[id].show && !r.spots[id].show(s)));
      const i = ids.indexOf(s.spot);
      const unvisited = ids.filter(id => id !== s.spot && !U.get(s, 'visit:' + s.room + ':' + id));
      const next = unvisited[0] || (ids.length > 1 ? ids[(i + 1) % ids.length] : null);
      if (next && next !== s.spot) return goSpot(s, o, next);
      o.say(U.cycle(s, 'fwd', ['小车往前开了一小段。', '往前。轮子压过什么，颠了一下。', '往前开了一点，停住。'])); o.sys(placeList(s)); return 4;
    }
    if (v === '后退') { o.say(U.cycle(s, 'back', ['倒车。后面的超声波雷达滴滴响了两声。', '往后退了半米。'])); return 3; }
  }

  V['抬头'] = (s, o) => {
    const r = room(s);
    s.look = 'up';
    if (r.up) { const t = typeof r.up === 'function' ? r.up(s, o) : r.up; if (t) o.say(t); }
    else o.say('云台往上转。天花板。没什么特别的。');
    return 3;
  };
  V['低头'] = (s, o) => {
    const r = room(s);
    const was = s.look; s.look = 'level';
    if (was === 'up') o.say('云台转回水平。');
    if (r.down) { const t = typeof r.down === 'function' ? r.down(s, o) : r.down; if (t) o.say(t); }
    else if (was !== 'up') o.say('云台往下转，看见自己车头和两只前轮。轮子上有灰。');
    return 2;
  };

  V['车灯'] = (s, o, c) => {
    const w = c.words || '';
    const want = /关/.test(w) ? false : /开/.test(w) ? true : !s.light;
    if (want === s.light) { o.say(s.light ? '车灯本来就开着。' : '车灯本来就关着。'); return 1; }
    s.light = want;
    DOR.log(s, 'light', want);
    const r = room(s);
    if (r.onLight) { const t = r.onLight(s, o, want); if (t) { o.say(t); o.hud(); return 2; } }
    o.say(want ? '车灯打开。前面亮出一块发白的扇形。' : '车灯关掉。');
    o.hud();
    return 2;
  };

  V['喇叭'] = (s, o, c) => {
    U.cnt(s, 'horn');
    DOR.log(s, 'horn', { room: s.room });
    o.sound('horn');
    const r = room(s);
    if (r.onHorn) { const t = r.onHorn(s, o); if (t !== undefined) { if (t) o.say(t); return 2; } }
    o.say(U.cycle(s, 'hornline', ['嘟。', '嘟——。声音比想象中小，像一个很有礼貌的玩具。', '嘟。']));
    return 2;
  };

  V['收杆'] = (s, o) => {
    if (s.mast === 'down') { o.say('杆子已经收到最低了。'); return 1; }
    s.mast = 'down'; DOR.log(s, 'mast', 'down');
    const r = room(s);
    o.say(r.lowView ? (typeof r.lowView === 'function' ? r.lowView(s) : r.lowView) : '摄像头杆一节一节缩回去。画面从一米五降到四十厘米：桌子变成天花板，椅子腿变成树林。');
    o.hud();
    return 4;
  };
  V['升杆'] = (s, o) => {
    if (s.mast === 'up') { o.say('杆子已经升到一米五了。'); return 1; }
    const r = room(s);
    if (r.canRaise && !r.canRaise(s, o)) return 2;
    s.mast = 'up'; DOR.log(s, 'mast', 'up');
    o.say('杆子一节一节伸出来，回到一米五。世界恢复成原来的大小。');
    o.hud();
    return 4;
  };

  V['夹'] = (s, o, c) => {
    const t = c.target;
    if (!t || t.kind !== 'obj') { o.say('夹什么？'); return 0; }
    const ob = t.o;
    if (s.tool === '磁铁' && !ob.magnetic) { o.say('现在装的是磁铁头，吸不住〔' + ob.names[0] + '〕。（可以〔换夹爪〕。）'); return 2; }
    if (!ob.portable) { o.say(ob.heavy || U.cycle(s, 'cantTake', ['夹爪合上，又滑开了。拿不起来。', '这个拿不动。', '机械臂试了一下，放弃了。'])); return 4; }
    if (s.held) { o.say('夹爪里已经有〔' + C.objs[s.held].names[0] + '〕了。先放下，或者放进车斗。'); return 1; }
    s.held = ob.id; DOR.log(s, 'take', ob.id);
    if (ob.onTake) ob.onTake(s, o); else o.say('机械臂伸出去，夹住〔' + ob.names[0] + '〕，收回来。');
    return 5;
  };
  V['放'] = (s, o, c) => {
    const t = c.target;
    let id = t && t.kind === 'obj' ? t.o.id : s.held;
    if (!id) { o.say('夹爪是空的。'); return 1; }
    if (/车斗|后面|身上|带着/.test(c.words || '')) {
      if (s.held !== id) { o.say('先把它夹起来。'); return 1; }
      s.held = null; s.cargo.push(id); DOR.log(s, 'stow', id);
      o.say('你把〔' + C.objs[id].names[0] + '〕放进车尾的小斗里。它在里面滚了半圈，停住。');
      return 4;
    }
    if (s.held === id) {
      const ob = C.objs[id];
      s.held = null; DOR.log(s, 'drop', { id, room: s.room, spot: s.spot });
      s.w['pos:' + id] = { room: s.room, spot: s.spot };
      if (ob.onDrop) ob.onDrop(s, o); else o.say('夹爪松开。〔' + ob.names[0] + '〕放在了这里。');
      return 4;
    }
    const i = s.cargo.indexOf(id);
    if (i >= 0) { s.cargo.splice(i, 1); s.w['pos:' + id] = { room: s.room, spot: s.spot }; DOR.log(s, 'drop', { id, room: s.room }); o.say('你把〔' + C.objs[id].names[0] + '〕从车斗里拿出来，放在地上。'); return 4; }
    o.say('你没拿着它。'); return 1;
  };

  V['推'] = (s, o, c) => {
    const t = c.target;
    if (!t) { o.say('推什么？'); return 0; }
    if (t.kind !== 'obj') { o.say('你往那边顶了一下。'); return 3; }
    const ob = t.o;
    o.say(ob.pushText ? (typeof ob.pushText === 'function' ? ob.pushText(s) : ob.pushText) : U.cycle(s, 'push', ['车头顶上去。〔' + ob.names[0] + '〕没动。', '推不动。车轮在原地空转了半圈。', '顶了一下。它晃了晃，又站稳了。']));
    DOR.log(s, 'push', ob.id);
    return 4;
  };
  V['拉'] = (s, o, c) => { o.say('夹爪抓住，往后拉。没什么变化。'); return 4; };
  V['按'] = (s, o, c) => {
    const t = c.target;
    if (!t || t.kind !== 'obj') { o.say('按哪里？'); return 0; }
    o.say(U.cycle(s, 'press', ['机械臂按了一下〔' + t.o.names[0] + '〕。没有反应。', '按下去，没什么反应。', '按了。什么都没发生。']));
    return 3;
  };
  V['摆'] = (s, o, c) => {
    const t = c.target;
    if (!t || t.kind !== 'obj') { o.say('摆弄什么？'); return 0; }
    o.say('你用夹爪把〔' + t.o.names[0] + '〕挪了一点点。现在它稍微有点歪。');
    DOR.log(s, 'tilt', t.o.id);
    return 4;
  };
  V['照'] = (s, o, c) => {
    if (!s.light) { s.light = true; o.say('车灯打开。'); o.hud(); }
    const t = c.target;
    if (t && t.kind === 'obj') return DOR.look(s, t.o, o);
    DOR.describeRoom(s, o); return 5;
  };
  V['吸'] = (s, o, c) => {
    if (s.tool !== '磁铁') { s.tool = '磁铁'; o.say('机械臂末端换成磁铁头，咔一声吸到位。'); }
    const t = c.target;
    if (!t || t.kind !== 'obj') { o.say('磁铁悬在半空。附近没有什么被吸过来。'); return 3; }
    if (!t.o.magnetic) { o.say('〔' + t.o.names[0] + '〕不是铁的。磁铁贴上去，什么也没吸住。'); return 3; }
    return V['夹'](s, o, c);
  };
  V['换'] = (s, o, c) => {
    const w = c.words || '';
    const next = /磁/.test(w) ? '磁铁' : /夹|爪/.test(w) ? '夹爪' : (s.tool === '夹爪' ? '磁铁' : '夹爪');
    if (next === s.tool) { o.say('现在装的就是' + next + '。'); return 1; }
    if (s.held) { o.say('先把夹着的〔' + C.objs[s.held].names[0] + '〕放下。'); return 1; }
    s.tool = next; DOR.log(s, 'tool', next);
    o.say(next === '磁铁' ? '机械臂把夹爪头卸在车身侧面的卡槽里，换上磁铁头。咔。' : '磁铁头卸下，夹爪装回去。咔。');
    o.hud();
    return 4;
  };

  V['拍'] = (s, o, c) => {
    const r = room(s);
    U.cnt(s, 'photos');
    const subj = [];
    if (c.target && c.target.kind === 'obj') subj.push(c.target.o.id);
    if (U.dlHere(s)) subj.push('dl');
    DOR.log(s, 'photo', { room: s.room, spot: s.spot, subj, light: s.light, mast: s.mast });
    o.sound('shutter');
    if (r.onPhoto) { const t = r.onPhoto(s, o, c); if (t) { o.say(t); return 3; } }
    o.say(U.cycle(s, 'photoline', ['咔嚓。画面停了一帧，存进了本地相册。', '咔嚓。', '拍了。']));
    return 3;
  };

  V['等'] = (s, o) => {
    const r = room(s);
    if (r.onWait) { const t = r.onWait(s, o); if (t !== undefined) { if (t) o.say(t); return 30; } }
    o.say(U.cycle(s, 'wait', ['你停着，什么也不做。', '等了一会儿。', '时间过去了一点。']));
    return 30;
  };

  V['跟'] = (s, o) => {
    if (s.dl.room !== s.room) { o.say('dl不在这里。'); return 1; }
    if (DOR.dlFollow) return DOR.dlFollow(s, o);
    o.say('你跟在dl后面。');
    return 6;
  };

  V['说'] = (s, o, c) => {
    const txt = (c.say || '').trim();
    if (!txt) { o.sys('要说什么？（例：说 你好）'); return 0; }
    DOR.log(s, 'say', txt);
    o.blocks.push({ k: 'me', text: txt });
    if (DOR.dlHear) DOR.dlHear(s, o, txt);
    return 4;
  };

  V['写'] = (s, o, c) => { o.say('这里没有可以写字的地方。'); return 1; };

  V['钻'] = (s, o, c) => { o.say('这里没有可以钻进去的地方。'); return 1; };

  V['离开'] = (s, o, c) => {
    const r = room(s);
    if (r.onLeave) { const t = r.onLeave(s, o); if (t !== undefined) return t; }
    o.say('往哪里走？' + placeList(s));
    return 0;
  };

  V['状态'] = (s, o) => {
    o.sys([
      'R07 访客遥控车 · 固件 2019.06',
      '摄像头杆：' + (s.mast === 'up' ? '一米五（标准访客视角）' : '收起（四十厘米）'),
      '车灯：' + (s.light ? '开' : '关') + '　机械臂：' + s.tool + (s.held ? '（夹着' + C.objs[s.held].names[0] + '）' : ''),
      '车斗：' + (s.cargo.length ? s.cargo.map(id => C.objs[id].names[0]).join('、') : '空'),
    ].join('\n'));
    return 0;
  };

  V['帮助'] = (s, o) => {
    o.sys([
      '操作说明',
      '点击画面里的〔东西〕可以看到能对它做什么；点击〖地方〗可以开过去。也可以直接打字。',
      '常用：看　环顾　去（地方）　前进　后退　左转　右转　转身　抬头　低头',
      '小车：车灯　喇叭　收杆（摄像头降到四十厘米）　升杆　拍照　状态',
      '机械臂：夹　放（放进车斗：放X到车斗）　推　拉　按　摆　照　吸（磁铁）　换磁铁／换夹爪',
      '其他：跟着dl　等　说（打字给dl看）',
    ].join('\n'));
    return 0;
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
// 连接之前：2019年的旧帖子、旧网站、排队、管理员入口、设备列表。
// 核心只管状态和命令；网页端按页面编号渲染成真的网页，命令行渲染成文字。
(function (G) {
  'use strict';
  const DOR = G.DOR; const U = DOR.U; const def = DOR.def; const D = DOR.data;

  function page(o, id, extra) { o.blocks.push(Object.assign({ k: 'page', id }, extra || {})); }
  DOR.page = page;

  def.phase('web', {
    start(s, o) {
      s.w.page = 'post'; s.w.scroll = 0;
      page(o, 'post', { scroll: 0 });
    },
    exclusiveActions: true,
    actions(s) {
      const p = s.w.page; const a = [];
      if (p === 'post') {
        a.push({ g: '网页', label: '往下滑评论', cmd: '往下滑' });
        if (s.w.scroll > 0) a.push({ g: '网页', label: '滑到最后', cmd: '滑到最后' });
        a.push({ g: '网页', label: '回复…', cmd: '回复 ', fill: true });
        a.push({ g: '网页', label: '打开入口链接', cmd: '打开链接' });
      } else if (p === 'site' || p === 'about' || p === 'game1' || p === 'game2' || p === 'buy' || p === 'gallery') {
        for (const n of ['首页', '真实的梦', '真实的梦2', '图片', '购买', '关于我们', '远程参观']) a.push({ g: '网页', label: n, cmd: '点 ' + n });
        a.push({ g: '网页', label: '返回帖子', cmd: '返回帖子' });
      } else if (p === 'visit') {
        a.push({ g: '网页', label: '输入名字…', cmd: '名字 ', fill: true });
        a.push({ g: '网页', label: s.w.noRec ? '影像留存：关' : '影像留存：开', cmd: s.w.noRec ? '打开影像留存' : '关闭影像留存' });
        if (s.name) a.push({ g: '网页', label: '连接', cmd: '连接' });
        a.push({ g: '网页', label: '返回首页', cmd: '点 首页' });
      } else if (p === 'queue') {
        a.push({ g: '网页', label: '等', cmd: '等' });
      } else if (p === 'nocar') {
        a.push({ g: '网页', label: '管理员入口', cmd: '管理员入口' });
        a.push({ g: '网页', label: '看聊天备份', cmd: '看聊天备份' });
        a.push({ g: '网页', label: '继续等待', cmd: '等' });
      } else if (p === 'admin') {
        a.push({ g: '网页', label: '看聊天备份', cmd: '看聊天备份' });
        a.push({ g: '网页', label: '唤醒 Visitor unit 07 并连接', cmd: '连接07' });
        a.push({ g: '网页', label: '连接 D02', cmd: '连接D02' });
      }
      return a;
    },
    intercept(s, c, o) {
      const w = (c.words || c.raw || '').replace(/\s+/g, '');
      const raw = c.raw || '';
      const p = s.w.page;
      // 任何页面都可以回到帖子或者回复
      if (/^(回复|评论|发表)/.test(raw) || c.v === '说') {
        const txt = raw.replace(/^(回复|评论|发表|说)[：:\s]*/, '').trim();
        if (p !== 'post') { go(s, o, 'post'); }
        if (!txt) { o.sys('回复框是空的。（例：回复 我也来排队了）'); return true; }
        if (s.w.reply) { o.sys('你已经回复过一条了。它挂在第438楼。'); return true; }
        s.w.reply = txt.slice(0, 120);
        DOR.log(s, 'reply2019', s.w.reply);
        page(o, 'post', { scroll: 999, replied: true });
        o.sys('发表成功。');
        return true;
      }
      if (/返回帖子|回到帖子|帖子/.test(w)) { go(s, o, 'post'); return true; }
      if (p === 'post') {
        if (/滑到最后|最后|到底/.test(w)) { s.w.scroll = D.comments.length; DOR.log(s, 'scroll', 'end'); page(o, 'post', { scroll: s.w.scroll }); return true; }
        if (/滑|往下|下一页|更多|看评论|评论|翻/.test(w) || c.v === '前进') {
          s.w.scroll = Math.min(D.comments.length, s.w.scroll + 20);
          U.cnt(s, 'scroll');
          page(o, 'post', { scroll: s.w.scroll });
          return true;
        }
        if (/链接|入口|网址|打开|点开|visit|sonebb/i.test(w)) { go(s, o, 'site'); return true; }
        if (c.v === '看' || c.v === '环顾') { page(o, 'post', { scroll: s.w.scroll }); return true; }
      }
      if (/首页/.test(w)) { go(s, o, 'site'); return true; }
      if (/关于/.test(w)) { go(s, o, 'about'); return true; }
      if (/购买|买/.test(w)) { go(s, o, 'buy'); return true; }
      if (/图片|相册/.test(w)) { go(s, o, 'gallery'); return true; }
      if (/真实的梦2|二代/.test(w)) { go(s, o, 'game2'); return true; }
      if (/真实的梦/.test(w)) { go(s, o, 'game1'); return true; }
      if (/远程参观|参观/.test(w) && p !== 'visit') { go(s, o, 'visit'); return true; }
      if (/^(名字|输入名字|我叫|昵称|name)/i.test(raw)) {
        if (p !== 'visit') go(s, o, 'visit');
        const nm = raw.replace(/^(输入名字|名字|我叫|昵称|name)[：:\s]*/i, '').trim().slice(0, 16);
        if (!nm) { o.sys('名字不能为空。'); return true; }
        s.name = nm; DOR.log(s, 'name', nm);
        page(o, 'visit', { name: nm });
        return true;
      }
      if (p === 'visit' && /留存|影像|录像/.test(w)) {
        s.w.noRec = /关|不|取消/.test(w) ? true : /开/.test(w) ? false : !s.w.noRec;
        DOR.log(s, 'noRec', s.w.noRec);
        page(o, 'visit', { name: s.name });
        o.sys('影像留存：' + (s.w.noRec ? '关' : '开'));
        return true;
      }
      if (p === 'visit' && /连接|开始|排队|进入/.test(w)) {
        if (!s.name) { o.sys('请先输入显示名称。（例：名字 小北）'); return true; }
        s.w.page = 'queue'; DOR.log(s, 'queue', 436);
        o.blocks.push({ k: 'queue', from: 436 });
        s.w.page = 'nocar';
        page(o, 'nocar');
        return true;
      }
      if (p === 'queue' || p === 'nocar') {
        if (/管理员|admin|后台/.test(w)) { adminLogin(s, o); return true; }
        if (/聊天/.test(w)) { chat(s, o); return true; }
        if (c.v === '等') {
          const n = U.cnt(s, 'nocarwait');
          o.sys(['正在为您分配访客车……', '没有可用的访客车。请稍候。', '没有可用的访客车。'][Math.min(n - 1, 2)]);
          return true;
        }
      }
      if (p === 'admin') {
        if (/聊天/.test(w)) { chat(s, o); return true; }
        if (/D02|d02|维护/.test(w)) { o.sys('D02 正在执行任务，不接受远程接管。'); return true; }
        if (/07|唤醒|连接|访客车/.test(w)) { connect(s, o); return true; }
      }
      if (/聊天/.test(w) && s.w.adminSeen) { chat(s, o); return true; }
      if (c.v === '帮助') { o.sys('这是一个网页。可以点页面上的链接和按钮；也可以输入：往下滑、回复 （内容）、打开链接、关于我们、名字 （你的名字）、连接。'); return true; }
      if (c.v === '看' || c.v === '环顾') { page(o, s.w.page, { scroll: s.w.scroll }); return true; }
      o.sys('（这是一个网页。点页面上的东西，或者输入“帮助”。）');
      return true;
    },
  });

  function go(s, o, id) {
    s.w.page = id; U.cnt(s, 'page:' + id);
    DOR.log(s, 'page', id);
    page(o, id, { scroll: s.w.scroll, name: s.name });
  }
  function adminLogin(s, o) {
    s.w.page = 'admin'; s.w.adminSeen = true;
    DOR.log(s, 'admin', true);
    page(o, 'admin', { devices: D.devices(false) });
  }
  function chat(s, o) {
    U.cnt(s, 'chat');
    DOR.log(s, 'chat', true);
    page(o, 'chat', { chat: D.chat });
  }
  function connect(s, o) {
    DOR.log(s, 'connect', { name: s.name, readChat: !!s.n.chat, reply: !!s.w.reply });
    s.phase = 'office1';
    s.room = 'office'; s.spot = 'tv';
    s.t = 0;
    o.blocks.push({ k: 'connect' });
    DOR.C.phases.office1.start(s, o);
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
// 连接 → 广告 → 电视边框 → 屏幕里是你 → 办公室
(function (G) {
  'use strict';
  const DOR = G.DOR; const U = DOR.U; const def = DOR.def;

  function hour(s) { const d = new Date(new Date(s.now).getTime() + s.t * 1000); return d.getHours(); }
  DOR.hour = hour;
  function windowOut(s) {
    const h = hour(s);
    if (h >= 22 || h < 5) return '窗外是夜里。雨把远处的路灯拉成一条一条的。';
    if (h < 7) return '窗外天刚有一点灰。雨很细，看不出是在下还是停了。';
    if (h < 17) return '窗外是阴天的白。雨斜着打在玻璃上，一道一道往下流。';
    if (h < 19) return '窗外开始暗了。雨里有一点黄色的光，不知道是哪里的灯。';
    return '窗外是晚上。雨把对面楼的灯泡成一团一团的。';
  }
  DOR.windowOut = windowOut;

  // ---------------- 连接和广告 ----------------
  def.phase('office1', {
    start(s, o) {
      s.w.ad = 0;
      o.scene('black');
      o.pause(900);
      o.sound('handshake');
      o.sys('正在连接 Visitor unit 07 ……');
      o.pause(1400);
      o.sys('握手：OK　延迟：412ms');
      o.pause(1200);
      o.say('黑的。');
      o.sound('rain_wall', 'start');
      o.pause(2600);
      o.say('黑里有雨声。很闷，隔着一堵墙的那种。');
      o.pause(2600);
      o.sys('摄像头初始化：噪点……曝光……对焦……');
      o.pause(1800);
      o.sound('ad_music', 'start');
      o.scene('ad');
      o.say([
        '对上焦的一瞬间，音乐先到。弦乐，然后是合唱，像发布会开场。',
        '',
        '画面是一间非常漂亮的办公室。一整面落地窗，阳光铺在地板上。绿植，白桌子，十几个人在工作。有人在白板上画东西，有人抱着一摞盒子走过去。墙上挂着一张巨大的海报。',
        '靠窗的一个人转过头，冲着镜头笑了一下。',
        '',
        '　　《真实的梦2》',
        '　　预计将在2019年推出。敬请期待。',
      ]);
      o.pause(800);
      o.sys('操作：前进　后退　左转　右转　抬头　低头（也可以点下方按钮）');
      o.hud();
    },
    actions(s) {
      if (s.w.ad < 4) return [
        { g: '驾驶', label: '前进', cmd: '前进' }, { g: '驾驶', label: '后退', cmd: '后退' },
        { g: '驾驶', label: '左转', cmd: '左转' }, { g: '驾驶', label: '右转', cmd: '右转' }, { g: '驾驶', label: '抬头', cmd: '抬头' },
      ];
      return null;
    },
    get exclusiveActions() { return false; },
    intercept(s, c, o) {
      if (s.w.ad >= 4) return false;
      const moveish = ['前进', '后退', '左转', '右转', '转身', '抬头', '低头', '去', '环顾', '看', '收杆', '升杆', '车灯', '喇叭', '等'].indexOf(c.v) >= 0;
      if (!moveish) { o.say('画面里的人还在笑。音乐还在放。（试试开一下车：前进、左转、右转……）'); return true; }
      if (c.v === '车灯' || c.v === '喇叭') { DOR.dispatch(s, c, o); }
      s.w.ad++;
      DOR.log(s, 'adstep', s.w.ad);
      if (s.w.ad === 1) {
        o.say(c.v === '后退' ? '你往后倒了一点。画面右边缘出现一条黑色的竖线。' : '镜头一动，画面右边缘出现一条黑色的竖线。');
        o.say('画面里的人没有注意到。他们还在工作。');
      } else if (s.w.ad === 2) {
        o.say('再动一点。那条竖线变宽，变成一道边。边上有一个小小的、亮着的红点。');
        o.say('是电视的外框。');
      } else if (s.w.ad === 3) {
        s.w.ad = 4;
        o.scene('office');
        o.say([
          '再动一点。看见支架，支架上积着一指厚的灰。地上盘着电线，有一截被什么东西咬过。',
          '',
          '音乐还在放。电视里的人还在笑。',
          '',
          '电视外面，天花板塌了一角。一根钢筋垂下来，水顺着它往下滴，滴进一个已经接满的〔桶〕。满到水面鼓起来一点，每滴一滴，就从桶沿溢出去一点。',
          '墙上的〔电子钟〕还在走。' + U.clock(s) + '。',
        ]);
        o.sound('drip', 'start');
        o.pause(1500);
        o.say('这是现在的时间。');
        adEnd(s, o);
      }
      return true;
    },
  });

  function adEnd(s, o) {
    o.pause(2500);
    o.say('广告还剩最后几秒。所有人一起看向镜头，笑着挥手。一个人说：“到时候见！”');
    o.sound('ad_music', 'stop');
    o.pause(1600);
    o.say('电视自己待机了。屏幕黑下来。');
    o.pause(1600);
    o.say([
      '黑下来的屏幕是反光的。你就在它前面。',
      '',
      '一台发黄的四轮小车。车身不大，像个行李箱放倒了。一根细长的杆子从车身中间伸出来，顶端是一个云台摄像头，和一个人的眼睛一样高。杆子旁边折着一只机械臂。车头贴着编号：R07。',
      '',
      '整台车看起来像一盏被放在滑板上的落地灯。',
    ]);
    o.pause(1200);
    DOR.log(s, 'mirror', true);
    s.phase = 'office';
    o.hud();
    o.sys('视觉标注：〔电视〕 〔电子钟〕 〔桶〕 〔工位〕 〔海报〕 〔窗〕');
    o.sys(DOR.placeList(s));
  }

  // ---------------- 办公室 ----------------
  def.room('office', {
    name: '办公室',
    start: 'tv',
    spots: {
      tv: { name: '电视前', names: ['电视前', '电视那边'], desc: s => '电视黑着。你在里面。' },
      desks: {
        name: '工位', names: ['工位', '工位区', '桌子', '办公桌'],
        arrive: (s, o, n) => n === 1 ? '你从两排工位中间开过去。杆子太高，差点挂到吊着的一根网线。' : '回到工位中间。',
        desc: s => '六张桌子拼成两排。椅子都推进去了，像下班以前有人挨个推过。桌上压着一层灰，灰上有很多条细细的直线——别的机器每隔一段时间来擦一次，擦不到角落。',
      },
      window: {
        name: '窗边', names: ['窗边', '窗户', '窗前'],
        arrive: (s, o, n) => n === 1 ? '你开到窗边。玻璃很大，从地到天花板，和广告里是同一面窗。' : '回到窗边。',
        desc: s => DOR.windowOut(s),
      },
      wall: {
        name: '海报墙', names: ['海报墙', '墙', '照片墙', '合照墙'],
        arrive: (s, o, n) => n === 1 ? '你开到墙边。墙上挂着的东西比广告里少，钉子比挂着的东西多。' : '回到海报墙前。',
      },
      door: {
        name: '走廊口', names: ['走廊口', '门口', '走廊那边', '出口'],
        arrive: (s, o, n) => n === 1 ? '办公室侧面有一个没有门的门洞。后面是一条走廊。走廊里是真的黑，车灯照进去也只亮开两三米。' : '回到走廊口。',
      },
    },
    exits: [
      {
        to: 'corridor', names: ['走廊', '漆黑的走廊', '黑走廊', '黑的走廊'], label: '漆黑的走廊', spot: 'door',
        cond: (s, o) => {
          if (s.phase === 'tour1' && !s.f.tour1Done) { o.say('dl停在你前面，车身横过来一点，刚好挡住走廊口。它还没介绍完。'); return false; }
          if (s.phase === 'tour1' && s.f.tour1Done) return true;
          return true;
        },
      },
      { to: 'atrium', names: ['天井', '休息区'], label: '天井', show: s => s.f.tour1Done && s.phase === 'tour1', spot: 'door' },
    ],
    describe(s, o, q) {
      if (s.phase === 'home' || s.phase === 'day2') return DOR.homeOffice ? DOR.homeOffice(s) : '';
      const lines = [
        '办公室。和广告里是同一个房间，只是晚了七年。',
        '天花板塌了一角，水滴进满了的〔桶〕里。〔电视〕黑着。〔电子钟〕显示' + U.clock(s) + '。',
        '靠墙是两排〔工位〕，窗那边是一整面落地〔窗〕。墙上有一张泡了水的〔海报〕。侧面有一条黑着的〔走廊〕。',
      ];
      if (s.w.bucketSpill) lines.push('桶边的地上有一小滩水，是你刚才撞出来的。');
      return lines;
    },
    up: s => '天花板塌掉的那一角能看见上面的钢筋和一截管道。水不是从管道漏的，是从更上面渗下来的，顺着钢筋走到最低点，再往下掉。那个最低点正对着桶。像有人算过。',
    turnSee: s => DOR.pick(s, ['工位一排排横过去。', '窗外的雨横着扫过去。', '电视、桶、钟，一样一样横过去。']),
    onHorn: s => s.phase === 'office' ? U.cycle(s, 'offhorn', ['嘟。办公室里没有人回头。', '嘟。雨声没有变。', '嘟。']) : undefined,
    lowView: s => '杆子缩回去，画面降到四十厘米。桌子变成一片一片的屋顶，桌子底下是另一个世界：一只拖鞋，一根充电线，一颗滚到墙角的螺丝。',
  });

  // ---------------- 办公室里的东西 ----------------
  const O = def.obj;
  O('tv', {
    names: ['电视', '电视机', '屏幕', '黑屏'], room: 'office', spot: 'tv',
    look: s => s.phase === 'day2' ? '电视黑着。屏幕上映出你，和你身后空着的那个位置。' : [
      '电视黑着。黑屏里映出一台发黄的小车，和一根一米五的杆子。你往左转，它也往左转。',
      '你在屏幕里。杆子顶上那个摄像头，就是你现在看东西用的眼睛。',
      '黑屏。你，和身后塌掉的天花板。',
    ],
    farLook: '电视在房间那头，黑着。',
    verbs: {
      按: (s, o) => {
        const n = U.cnt(s, 'tvon');
        o.sound('ad_music', 'start', { short: true });
        o.say(n === 1 ? '你按了电视侧面的键。屏幕亮了，又是那段广告，从头开始。落地窗、阳光、十几个人。你看了几秒，关掉了。' : '广告又开始放。关掉。');
        o.sound('ad_music', 'stop');
        DOR.log(s, 'tvReplay', n);
        return 6;
      },
      拍: (s, o) => { DOR.log(s, 'photo', { room: 'office', subj: ['tv', 'self'] }); o.sound('shutter'); o.say('你对着黑屏拍了一张。照片里是一台小车在给自己拍照。'); return 3; },
    },
  });
  O('clock', {
    names: ['电子钟', '钟', '时钟'], room: 'office', far: true,
    look: s => ['墙上的电子钟。红色的数字：' + U.clock(s) + '。秒点一下一下地闪。它不知道已经过了多少年，只知道现在是几点。', '电子钟：' + U.clock(s) + '。'],
    verbs: { 按: (s, o) => { o.say('够不到，钟挂得比杆子还高。'); return 2; } },
  });
  O('bucket', {
    names: ['桶', '水桶', '红桶'], room: 'office', spot: 'tv', near: ['desks'],
    look: s => s.w.bucketSpill ? '红色的塑料桶，满的。刚才撞过以后，水位低了一指，又在慢慢变满。' : ['一只红色的塑料桶，满的。水面鼓起来，每掉一滴就溢出去一点。桶边的地上有一圈干掉的水渍，一圈套一圈，像树的年轮。', '桶还是满的。'],
    pushText: s => { s.w.bucketSpill = true; DOR.log(s, 'bucket', 'spill'); return U.once(s, 'bucketpush') ? '你用车头顶了一下桶。桶很沉，只晃了晃，水从一边泼出去一大片，漫到你轮子底下。雨滴继续往里掉，开始重新接满。' : '桶晃了一下，又溢出去一点。'; },
    verbs: {
      夹: (s, o) => { o.say('桶太沉了，满的。夹爪夹住桶沿，桶没动，你的车身往前倾了一点。'); return 3; },
      拉: (s, o) => { o.say('你试着把桶拉开一点，让它接不到水。它太沉了。而且拉开了，水就会滴在地板上。'); return 3; },
    },
  });
  O('ceiling', { names: ['天花板', '钢筋', '塌掉的天花板'], room: 'office', hidden: true, tag: false, look: s => DOR.C.rooms.office.up(s) });
  O('desk', {
    names: ['工位', '桌子', '办公桌', '椅子'], room: 'office', spot: 'desks',
    look: s => '六张桌子。每张桌上都还有一点东西：一个杯子、一本便签、一只落了灰的手办。靠里那张的〔旧电脑〕屏幕朝着窗。桌角压着一张打印的〔发布计划〕，隔壁一张桌子底下是一个〔纸箱〕。',
    farLook: '两排工位，灰扑扑的。',
    verbs: { 推: (s, o) => { o.say('你推了一下椅子。它滑出去半米，轮子吱了一声，停在过道中间。你没有把它推回去。'); s.w.chairOut = true; DOR.log(s, 'chair', 'out'); return 4; } },
  });
  O('plan', {
    names: ['发布计划', '计划', '打印纸', '计划表'], room: 'office', spot: 'desks', far: false,
    look: s => [
      '一张打印的发布计划，A4纸，被压在桌角。标题是“《真实的梦2》发布计划”。\n发布日期那一栏被改过四次：\n2019年8月　（划掉）\n2019年10月　（划掉）\n2019年12月　（划掉）\n2020年3月　（划掉）\n最后一次，用修正液涂成了一块白。白的上面什么也没写。',
      '发布日期：一块修正液的白。',
    ],
    portable: true,
    onTake: (s, o) => o.say('你把发布计划夹起来。纸很脆，边上一碰就掉了一小片。'),
  });
  O('merch', {
    names: ['纸箱', '周边', '箱子', '周边箱'], room: 'office', spot: 'desks',
    look: s => ['桌子底下一个纸箱，封箱胶带缠了三层，没拆过。侧面用马克笔写着：“周边 T恤 L×40 M×60”。', '没拆过的周边。一百件T恤。'],
    verbs: {
      拉: (s, o) => { o.say('夹爪抠开胶带的一个角。里面露出一截T恤，印着一台很小的四轮车，杆子高高的。你把胶带按回去了。'); DOR.log(s, 'merch', 'peek'); s.f.merchPeek = true; return 5; },
      按: (s, o) => DOR.C.objs.merch.verbs['拉'](s, o),
      推: (s, o) => { o.say('纸箱很沉，推不动。一百件T恤。'); return 3; },
    },
  });
  O('pc', {
    names: ['旧电脑', '电脑', '显示器', '主机'], room: 'office', spot: 'desks',
    look: s => s.w.pcOn ? pcScreen(s) : ['靠里那张桌上一台旧电脑。显示器朝着窗，屏幕上一层灰。主机的电源灯是暗的。', '旧电脑，关着。'],
    verbs: {
      按: (s, o) => {
        if (s.w.pcOn) { o.say(pcScreen(s)); return 4; }
        const n = U.cnt(s, 'pcpress');
        if (n === 1) { o.say('你用机械臂按了主机的电源键。风扇转起来，响得像要起飞，然后——停了。屏幕没亮。'); o.sound('fan_spinup'); return 6; }
        s.w.pcOn = true; DOR.log(s, 'pc', 'on');
        o.say('再按一次。风扇又转起来，这次没有停。硬盘咔哒咔哒响了很久。屏幕亮了，蓝色的，然后是一个很旧的桌面：一张天井的照片，一堆图标。');
        o.say('桌面上开着一个邮箱窗口，没有关。标题栏：“真实的梦 反馈”。');
        return 10;
      },
      看: false,
    },
  });
  // 邮件：只在电脑开着时出现

<script>
// dl：D02 维护车。它有自己的一天、自己的事、自己的笨。
// 说话规则：每句都短、具体、偶尔漏字、不发表感想、不解释。
(function (G) {
  'use strict';
  const DOR = G.DOR; const U = DOR.U; const def = DOR.def; const C = DOR.C;

  def.obj('dl', {

          '你用车头轻轻顶了它一下。它往前滑了十厘米，停住，摄像头转过来看你。然后转回去，继续做它的事。',
          '你又顶了它一下。这次它没转头，只是把自己挪回原来的位置。',
          '顶。它往旁边让开了。像让一个挡路的推车。',

      },
      喇叭: (s, o) => { DOR.dispatch(s, { v: '喇叭', words: '' }, o); return 2; },
      拍: (s, o) => {
        U.cnt(s, 'photos'); DOR.log(s, 'photo', { room: s.room, spot: s.spot, subj: ['dl'] }); o.sound('shutter');
        o.say(U.cycle(s, 'photodl', ['咔嚓。照片里的dl正好在转头，糊了。', '咔嚓。它没有看镜头。', '咔嚓。它正看着别的地方。']));
        return 3;
      },
      跟: (s, o) => DOR.dlFollow(s, o),
    },
  });

  // 它现在在干什么（旁白用）
  DOR.dlDoing = function (s) {
    const t = s.dl.task;
    const M = {
      rail: '它倒挂在天花板的轨道上，慢慢地开。',
      restack: '它在把撞翻的东西一个一个扶回原位。',
      battery: '它在充电架前面，试着给墙上一个小盒子换电池。盒子的盖板一松手就弹回去。',
      battery2: '它在把换下来的旧电池放进一个标着“废电池”的小桶里。',
      idle: '它停在充电位前面，摄像头慢慢地左右扫。',
      keyboard: '它在工作台前面，用机械臂一个键一个键地按键盘。',
      atrium: '它在天井里，停在你旁边不远。',

      charge: '它停在充电位上，灯慢慢地一明一暗。',
      still: '它跟在你后面。开得比平时慢，摄像头一会儿看左边的墙，一会儿看右边的墙。',
      desert: '它停在你旁边，看看沙丘，又看看你。',

  DOR.dlWhere = function (s) {

    if (busy || o.stop) return;
    if (!s.f.dlTalks || s.dl.room !== s.room || s.dl.task === 'gone') return;
    // 进门第一句（urgent）不等间隔
    const urgent = C.dlLines.find(l => l.urgent && !s.f['dl:' + l.id] && (!l.phase || l.phase === s.phase) && safe(l, s, cmd));

    if (hit(/谢/)) { o.say('它没有回。过了一会儿，它的轮子往你这边偏了一点点，又回正了。'); return; }
    if (hit(/名字|叫什么|你是谁/)) { o.dl(['D02。', '写在车头上的是dl。', '都可以。']); return; }
    if (hit(/B|老板|他去哪|人呢|人去哪|其他人|他们/)) { o.dl(U.cycle(s, 'b', ['不知道。', '……', '不知道。'])); return; }
    if (hit(/几年|多久|多少年|七年/)) { o.dl('巡检记录第一条是2019年9月7日。'); return; }
    if (hit(/孤独|寂寞|一个人|难过|伤心/)) { o.dl('？'); return; }
    if (hit(/喜欢/)) { o.dl('喜欢什么。'); return; }
    if (hit(/好玩|有趣|厉害|好看|漂亮/)) { o.dl(U.cycle(s, 'fun', ['嗯。', '这个是2019年做的。', '嗯。'])); return; }
    if (hit(/笨|傻|蠢/)) { o.dl('ERR 00：无此项'); return; }
    if (hit(/抱歉|对不起|不好意思/)) { o.dl('嗯。'); return; }

    if (hit(/累/)) { o.dl('电量71%。'); return; }

  };

  // dl掉下来
  function dlDrop(s, o) {

      ]);

      '两束光在半空里对上。',
    ] : [

    o.pause(1800);
    o.say([
      '然后它松开了轨道。',

      '掉下来，大概三米。落地前它在空中翻了个身，四轮着地，减震压到底，又弹起来一点。',
      '落地的风把旁边一摞东西撞翻了：几只空箱子，一个塑料筐，一卷线，稀里哗啦滚了一地。',
    ]);
    o.sound('thud');
    o.pause(1500);

  DOR.dlDrop = dlDrop;

  def.phase('dark', {
    actions(s) {
      const a = [];
      if (!s.f.dlDropped) { a.push({ g: '驾驶', label: '左转', cmd: '左转' }, { g: '驾驶', label: '右转', cmd: '右转' }, { g: '驾驶', label: '抬头', cmd: '抬头' }); if (!s.light) a.push({ g: '小车', label: '开车灯', cmd: '开灯' }); }
      else if (s.f.batteryRolled && !s.w.darkLit && s.mast === 'up') a.push({ g: '小车', label: '收杆', cmd: '收杆' });
      if (s.f.blind) return [{ g: '驾驶', label: '后退', cmd: '后退' }, { g: '驾驶', label: '左转', cmd: '左转' }, { g: '驾驶', label: '右转', cmd: '右转' }, { g: '机械臂', label: '夹住布', cmd: '夹布' }, { g: '机械臂', label: '拉布', cmd: '拉布' }];

      return a;
    },
    intercept(s, c, o) {

      if (!s.f.dlDropped && s.room === 'dark' && !busy) {

  // dl自己的一天：扶东西 → 换电池 → 旧电池滚到架子底下 → 转一会儿 → 自己开灯
  function progress(s, o, away) {
    const k = U.cnt(s, 'dlProg');
    const say = (t) => { if (o && !away) o.say(t); };
    if (s.dl.task === 'restack') {
      const step = U.cnt(s, 'restack');
      const lines = [
        'dl把第一只箱子扶正，推回墙边。',
        'dl把第二只箱子叠上去。然后是第三只。第三只放上去，滑下来了。',
        'dl把第三只重新放上去。又滑下来了。它停了一下，把第二只转了个方向，再放第三只。',
        '第三只立住了。dl把塑料筐扣在最上面，把那卷线推回角落。整个过程大概二十秒。',
      ];
      say(lines[Math.min(step - 1, 3)]);
      if (step >= 4) { s.dl.task = 'battery'; s.dl.spot = 'rack'; s.n.batteryStart = s.turn; if (o && !away) o.say('然后它开到充电架那边去了，像什么都没发生过。'); DOR.log(s, 'dlTask', 'battery'); }
      return;
    }
    if (s.dl.task === 'battery') {
      if (s.f.helpedBattery) return;
      const step = U.cnt(s, 'batt');
      if (!away && o) {
        if (s.spot !== 'rack' && step === 1) o.say('充电架那边：dl在墙上一个小盒子前面。它用机械臂掀开盒子的盖板，另一只……它没有另一只手。盖板一松开就弹回去了。');
        else if (step === 1) o.say('dl在你旁边，对着墙上一个小〔盒子〕。它用机械臂掀开盒子的盖板，想把一节电池塞进去。可是要塞电池，就得松开盖板。盖板一松开就“啪”地弹回去。');
        else if (step === 2) o.say('dl又掀开一次盖板。啪。弹回去了。');
        else if (step === 3) o.say('第三次。啪。dl停了一下，摄像头在盒子和电池之间转了两次，好像在想别的办法。');
        else if (step === 4) o.say('dl把电池咬在夹爪里，用杆子去顶盖板。杆子太滑，盖板又弹回去了。');
      }
      if (step >= 6) { s.dl.task = 'battery2'; batterySolved(s, away ? null : o, false); }
      return;
    }
    if (s.dl.task === 'battery2') {
      const step = U.cnt(s, 'batt2');
      if (step === 1) {
        s.f.batteryRolled = true; DOR.log(s, 'batteryRolled', true);
        if (o && !away) o.say('dl拿着换下来的旧电池往回开。电池从夹爪里滑出去，在地上弹了一下，骨碌碌滚进了〔充电架下面〕，停在最里面。dl停住，摄像头在架子底下和你之间来回转了两次。然后它没去捡，继续干别的。');
      }
      if (step >= 2) s.dl.task = 'idle';
      return;
    }
    if (s.dl.task === 'idle') {
      const step = U.cnt(s, 'idle');
      if (o && !away && step === 2) o.say('dl开到门边，对着门背后那张纸停了很久。');
      if (step >= (s.f.underRack ? 99 : 6) && !s.w.darkLit && !s.f.blind) {
        lightsOn(s, away ? null : o, 'dl');
      }
      return;
    }
    if (s.dl.task === 'keyboard' || s.dl.task === 'lead') return;
  }

  function batterySolved(s, o, byPlayer) {
    s.dl.task = 'battery2'; U.cnt(s, 'batt2Set');
    DOR.log(s, 'battery', byPlayer ? 'player' : 'dl');
    if (!o) return;
    if (byPlayer) {
      o.say('你用夹爪按住盖板。dl停了两秒。');
      o.pause(1200);
      o.say('然后它把电池塞进去，拧紧，退开。它没有看你，也没有别的表示。它继续做它的事。');
    } else {
      o.say('dl最后把车身斜过来，用整个车侧顶住盖板，一边顶一边把电池塞了进去。花了很久。');
    }
  }

  function coverCamera(s, o) {
    s.f.blind = true; s.n.blindStep = 0; DOR.log(s, 'blind', true);
    o.major = true;
    o.pause(800);
    o.say('你往后倒的时候，杆子碰到了什么。一块垂下来的检修布整片滑下来，盖在了摄像头上。');
    o.scene('blind');
    o.say('画面全黑。不是灯的问题——布纹贴在镜头上，车灯只把它照成一片发白的灰。');
    o.pause(1500);
    o.say('车没有失去控制。你只是看不见。');
    o.pause(2200);
    o.sys('D02 请求共享视野。已接受。');

  }
  DOR.coverCamera = coverCamera;

  function blindStep(s, c, o) {

    s.t += 4;

  // 灯亮以后的东西

  function card02Text() {

    look: s => ['某个充电位上停着一台被拆到一半的访客车，和你是同一个型号。杆子还在，杆子顶上的摄像头没了，只剩一个空的插座。四个轮子卸下来，放在旁边一个筐里。露出来的线用扎带理得很整齐，一束一束，扎带的尾巴都剪平了。', '拆到一半的车。线理得很整齐。'],

  def.obj('rules', {

    look: s => [
      '门背后贴着一张A4纸，四个角用胶带粘着，胶带发黄了。\n\n维护机器人工作规程（2019.05）\n1　每天九点巡检一次导览路线。\n2　灯坏了就换。换不了就记下来。\n3　植物按滴灌表来，不要自己加水。\n4　有访客时，维护机执行导览。导览结束后回到原任务。\n5　访客想碰什么就让他碰。\n6　不要跟访客抢东西。\n7　下雨天记得关天井顶。\n8　充电的时候不要开导览屏，费电。\n\n最下面手写了一行：9　不会的就问我。',
      '规程第4条：有访客时，维护机执行导览。',
    ],
    farLook: '门背后贴着一张纸。',

  def.obj('desk', {
    names: ['工作台', '键盘', '显示器'], room: 'dark', show: s => s.w.darkLit, spot: 'desk', far: true,
    look: s => s.f.dlTalks ? '工作台上的显示器开着，屏幕上就是你刚才那个访问页面。键盘上几个键磨得发亮：回车，空格，句号，还有“嗯”的拼音。' : '工作台上一台显示器、一副很旧的机械键盘。显示器是黑的。',
  });

  // 灯亮后：旧网页来消息，敲键盘的是它
  def.beat('message', {
    phase: 'dark', major: true, pri: 5,
    when: s => s.room === 'dark' && s.w.darkLit && s.turn > (s.n.litTurn || 0) + 1 && !s.f.dlTalks,
    run(s, o) {
      s.dl.task = 'keyboard';
      o.sound('notify');
      o.sys('访问页面：您有1条新消息。');
      o.pause(1200);
      o.sound('keys', 'start');
      o.say('房间角落传来敲击声。很慢，一下，停，一下。');
      o.say('你转过去：dl停在〔工作台〕前面，用机械臂一个键一个键地按一副很旧的键盘。显示器上开着的，就是你那个访问页面。');
      o.pause(1400);

      o.dl('你好');
      o.pause(900);
      o.typing(3800);
      o.dl('这里是维护区。访客不能进');

      o.typing(2600);
      o.dl('不过你已经进来了');

      DOR.log(s, 'dlTalks', true);
      o.pause(1000);
      o.say('不是谁在远方给你发消息。是眼前这台笨车，刚刚一个键一个键按出来的。');
      if (s.f.helpedBattery) o.say('它打完字，又对着那个温湿度计的方向停了一下。');
    },
  });
  def.beat('litAwayHint', {
    phase: 'dark', pri: 1,
    when: s => s.room !== 'dark' && s.w.darkLit && s.f.litAway,
    run: (s, o) => o.say(s.room === 'corridor' ? '走廊尽头那扇门的门缝底下，透出一条光。刚才还没有。' : '走廊那头亮了。有光从门洞里斜着照出来，落在办公室的地上。'),
  });
  def.beat('tourStart', {
    phase: 'dark', major: true, pri: 4,
    when: s => s.room === 'dark' && s.f.dlTalks && !s.f.tourOn && s.turn > (s.n.dlLastTurn || 0) + 2,
    run(s, o) {
      o.typing(3000);
      o.dl('按规程第4条');
      o.typing(2200);
      o.dl('执行导览');
      o.pause(1000);
      s.f.tourOn = true; s.dl.task = 'lead'; s.dl.spot = 'door';
      DOR.log(s, 'tourOn', true);
      o.say('dl开到门口。杆子顶上那块小屏幕亮了，一行绿色的字：导览进行中。');
      o.pause(1000);
      o.sound('tour_voice');
      o.say('它车身里的小喇叭响了。是一段录音，一个男人的声音，有一点点不好意思：\n\n“你都来了，就进来看看吧。”');
      o.pause(1500);
      o.say(s.f.helpedBattery ? '然后它用车身顶住那扇弹簧门，停在那里，等你先过。' : '然后它推开那扇弹簧门，自己先出去了。门在你面前慢慢合上一半。');
      o.sys('（〔跟着dl〕）');
    },
  });

  // dl在黑房间的碎碎念
  def.dl([
    { id: 'd_battery', phase: 'dark', when: s => s.f.helpedBattery && s.f.dlTalks, pri: 2, text: '温湿度计21.4度' },
  ]);
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
// 参观1：回到办公室。平板里是2019年正在发生。
(function (G) {
  'use strict';
  const DOR = G.DOR; const U = DOR.U; const def = DOR.def; const C = DOR.C;

  // 黑房间被布盖住：离开架子底下或者待太久也会触发
  def.beat('coverLeave', { phase: 'dark', major: true, pri: 6,
    when: s => s.f.underRack && !s.f.blind && !s.w.darkLit && !s.f.freedByShare && (s.spot !== 'under' || s.turn - (s.n.underTurn || s.turn) >= 2),
    run: (s, o) => DOR.coverCamera(s, o) });
  def.beat('underTurn', { phase: 'dark', once: false, pri: 9, when: s => s.spot === 'under' && !s.n.underTurn, run: s => { s.n.underTurn = s.turn; } });

  DOR.startTour1 = function (s, o) {
    s.phase = 'tour1';
    s.dl.room = 'office'; s.dl.spot = 'tv'; s.dl.task = 'lead';
    DOR.log(s, 'phase', 'tour1');
    if (!s.n['enter:office']) s.n['enter:office'] = 1; // 开场就在办公室，回来算第二次
    DOR.enterRoom(s, o, 'office', 'tv', '你跟着dl穿过走廊。它开得不快，每到一个拐角都会停一下，像在等一个看不见的队伍。');
    return 20;
  };

  def.phase('tour1', {
    actions(s) {
      const a = [];
      if (s.w.tabletOffered && !s.f.hasTablet) a.push({ g: '机械臂', label: '接住平板', cmd: '接平板' });
      if (s.f.hasTablet) a.push({ g: '平板', label: s.w.tablet ? '放下平板' : '举起平板', cmd: s.w.tablet ? '放下平板' : '举起平板' });
      a.push({ g: '导览', label: '跟着dl', cmd: '跟着dl' });
      return a;
    },
    intercept(s, c, o) {
      const w = c.words || '';
      if (/平板/.test(w)) {
        if (!s.f.hasTablet) {
          if (s.w.tabletOffered) { takeTablet(s, o); return true; }
          o.say('哪来的平板？'); return true;
        }
        if (/放下|收起|关/.test(w)) { s.w.tablet = false; o.scene('office'); o.say('你把平板放平。屏幕里的人不见了。眼前是空的。'); return true; }
        if (/举|拿起|看|打开/.test(w) || c.v === '看' || c.v === '夹') { raise(s, o); return true; }
      }
      return false;
    },
    follow(s, o) {
      if (!s.f.hasTablet) { o.say('dl没有动。它的摄像头看着那块平板，又看看你的机械臂。'); return 3; }
      if (!s.f.photoFound && !s.w.skipAsked) {
        s.w.skipAsked = true;
        DOR.dlSay(s, o, ['照片还没找到']);
        o.say('平板屏幕角上的那张小照片闪了一下。');
        return 3;
      }
      if (!s.f.photoFound) { DOR.dlSay(s, o, ['算了', '这个也不是很好玩']); DOR.log(s, 'skipPhoto', true); }
      return toAtrium(s, o);
    },
    dlTick(s, o, cmd, busy) {
      if (s.room === 'office' && s.dl.room === 'office' && !s.w.tabletOffered && !busy) {
        offerTablet(s, o); return;
      }
      if (s.w.tabletOffered && !s.f.hasTablet && !busy && s.turn - s.n.offerTurn >= 3) {
        s.f.hasTablet = true; DOR.log(s, 'tablet', 'placed');
        o.say('dl等了一会儿，把杆子伸长，直接把平板搁在了你的车头上，卡在云台下面的支架里。卡得有点歪。');
        o.sys('（〔举起平板〕）');
      }
    },
  });

  function offerTablet(s, o) {
    s.w.tabletOffered = true; s.n.offerTurn = s.turn;
    o.major = true;
    o.say('dl在电视前面停下。车身侧面弹开一个槽，里面插着一块平板。它用杆子把平板顶出来，往你这边推。平板滑到桌沿，停在一半悬空的地方。');
    o.sys('（〔接住平板〕）');
  }
  function takeTablet(s, o) {
    s.f.hasTablet = true; DOR.log(s, 'tablet', 'caught');
    o.say('你伸出机械臂，在平板掉下去之前夹住了它。拿回来，架在车头的支架上。刚好卡住。');
    o.say('平板亮着。屏幕上是这个房间，但是有什么不一样。角上有一张小小的照片，照片下面一行字：“导览任务：找到这张照片的拍摄位置。”');
    o.sys('（〔举起平板〕看看）');
  }

  // 2019年的办公室
  const Y2019 = {
    tv: '平板里，2019年。电视亮着，在放一代的预告片。两个人站在电视前面，一个抱着胳膊说：“这段剪得不行。”另一个说：“你上次也这么说。”',
    desks: '平板里，2019年。六张桌子都有人。有人在打字，有人戴着耳机晃脑袋，有人端着杯子从你面前穿过去——穿过了你。靠里那张桌子上的电脑开着，屏幕上是一片雨夜里的桥。',
    window: '平板里，2019年。窗外是白天，太阳很大。楼下有一棵非常大的树，叶子满满的，把一半的光挡成了一块一块的。',
    wall: '平板里，2019年。墙上挂满了东西：设定图，便签，一张画得很丑的猫。海报是新的，下半截没有卷。',
    door: '平板里，2019年。走廊的灯是亮的。一个人抱着一摞纸箱走过来，从你身上走了过去。',
  };
  function raise(s, o) {
    s.w.tablet = true; U.cnt(s, 'raise');
    DOR.log(s, 'raise', s.spot);
    o.scene('office2019');
    if (U.get(s, 'raise') === 1) {
      o.say('你把平板举到摄像头前面。');
      o.pause(900);
      o.say('屏幕上是这个房间。2019年，正在发生。');
      o.sound('office2019', 'start');
      o.say('灯是亮的。人在走动。声音从平板的小喇叭里出来，很闷，有人在笑。你转身，屏幕里也跟着转。');
      o.say('你把平板放低一点：眼前是空的，桶，塌掉的天花板。举起来：他们还在。');
    }
    o.say(Y2019[s.spot] || '平板里，2019年。');
    if (s.spot === 'window') photoFound(s, o);
    else if (!s.f.photoFound) o.sys('（任务：找到合照的拍摄位置。照片里能看见' + (U.get(s, 'raise') > 1 ? '墙和一角窗框，是从对面拍的。' : '墙。') + '）');
  }
  DOR.tablet2019 = Y2019;

  function photoFound(s, o) {

})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
// 参观2：天井。两台车真的玩起来。这一段不放剧情。
(function (G) {
  'use strict';
  const DOR = G.DOR; const U = DOR.U; const def = DOR.def; const C = DOR.C;
  const rain = s => !!s.f.roofOpen;

  def.room('atrium', {
    name: '天井', start: 'entry',
    spots: {
      entry: { name: '天井入口', names: ['入口', '天井入口'] },
      center: { name: '天井中间', names: ['中间', '天井中间', '彩格', '场地中间'],
        arrive: s => rain(s) ? '你开到天井中间。雨直接落在你的摄像头上，画面上爬满了细小的水珠。' : '你开到天井中间。地上铺着一格一格的彩色塑胶，红黄蓝绿，有几格被磨白了。' },
      console: { name: '灯台', names: ['灯台', '控制台', '演示台', '投影灯那边'],
        arrive: s => '你开到灯台前。一个齐腰高的旧控制台，上面一排彩色大按钮、一个拉杆、一台投影灯，灯前面立着一个纸做的圈。' },
      chain: { name: '连锁装置', names: ['连锁装置', '装置', '机关', '多米诺'],
        arrive: (s, o) => {
          if (!s.f.chainFixed && s.mast === 'up') { fixFlip(s, 'drive'); return '你从装置旁边挤过去。车尾擦到了什么，轻轻“嗒”了一声。'; }
          return '你开到连锁装置旁边。' + (s.f.chainBig ? '后半段的东西东倒西歪地停在它们最后的位置上。' : '');
        } },
      train: { name: '小火车', names: ['小火车', '火车轨道', '环形轨道'],
        arrive: s => '你开到环形轨道旁边。一辆小火车停在轨道上，车头红色，漆掉了几块。' },
      corner: { name: '角落', names: ['角落', '纸箱那边', '纸箱'],
        arrive: s => '你开到角落。几个空纸箱，一个看起来像开关的东西，墙上一块小牌子。' },
    },
    exits: [
      { to: 'horror', names: ['恐怖区', '恐怖体验区', '黑的那边'], label: '恐怖区', show: s => s.f.toHorror },
    ],
    describe(s, o, q) {
      if (s.phase === 'home' || s.phase === 'day2') return DOR.homeAtrium ? DOR.homeAtrium(s) : '';
      const L = [];
      if (rain(s)) L.push('天井。顶是开着的，四层楼高的天空直接落进来。细的、斜的雨。地上的塑胶彩格积了一层水，反着光。');
      else L.push('天井。一个四层楼高的方形空间，顶上是玻璃，玻璃下面是一格一格的遮光板，全关着。光从板缝里漏下来，一条一条的，像很多根细线把房间吊着。');
      L.push('半个天井都被一套巨大的〔连锁装置〕占着：球道、斜坡、多米诺、配重、翻板，一环接一环，一直绕到墙边。');
      L.push('一边是〔灯台〕和一台〔投影灯〕。另一边是一圈〔小火车〕轨道。角落里有几只〔纸箱〕。');
      if (s.f.shadowBig) L.push('墙上还挂着你摆出来的影子' + (rain(s) ? '，被雨打得有点晃，边缘糊了。' : '。'));
      if (s.w.lampTilt) L.push('投影灯歪着。' + (s.f.dlLearned ? '旁边那盏落地灯也歪着。' : ''));
      return L;
    },
    up: s => rain(s) ? '你抬头。四层楼上面，遮光板全开着，停在竖起来的位置。天是灰的，雨从那么高的地方落下来，落到你镜头上。' : '你抬头。四层楼高。玻璃顶，遮光板一格一格关着，十几格。每一格边上有一根很粗的旧连杆，一直连到墙边。',
    onHorn(s, o) {
      if (s.spot === 'train') { trainPress(s, o, null); return ''; }
      return U.dlHere(s) ? U.cycle(s, 'athorn', ['嘟。天井里有回声。嘟……嘟……', '嘟。dl也嘟了一声。比你的小。', '嘟。']) : undefined;
    },
    lowView: s => '杆子缩回四十厘米。彩格地面一下子变得很大，像一片田。纸箱变成了房子。',
    canRaise: (s, o) => { if (s.w.inBox) { o.say('你在纸箱里。杆子往上顶，纸箱整个被顶起来一截，像一个站起来的纸箱。你又收回去了。'); DOR.log(s, 'boxStand', true); return false; } return true; },
  });

  // ---------------- 进入天井：dl第一次启动连锁 ----------------
  def.phase('atrium', {
    actions(s) {
      const a = [];
      if (s.w.inBox) a.push({ g: '纸箱', label: '钻出来', cmd: '出来' });
      if (s.spot === 'console') a.push({ g: '灯台', label: '按红', cmd: '按红' }, { g: '灯台', label: '按黄', cmd: '按黄' }, { g: '灯台', label: '按蓝', cmd: '按蓝' }, { g: '灯台', label: '按绿', cmd: '按绿' }, { g: '灯台', label: '按白', cmd: '按白' }, { g: '灯台', label: '摆投影灯', cmd: '摆投影灯' });
      if (s.spot === 'train') a.push({ g: '小火车', label: '按鸣笛键', cmd: '按鸣笛键', whistle: true });
      if (s.spot === 'corner' && !s.w.inBox) a.push({ g: '纸箱', label: '钻进纸箱', cmd: '钻进纸箱' });
      a.push({ g: '导览', label: '跟着dl', cmd: '跟着dl' });
      return a;
    },
    intercept(s, c, o) {
      const w = c.words || '';
      // 灯台按钮
      const col = w.match(/^(按|按下|点)?(红|黄|蓝|绿|白)(色)?(键|按钮|灯)?$/);
      if (col) { if (s.spot !== 'console') DOR.goSpot(s, o, 'console'); pressColor(s, o, col[2]); return true; }
      if (/^录鸣笛/.test(c.raw || '')) { if (s.spot !== 'train') DOR.goSpot(s, o, 'train'); const t = (c.raw || '').replace(/^录鸣笛\s*/, '').split(/[,，\s]+/).map(Number).filter(x => !isNaN(x)); trainPress(s, o, t.length ? t : null); return true; }
      if (/鸣笛键|汽笛|火车喇叭/.test(w) || (s.spot === 'train' && c.v === '喇叭')) { if (s.spot !== 'train') DOR.goSpot(s, o, 'train'); trainPress(s, o, null); return true; }
      if (s.w.inBox) {
        if (/出来|钻出|出去/.test(w) || c.v === '离开' || c.v === '升杆') { outBox(s, o); return true; }
        if (['前进', '后退', '左转', '右转', '去', '推'].indexOf(c.v) >= 0) { o.say('你在纸箱里挪了一下。纸箱跟着你挪了一下，像一个自己会走的纸箱。从缝里看出去，彩格一格一格地往后退。'); s.t += 4; return true; }
      }
      if ((c.v === '钻' || /钻|躲进/.test(w)) && /箱/.test(w)) { if (s.spot !== 'corner') DOR.goSpot(s, o, 'corner'); intoBox(s, o); return true; }
      if (/推.*(dl|它|箱)|推它/.test(w) && s.w.dlInBox) { pushDlBox(s, o); return true; }
      if (/启动|拉杆|开始/.test(w) && /连锁|拉杆|装置|演示/.test(w)) { if (s.spot !== 'chain' && s.spot !== 'console') DOR.goSpot(s, o, 'console'); runChain(s, o, 'player'); return true; }
      return false;
    },
    follow(s, o) {
      if (!s.f.chain1) { o.say('dl没有动。它停在装置的起点，等着什么。'); return 3; }
      if (s.f.chainFixed && !s.f.chainBig) { runChain(s, o, 'dlAgain'); return 20; }
      // 你什么都还没碰：它先不走，自己玩一下给你看
      if (U.get(s, 'atriumToys') < 2 && (s.w.invite || 0) < 2) { dlInvite(s, o); return 8; }
      return toHorror(s, o);
    },
    dlTick(s, o, cmd, busy) {
      if (s.room !== 'atrium') return;
      if (!s.f.chain1 && !busy) { if (U.cnt(s, 'atriumWait') >= 2) { runChain(s, o, 'dl'); } return; }
      if (busy) return;
      // dl自己的玩法：影子、灯、纸箱、雨后的灯
      if (s.f.roofOpen && !s.f.dlLights && s.turn > s.n.roofTurn + 1) { dlLightShow(s, o); return; }
      if (s.w.inBox && !s.w.dlPushed) { dlPushes(s, o); return; }
      if (s.w.inBox && s.w.dlPushed && s.w.dlPushed < 3) { dlPushes(s, o); return; }
      if (s.w.lampTilt === 1 && !s.w.dlFixedLamp) { dlFixLamp(s, o); return; }
      if (s.w.lampTilt >= 2 && !s.f.dlLearned && s.turn > (s.n.tilt2 || 0) + 1) { dlLearn(s, o); return; }
      if (s.f.shadowOn && !s.f.shadowBig && s.w.shadowTries >= 2) { bigShadow(s, o); return; }
      // 你一直不动：它先按一个颜色，再开投影灯，给你看这里能玩
      if (U.get(s, 'atriumToys') < 2 && (s.w.invite || 0) < 2 && s.turn - (s.n.inviteTurn || s.n.chain1Turn || 0) >= 3) { dlInvite(s, o); return; }
      if (U.get(s, 'atriumToys') >= 5 && !s.w.dlBoxInvite && !s.w.inBox && !s.w.dlInBox && DOR.rand(s) < 0.3) { dlBoxInvite(s, o); return; }
    },
  });

  function toyed(s) { U.cnt(s, 'atriumToys'); }

  // ---------------- 连锁装置 ----------------
  function fixFlip(s, how) { if (s.f.chainFixed) return; s.f.chainFixed = true; DOR.log(s, 'chainFixed', how); }
  DOR.fixFlip = fixFlip;

  function runChain(s, o, who) {
    if (!s.f.chain1) {
      s.f.chain1 = true; s.n.chain1Turn = s.turn; o.major = true;
      DOR.log(s, 'chainRun', { who, fixed: !!s.f.chainFixed });
      o.say('dl开到装置起点，用杆子拉了一下一根红色的拉杆。');

      o.sound('chain_start');
      o.say([
        '一颗钢球从滑槽里掉出来，“当”，落进第一条斜坡。',
        '二：斜坡尽头，球撞倒第一块多米诺。一百多块多米诺哗啦啦倒成一条线，拐了两个弯。',
        '三：最后一块多米诺推下一个配重，配重往下掉，把一辆小轨道车拽了出去。',
        '四、五：轨道车冲过一座小桥，撞响一个铃。铃声还没散，一根摆锤荡了过去。',
        '六：摆锤敲中一块翻板——',
      ]);
      o.pause(1200);
      if (!s.f.chainFixed) {
        o.say('七：翻板翻了一半，卡住了。它是歪的。链条过不去。');
        o.pause(1500);
        o.say('一切停下来。');

        return;
      }
      bigChain(s, o);
