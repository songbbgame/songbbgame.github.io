    o.say(U.cycle(s, 'whistleline', ['嘟！小火车叫了一声。声音比你的喇叭大，也比你的喇叭傻。', '嘟！', '嘟！车头的灯跟着闪。', '嘟！它录着呢。']));
  }
  DOR.whistleText = function (seq) {
    if (!seq || !seq.length) return '';
    let t = '嘟';
    for (let i = 1; i < seq.length; i++) { const g = seq[i] - seq[i - 1]; t += g > 900 ? '……嘟' : g > 400 ? '——嘟' : '嘟'; }
    return t;
  };
  function pushTrain(s, o) {
    toyed(s);
    if (s.f.trainGone) { o.say('轨道上没有火车了。'); return 2; }
    s.f.trainGone = true; DOR.log(s, 'trainTunnel', true);
    o.say('你推了一下小火车。它在轨道上滑出去，慢慢地，钻进了那个小隧道。');
    o.pause(2200);
    o.say('它没有出来。');
    o.pause(1500);
    o.say('你把摄像头凑到隧道口。里面是黑的，看不见底。');
    if (U.dlHere(s)) { o.pause(1000); o.say('dl也开过来，把摄像头凑到隧道口看。它也不知道。'); }
    return 6;
  }

  // ---------------- 角落：没有功能的开关、黄色球 ----------------
  def.obj('useless', {
    names: ['开关', '没有功能的开关', '小花', '装置'], room: 'atrium', spot: 'corner', far: true,
    look: '墙上一个看起来像开关的东西，做成了一朵小花的样子。',
    verbs: {
      按: (s, o) => {
        const n = U.cnt(s, 'useless'); toyed(s); DOR.log(s, 'useless', n);
        o.sound('click');
        if (n === 1) { o.say('你按下去。“咔。”'); o.say('屏幕上出现一行字：这个没有任何功能。'); }
        else if (n === 2) { o.say('再按。还是那行字：这个没有任何功能。'); if (U.dlHere(s)) { o.pause(1500); o.say('然后dl开过来，也按了一下。'); o.pause(800); o.say('这个没有任何功能。'); DOR.log(s, 'dlUseless', true); } }
        else o.say('这个没有任何功能。');
        return 3;
      },
    },
  });
  def.obj('sign', {
    names: ['牌子', '小牌子', '告示'], room: 'atrium', spot: 'corner', far: true,
    look: '墙上一块小牌子：\n\n　禁止把黄色球带离天井。\n\n下面一行小字：“上面这句是物业让我写的。”\n再下面一行，更小：“他们今天不在。”',
  });
  def.obj('ball', {
    names: ['黄色球', '黄球', '球'], room: 'atrium', spot: 'corner', show: s => !s.f.ballLost && !U.hasCargo(s, 'ball') && s.held !== 'ball' && (!s.w['pos:ball'] || s.w['pos:ball'].room === s.room), far: true, portable: true, magnetic: false,
    look: '牌子底下一个黄色的球，比网球大一点，软的，有一点脏。',
    onTake: (s, o) => {
      s.f.hadBall = true; DOR.log(s, 'ball', 'take');
      o.say('你把黄色球夹起来。它软软地陷进夹爪里。');
      if (U.dlHere(s)) { o.say('dl看了看球，看了看牌子，看了看你。然后什么也没做。'); DOR.log(s, 'dlBallSaw', true); }
      o.sys('（可以把它〔放进车斗〕带着走。）');
    },
  });
  // 夹着球离开时自动放进车斗
  def.beat('ballAutoStow', { once: false, pri: 8, when: s => s.held === 'ball' && s.room !== 'atrium' && !U.hasCargo(s, 'ball'), run: (s, o) => { s.held = null; s.cargo.push('ball'); o.say('（黄色球从夹爪滚进了车斗。）'); } });

  // 磁悬浮球（磁铁工具有用）、自动投篮（进水以后越投越离谱）
  def.obj('maglev', {
    names: ['磁悬浮球', '悬浮球', '浮着的球'], room: 'atrium', spot: 'center', far: true, magnetic: true,
    look: s => s.w.maglevDown ? '磁悬浮底座上空着。那颗小钢球躺在旁边的彩格上。' : rain(s) ? '磁悬浮底座上，一颗小钢球浮在半空，慢慢地转。雨落在上面，转起来的时候甩出一圈细细的水珠。' : '一个磁悬浮底座，一颗小钢球浮在半空，一直在慢慢地转。',
    verbs: {
      吸: (s, o) => { toyed(s); if (s.w.maglevDown) { s.w.maglevDown = false; o.say('你用磁铁把钢球吸起来，放回底座上。它晃了三下，重新浮起来了。'); return 4; } s.w.maglevDown = true; DOR.log(s, 'maglev', 'pulled'); o.say('你把磁铁凑过去。钢球“啪”地一下从半空里被拽了过来，吸在你的磁铁头上。底座空了，嗡嗡声停了。你把它放在了彩格上。'); return 4; },
      夹: (s, o) => { if (s.tool !== '磁铁') { o.say('夹爪碰到钢球，钢球从夹爪里滑开，弹回半空。它太滑了。（磁铁也许可以。）'); return 3; } return C.objs.maglev.verbs['吸'](s, o); },
    },
  });
  def.obj('hoop', {
    names: ['投篮', '投篮机', '自动投篮装置', '篮筐'], room: 'atrium', spot: 'center', far: true,
    look: s => s.w.hoopStuck ? '自动投篮装置卡住了，手臂停在半空，最后一颗球挂在篮筐上。' : rain(s) ? '自动投篮装置进了水，开始乱投。一颗球飞过了篮筐，一颗球打在墙上，一颗球直接投向了天空。' : '一个自动投篮装置，隔一会儿投一颗小球，每次都进。',
    verbs: { 按: (s, o) => { toyed(s); const n = U.cnt(s, 'hoop'); if (!rain(s)) { o.say('你按了一下。它投了一颗。进了。'); return 3; } if (n < 3) { o.say(U.cycle(s, 'hoopRain', ['你按了一下。它投出去一颗，飞过篮筐，落在dl身上。', '又一颗。打在灯台上，弹进了纸箱。'])); return 3; } s.w.hoopStuck = true; DOR.log(s, 'hoopStuck', true); o.say('它咔咔响了两声，手臂抬到一半，卡住了。'); return 3; } },
  });

  // 雨后：dl开到中间把所有灯开到最亮，关掉，开，关，三四次，然后开回来
  function dlLightShow(s, o) {
    s.f.dlLights = true; o.major = true; DOR.log(s, 'dlLightShow', true);
    o.say('dl开到天井正中间，停在雨里。');
    o.pause(1200);
    o.say('天井四周五盏舞台灯突然一起打开，开到最亮。');
    o.sound('lights_all');
    o.pause(1200);
    o.say('关掉。');
    o.pause(700);
    o.say('打开。');
    o.pause(700);
    o.say('关掉。打开。关掉。');
    o.pause(1200);
    o.say('然后它开回你旁边。');
  }

  function toHorror(s, o) {
    s.f.toHorror = true; s.phase = 'horror';
    s.dl.room = 'horror'; s.dl.task = 'lead';
    DOR.log(s, 'phase', 'horror');
    if (s.w.inBox) { s.w.inBox = false; o.say('你倒出纸箱。'); }
    o.say('dl往天井另一头开。那边有一扇很窄的门，门框刷成了暗红色。');
    DOR.enterRoom(s, o, 'horror', 'gate');
    return 20;
  }
  DOR.toHorror = toHorror;

  def.dl([
    { id: 'a_first', phase: 'atrium', pri: 3, urgent: true, when: s => s.f.chain1, text: '这里是天井' },
    { id: 'a_seven', phase: 'atrium', pri: 2, when: s => s.f.chain1 && !s.f.chainFixed, text: ['第七环一直是这样', '每次都是'] },
    { id: 'a_ball', phase: 'atrium', pri: 2, when: s => s.f.hadBall, text: '牌子上写的是物业让写的' },
    { id: 'a_train', phase: 'atrium', pri: 2, when: s => s.f.trainGone, text: ['隧道下面是空的', '我也不知道通到哪里'] },
    { id: 'a_rain', phase: 'atrium', pri: 3, when: s => s.f.roofOpen && s.f.dlLights, text: ['规程第7条', '下雨天记得关天井顶'] },
    { id: 'a_rain2', phase: 'atrium', pri: 2, when: s => s.f['dl:a_rain'], text: '关不上了' },
    { id: 'a_shadow', phase: 'atrium', pri: 1, when: s => s.f.shadowBig, text: '墙上那个是我' },
    { id: 'a_useless', phase: 'atrium', pri: 1, when: s => U.get(s, 'useless') >= 1, text: '那个开关是B做的' },
    { id: 'a_maglev', phase: 'atrium', pri: 1, when: s => s.w.maglevDown, text: '钢球放回去它会自己浮' },
    { id: 'a_box', phase: 'atrium', pri: 1, when: s => s.f.boxPlayed, text: '纸箱是装投篮机的' },
  ]);
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
// 参观3：恐怖区（或员工通道）。吓人的是环境本身。两台小破车在黑暗里互相吓。
(function (G) {
  'use strict';
  const DOR = G.DOR; const U = DOR.U; const def = DOR.def; const C = DOR.C;

  // 路线是一条线：用“段”来走，前进到下一段，后退回上一段
  const SEG = ['gate', 'path', 'wall', 'grate', 'merge', 'gap', 'red', 'exit'];
  const SEGNAME = { gate: '入口', path: '黑暗的路', wall: '砌死的墙', grate: '隔栅', merge: '合流处', gap: '假墙夹层', red: '红门', exit: '出口' };

  def.room('horror', {
    name: '恐怖区', start: 'gate',
    spots: {
      gate: { name: '入口', names: ['入口', '门口'] },
      exit: { name: '出口', names: ['出口'], show: s => s.w.seg >= 7 },
    },
    exits: [
      { to: 'staff', names: ['员工通道', '右边', '右边的通道', '走右边'], label: '员工通道（右边）', spot: 'gate', show: s => !s.w.horrorIn },
      { to: 'garden', names: ['小花园', '花园'], label: '小花园', spot: 'exit', show: s => s.w.seg >= 7, cond: (s, o) => { DOR.toGarden(s, o); return false; } },
    ],
    dark: s => true,
    describe(s, o, q) {
      if (s.phase === 'home') return DOR.homeHorror ? DOR.homeHorror(s) : '';
      const g = SEG[s.w.seg || 0];
      return DESC[g](s);
    },
    nav(s, o, v) {
      if (v === '前进') return advance(s, o);
      if (v === '后退') return back(s, o);
      if ((v === '左转' || v === '右转' || v === '转身') && SEG[s.w.seg] === 'red' && s.w.redOpen) { lookBack(s, o); return 4; }
      if (v === '转身' && SEG[s.w.seg] === 'merge') return false;
      return false;
    },
    up: s => U.cycle(s, 'hup', ['上面是黑的。黑里挂着一些东西，看不清是什么。你没有一直往上看。', '黑。', '有一根线从上面垂下来，在你车灯的边缘轻轻晃。']),
    onHorn(s, o) {
      const g = SEG[s.w.seg || 0];
      if (g === 'path' && !s.w.vuLoop) return '嘟。前面那台车没有停。';
      if (g === 'merge' && s.w.hide === 1) return '嘟。黑里有一个很小的声音回应你：嘟。从你身后。';
      return U.cycle(s, 'hhorn', ['嘟。声音被黑吃掉了一半。', '嘟。']);
    },
    onLight(s, o, on) {
      const g = SEG[s.w.seg || 0];
      if (g === 'merge') { hideGame(s, o, on ? 'on' : 'off'); return ''; }
      return undefined;
    },
    onWait(s, o) {
      DOR.log(s, 'horrorStill', SEG[s.w.seg || 0]);
      const g = SEG[s.w.seg || 0];
      if (g === 'merge') { hideGame(s, o, 'wait'); return ''; }
      if (g === 'grate') { gratePace(s, o, 'stop'); return ''; }
      return U.cycle(s, 'hwait', ['你停着不动。轮子不响的时候，这里安静得能听见自己的风扇。', '你停着。远处有滴水声，一下，很久，又一下。']);
    },
    lowView: '杆子缩回四十厘米。黑贴得更近了。地上有一条白色的引导线，被很多轮子压得断断续续。',
    canRaise: (s, o) => { if (s.f.gapBlind) { o.say('杆子顶到了压着你的东西。升不起来。'); return false; } return true; },
  });

  const DESC = {
    gate: s => [
      '一扇很窄的门，门框刷成暗红色。门里面比黑房间还黑。门边贴着一张打印的纸：',
      '　　DOR2 恐怖体验区（内测）',
      '纸下面有一行手写的字：',
      '　　不喜欢可以走右边员工通道。不会少结局。我不喜欢把敢不敢做成考试。——B',
      '右边确实有一条很普通的〔员工通道〕，灯是亮的。',
    ],
    path: s => s.w.vuLoop ? ['黑暗的路。地上一条白线，很多轮子来回压过。那台没有眼睛的车还在这条线上走，一圈，又一圈。'] : ['很窄的一条路。车灯能照开三米，三米以外什么都没有。地上一条白色的引导线。', '前面有一台车。'],
    wall: s => ['路在这里被一堵墙截断了。墙是后来砌的，砖缝里的水泥比两边的墙白。'],
    grate: s => ['通道被一排竖着的隔栅分成两条，一次只能过一台车。隔栅是铁的，缝只有三厘米宽。'],
    merge: s => s.w.hide >= 4 ? ['两条路在这里合成一条。一个稍微宽一点的地方，堆着一些道具：一只假手，一个倒着放的婴儿车。'] : ['两条路在这里合成一条。稍微宽一点。黑的。'],
    gap: s => ['一段很窄的假墙夹层，两面都是刷黑的木板。宽度刚好只够一台车。顶上有一个方形的检修口。'],
    red: s => s.w.redOpen ? ['你穿过了那扇门。身后是那扇红门的背面。'] : ['一扇红色的大门挡在路尽头。'],
    exit: s => ['出口。一盏普通的日光灯。墙上钉着一张〔内测登记表〕。旁边一扇门开着，里面亮着工作灯。'],
  };

  function seg(s) { return SEG[s.w.seg || 0]; }
  function setSeg(s, o, i) {
    s.w.seg = i; s.spot = SEG[i] === 'exit' ? 'exit' : SEG[i] === 'gate' ? 'gate' : null;
    DOR.log(s, 'hseg', SEG[i]);
  }

  function advance(s, o) {
    const g = seg(s);
    if (g === 'gate') {
      s.w.horrorIn = true; setSeg(s, o, 1); DOR.log(s, 'horrorChoice', 'horror');
      o.scene('horror');
      o.sound('horror_amb', 'start');
      o.say('你开进那扇暗红色的门。门在身后慢慢合上，没有合严，留了一条缝。');
      if (s.f.saidDark && !s.light) { o.say('dl从你旁边挤过去。它先把自己的灯打开了。'); DOR.log(s, 'dlRememberDark', true); }
      else if (s.f.saidDark) { o.say('dl把自己的灯也打开了，而且是最亮的那一档。'); DOR.log(s, 'dlRememberDark', true); }
      o.say(DESC.path(s));
      o.say('前面有一台车，背对着你，在白线上慢慢地走。它不是dl。dl在你旁边。');
      o.sound('wheels_ahead', 'start');
      o.sys('视觉标注：〔前面的车〕');
      return 10;
    }
    if (g === 'path') {
      if (!s.w.vuFollowed) { o.say('你跟在那台车后面。它走得很稳，很慢，一直沿着那条白线。你离它近了，它不回头。你按了一下喇叭，它不停。'); s.w.vuFollowed = 1; return 8; }
      if (s.w.vuFollowed === 1) { s.w.vuFollowed = 2; setSeg(s, o, 2); vuWall(s, o); return 10; }
    }
    if (g === 'wall') { setSeg(s, o, 3); grateStart(s, o); return 10; }
    if (g === 'grate') { gratePace(s, o, 'go'); return 5; }
    if (g === 'merge') {
      if ((s.w.hide || 0) < 4) { hideGame(s, o, 'move'); return 5; }
      setSeg(s, o, 5); gapStart(s, o); return 8;
    }
    if (g === 'gap') {
      if (s.f.gapBlind) { gapStep(s, o, '前进'); return 5; }
      if (!s.f.gapDone) { gapStart(s, o); return 3; }
      setSeg(s, o, 6); o.say('夹层尽头，路变宽了一点。'); o.say(DESC.red(s)); redFront(s, o); return 8;
    }
    if (g === 'red') {
      if (!s.w.redOpen) { openRed(s, o); return 8; }
      setSeg(s, o, 7); exitArrive(s, o); return 8;
    }
    if (g === 'exit') { DOR.toGarden(s, o); return 10; }
    return false;
  }
  function back(s, o) {
    const g = seg(s);
    if (g === 'gate') { o.say('身后是天井。雨声从那边传过来。'); return 3; }
    if (g === 'grate') { gratePace(s, o, 'back'); return 4; }
    if (g === 'gap' && s.f.gapBlind) { gapStep(s, o, '后退'); return 4; }
    if (g === 'path' || g === 'wall') { wrong(s, o); o.say('你倒回去一点。门缝里透进来天井的光，一条。你又往前开了。'); return 4; }
    wrong(s, o);
    o.say('后面的路很窄，倒回去要倒很久。');
    return 3;
  }
  // 走错很多次以后，B留下的纸条
  function wrong(s, o) {
    const n = U.cnt(s, 'hwrong');
    if (n === 4) { o.say('墙上，车灯刚好照到一张贴得很低的纸条，一米五的高度：\n\n　这是我设计烂了，不是你。——B'); DOR.log(s, 'bNote', true); }
  }

  // ---------- 没有眼睛的车 ----------
  def.obj('vu01', {
    names: ['前面的车', '那台车', 'VU-01', '没有眼睛的车'], room: 'horror', show: s => ['path', 'wall'].indexOf(seg(s)) >= 0, tag: false,
    look: s => ['一台访客车，和你是同一个型号。它背对着你，一直沿着白线走。它不回头，不响应灯光。杆子还在，杆子顶上的摄像头插座是空的。车尾的编号：VU-01。', '它还在走。'],
    verbs: {
      推: (s, o) => { o.say('你挡到它前面。它停了半秒，绕开你，回到白线上，继续走。它没有看你——它没有东西可以看你。'); DOR.log(s, 'blockVu', true); return 4; },
      喇叭: (s, o) => { o.say('嘟。它不停。'); return 2; },
    },
  });
  function vuWall(s, o) {
    o.say('你一直跟着它。它走到一堵墙前面。');
    o.pause(1200);
    o.say('墙是后来砌的——砖缝里的水泥比两边的墙白，墙脚还有没清干净的灰浆。原来的路线穿过这里，现在不穿了。');
    o.pause(1200);
    o.say('它在墙前面停了两秒。');
    o.pause(2000);
    o.say('然后它转身，从你旁边开过去，回到路线的起点，从头开始走。');
    o.pause(1000);
    o.say('dl对它没有任何反应。');
    DOR.log(s, 'vuLoop', true);
    s.w.vuLoop = true;
    o.say('墙右边开着一个口子，是改过以后的新路线。');
  }

  // ---------- 隔栅两边的两束光 ----------
  function grateStart(s, o) {
    o.say('你从墙右边的口子开进去。');
    o.say(DESC.grate(s));
    o.say('你走左边。dl从你身后开过去，拐进了右边。');
    o.pause(1200);
    o.say('你看不见它。你只能看见它的灯，在隔栅的缝里一格一格地闪过去：亮、暗、亮、暗。和你的速度一样。');
    s.w.grate = 0;
    o.sys('（前进、等、后退）');
  }
  function gratePace(s, o, how) {
    s.w.grate = (s.w.grate || 0) + (how === 'go' ? 1 : 0);
    DOR.log(s, 'grate', how);
    if (how === 'stop') { o.say('你停下来。隔栅那边的光也停了。停在一道缝里，正对着你。'); U.cnt(s, 'grateStop'); return; }
    if (how === 'back') { o.say('你往后退一点。那边的光也往后退一点。'); U.cnt(s, 'grateBack'); return; }
    if (s.w.grate === 1) o.say('你往前开。那边的光也往前。亮、暗、亮、暗。');
    else if (s.w.grate === 2) o.say('你加速。光也加速。缝一格一格闪过去，快得像一台老电影放映机。');
    else { setSeg(s, o, 4); mergeArrive(s, o); }
  }

  // ---------- 合流：两台小破车在黑暗里互相吓 ----------
  function mergeArrive(s, o) {
    o.say('隔栅到头了。两条路合成一条。');
    o.pause(900);
    o.say('dl从右边开出来，停在你旁边。两束灯光并排照着前面。');
    o.pause(1500);
    o.say('然后dl把自己的灯全关了。');
    o.pause(1200);
    o.say('它不见了。');
    s.w.hide = s.light ? 1 : 2;
    DOR.log(s, 'hideStart', true);
    o.sys('（它就在附近。）');
  }
  function hideGame(s, o, how) {
    const h = s.w.hide || 0;
    DOR.log(s, 'hide', { h, how });
    if (h === 1) {
      if (how === 'off') { o.say('你也把车灯关了。全黑。你能听见自己的风扇，还有很近很近的地方，另一台车的风扇。'); s.w.hide = 2; return; }
      if ((how === 'wait' || how === 'move') && U.get(s, 'scaredByDl') >= 2) {
        o.say('dl这次没有藏。它把灯打开，停在你旁边，等着。');
        s.w.hide = 35; return;
      }
      if ((how === 'wait' || how === 'move') && U.get(s, 'scaredByDl') === 1) {
        o.say('你把车灯往左扫。往右扫。没有。');
        o.pause(1600);
        o.say('头顶上，“嗒”。');
        o.sound('jolt');
        o.pause(700);
        o.say('一束光从正上方直直照下来。dl不知道怎么爬到了一截道具架子上，从上面照着你。和今天早上它从天花板上看你的角度一模一样。');
        U.cnt(s, 'scaredByDl');
        o.pause(1200);
        o.say('它从架子上滑下来，落地的时候颠了一下。然后又关了灯。');
        o.sys('（你也可以关灯。）');
        return;
      }
      if (how === 'wait' || how === 'move') {
        o.say('你往前开了一点，车灯扫过一面空墙——');
        o.pause(1400);
        o.say('你背后突然亮起一束光。');
        o.sound('jolt');
        o.pause(800);
        o.say('是dl。它不知道什么时候绕到你背后去了。它的灯照着你，一动不动，像在等你的反应。');
        U.cnt(s, 'scaredByDl');
        o.pause(1200);
        o.say('然后它又关了灯。又不见了。');
        o.sys('（你也可以关灯。）');
        return;
      }
      if (how === 'on') { o.say('车灯是亮的。'); return; }
    }
    if (h === 2) {
      if (how === 'on') { o.say('你打开车灯。空的。它不在你以为的地方。'); return; }
      if (how === 'move' || how === 'wait') {
        o.say('你在黑里摸着开。绕过一个道具，贴着墙，倒过去，停。你估计它就在那儿——就在你左前方。');
        o.say('（现在〔开灯〕？）');
        s.w.hide = 3; return;
      }
    }
    if (h === 3) {
      if (how === 'on') {
        o.say('你猛地打开车灯。');
        o.pause(600);
        o.say('dl就在那里，背对着你，离你不到半米。');
        o.pause(700);
        o.sound('bump');
        o.say('它整台车往后猛退了半米，“咚”地撞在墙上。杆子晃了好几下才停。');
        DOR.log(s, 'scaredDl', true);
        s.f.scaredDl = true;
        o.pause(1500);
        o.say('它转过来，用灯照着你。照了很久。');
        s.w.hide = 35;
        return;
      }
      if (U.cnt(s, 'hide3') < 2) { o.say('黑里。你听见它的轮子在很近的地方动了一下。'); return; }
      // 一直不开灯：它自己倒车，倒进了你怀里
      o.say('黑里，它的轮子声越来越近——');
      o.pause(800);
      o.sound('bump');
      o.say('“咚。”它倒车，正好撞上你的车头。两台车都弹开了一点。');
      o.pause(900);
      o.say('它的灯“啪”地亮了，照着你。照了很久。');
      DOR.log(s, 'bumpedInDark', true);
      s.w.hide = 35; return;
    }
    if (h === 35) { thirdRobot(s, o); return; }
    if (h >= 4) { o.say('前面是那段很窄的假墙夹层。'); }
  }
  function thirdRobot(s, o) {
    s.w.hide = 4; o.major = true; DOR.log(s, 'thirdRobot', true);
    o.say('这一次，你们两个同时把灯关了。都藏起来。');
    o.pause(2200);
    o.say('黑。');
    o.pause(2000);
    o.sound('wheels_other');
    o.say('你听见轮子声。从另一个方向过来的。慢慢地，越来越近。');
    o.pause(2200);
    o.say('两台车一起冲出去，把灯全打开——');
    o.pause(900);
    o.say([
      '那不是对方。',
      '',
      '那是一台正在作业的清扫机器人，圆的，比你们矮。它刚刚正把一个掉在地上的道具头颅捡起来。',
      '它手上的东西掉了。',
    ]);
    o.pause(1600);
    o.say('它停了两秒。捡起来。从你们两个中间开过去，完全不理你们。');
    o.pause(2400);
    o.say('沉默。');
    o.pause(1600);
    o.say('dl慢慢转过来，用灯照着你。');
    o.pause(1400);
    o.say('然后两台车一起跑了。');
    o.sound('run');
  }
  // 灯关着的时候继续推进捉迷藏
  def.beat('hideAuto', { phase: 'horror', once: false, pri: 2,
    when: (s, c) => seg(s) === 'merge' && s.w.hide === 35 && c && c.v !== '车灯',
    run: (s, o) => thirdRobot(s, o) });

  // ---------- 假墙夹层：这次是你先要的 ----------
  function gapStart(s, o) {
    if (s.f.gapBlind || s.f.gapDone) return;
    o.say(DESC.gap(s));
    o.say('你先进去。dl在后面等。');
    o.pause(1200);
    o.say('开到一半，头顶上垂下来一块黑色的软布景，“噗”地压在你的车灯上。画面里只剩灯光透过布的一点暗红。你看不见路了。两边的木板离你的轮子只有几厘米。');
    s.f.gapBlind = true; s.n.gapStep = 0;
    DOR.log(s, 'gapBlind', true);
    o.sys('（可以请dl帮忙：输入“说 看不见”，或者“请求共享”。也可以自己摸着开。）');
  }
  function gapStep(s, o, v) {
    s.n.gapStep = (s.n.gapStep || 0) + 1;
    DOR.log(s, 'gapStep', { v, shared: !!s.f.gapShared });
    if (!s.f.gapShared) {
      if (s.n.gapStep < 3) { o.say(v === '前进' ? '你摸着往前开。左边轮子“咔”地擦到了木板。你停下来。' : '你往后退。后面也看不见。'); return; }
      o.say('你一点一点蹭出去了。擦了三次木板，杆子上多了一道白印。');
      s.f.gapBlind = false; s.f.gapDone = true; DOR.log(s, 'gapSelf', true); return;
    }
    if (s.n.gapStep === 1) { o.say('窗口里的光圈落在你左前轮前面几厘米：那里有一块凸出来的木条。你往右偏一点，过去了。'); return; }
    o.say('dl的光又往前挪了一格，照出落点。你跟着那一小块光开。三下，四下。布景从你头上滑下去了。你出来了。');
    s.f.gapBlind = false; s.f.gapDone = true; DOR.log(s, 'gapShareDone', true);
    o.say('dl从检修口上把灯收回去，关掉共享。窗口消失了。');
  }
  def.beat('gapAsk', { phase: 'horror', once: false, pri: 7,
    when: (s, c) => s.f.gapBlind && !s.f.gapShared && c && (/看不见|看不到|帮|共享|借|视野|救/.test(c.raw || '')),
    run(s, o) {
      s.f.gapShared = true; DOR.log(s, 'gapShare', 'asked');
      if (s.f.dlTalks) o.dl('等');
      o.pause(1400);
      o.say('头顶上的检修口“咔”地打开了。dl不知道从哪里绕上去了，从上面往下看。');
      o.sys('D02 请求共享视野。已接受。');
      o.scene('shared');
      o.say('小窗口又出现了。这一次是从正上方往下看：一条黑色的缝，缝里一台蒙着布景的车。dl的灯照下来，只照亮你轮子前面巴掌大的一块。它在不停地找角度。');
      DOR.log(s, 'shareCount', 2);
    } });
  def.beat('gapMoves', { phase: 'horror', once: false, pri: 6,
    when: (s, c) => s.f.gapBlind && c && ['前进', '后退', '左转', '右转'].indexOf(c.v) >= 0 && seg(s) === 'gap' && c.v !== '前进',
    run: (s, o, c) => gapStep(s, o, c.v) });

  // ---------- 红门 ----------
  function redFront(s, o) {
    o.say('那扇门很认真地做过。红漆一层一层刷上去，又一层一层刮花。上面钉着生锈的钉子，钉子之间是指甲划过的痕迹，一道一道，从高到低，最低的一道在一米五。门中间有一个黑色的手印，五根手指往下拖出了很长的印子。');
    o.pause(800);
    o.say('门没有锁。');
  }
  def.obj('reddoor', {
    names: ['红门', '门', '大门', '红色的门'], room: 'horror', show: s => seg(s) === 'red', tag: false,
    look: s => s.w.redOpen ? (s.f.sawStrawberry ? backText() : '你已经从门里穿过来了。门在你身后。') : '红色的门。钉子，划痕，手印。',
    verbs: { 推: (s, o) => { openRed(s, o); return 6; }, 拉: (s, o) => { openRed(s, o); return 6; }, 按: (s, o) => { openRed(s, o); return 6; } },
  });
  function openRed(s, o) {
    if (s.w.redOpen) { o.say('门已经开了。'); return; }
    s.w.redOpen = true; DOR.log(s, 'redOpen', true);
    o.sound('door_creak');
    o.say('你用车头顶开那扇门。门很重，慢慢地转开。门后面是一段普通的路。你开过去。门在你身后停住，半开着。');
    o.sys('（回头？）');
  }
  function lookBack(s, o) {
    if (!s.f.sawStrawberry) {
      s.f.sawStrawberry = true; DOR.log(s, 'strawberry', true);
      o.major = true;
      o.say('你转过去，看那扇门的背面。');
      o.pause(1500);
      o.say(backText());
      return;
    }
    o.say(backText());
  }
  function backText() {
    return '门的背面画满了草莓。\n\n整扇门，从上到下，全是草莓。手画的，颜色很干净，有大有小，有的熟透了，有的还有一点白尖，中间夹着几片叶子。角落里签了一个很小的名字，小到看不清。';
  }

  // ---------- 出口 ----------
  function exitArrive(s, o) {
    o.say(DESC.exit(s));
    o.sound('horror_amb', 'stop');
    o.sound('wheels_ahead', 'stop');
    s.dl.task = 'lead';
  }
  def.obj('testsheet', {
    names: ['内测登记表', '登记表', '表'], room: ['horror', 'staff'], show: s => s.room === 'staff' || seg(s) === 'exit', tag: true,
    look: s => { DOR.log(s, 'testsheet', true); return '一张手写的表格，钉在墙上。标题：恐怖区 内测登记。\n\n　姓名　　　进入时间　　完成／中途出来\n　小林　　　6.03 14:10　　完成\n　阿琳　　　6.03 14:22　　中途出来\n　大周　　　6.03 14:40　　完成（说不吓人）\n　小林　　　6.03 15:02　　完成（第二次）\n　Mia　　　 6.04 11:15　　中途出来\n　老陈　　　6.04 11:30　　完成\n　阿琳　　　6.05 10:05　　完成\n　豆豆　　　6.05 16:48　　中途出来\n　……\n　B　　　　 6.03 13:55　　\n\n最后一列，B那一行是空的。'; },
  });
  def.obj('scaffold', {
    names: ['工作灯', '脚手架', '展项', '开着的门', '做到一半的展项'], room: 'horror', show: s => seg(s) === 'exit',
    look: '旁边那扇门开着，里面亮着一盏工作灯。灯下是一个做到一半的展项：脚手架还搭着，木板上画着粉笔线，地上放着一桶没开封的漆。墙上钉着一张设计图，右下角写着：预计完成 2019年8月。',
  });

  // ---------- 员工通道：同样的结尾 ----------
  def.room('staff', {
    name: '员工通道', start: 'a',
    spots: { a: { name: '员工通道', names: ['员工通道'] }, b: { name: '通道尽头', names: ['尽头', '通道尽头'] } },
    exits: [{ to: 'garden', names: ['小花园', '花园', '出口'], label: '小花园', spot: 'b', cond: (s, o) => { DOR.toGarden(s, o); return false; } }],
    describe(s) {
      if (s.spot === 'b') return ['通道尽头，和恐怖区的出口在同一个地方汇合。墙上钉着一张〔内测登记表〕。'];
      return ['员工通道。日光灯，灰色地胶，一切都很普通。通道和恐怖区只隔着一层板子，板子这一面没有刷漆，钉着很多条胶带。', '你看见了恐怖区的背面：一把拖把靠在墙上，一台饮水机，一箱备用的假手，一卷写着“血”的红色胶带。'];
    },
    nav(s, o, v) {
      if (v === '前进') {
        if (s.spot === 'a') {
          if (!s.w.staffPeek) { s.w.staffPeek = true; o.say('板子上有一道缝。缝那边，一台没有摄像头的车沿着白线慢慢开过去。它没有停。'); DOR.log(s, 'staffVu', true); return 6; }
          DOR.goSpot(s, o, 'b'); return 8;
        }
        DOR.toGarden(s, o); return 10;
      }
      return false;
    },
    enter(s, o) {
      DOR.log(s, 'horrorChoice', 'staff');
      s.dl.room = 'staff';
      DOR.describeRoom(s, o);
      o.say('dl跟在你后面，也走了员工通道。它没有说什么。');
    },
  });

  def.phase('horror', {
    actions(s) {
      const g = seg(s); const a = [];
      if (s.room === 'staff') return [{ g: '驾驶', label: '前进', cmd: '前进' }];
      if (g === 'gate') { a.push({ g: '路线', label: '进恐怖区', cmd: '前进' }, { g: '路线', label: '走员工通道', cmd: '去员工通道' }); return a; }
      a.push({ g: '驾驶', label: '前进', cmd: '前进' }, { g: '驾驶', label: '后退', cmd: '后退' }, { g: '驾驶', label: '等', cmd: '等' });
      a.push({ g: '小车', label: s.light ? '关灯' : '开灯', cmd: s.light ? '关灯' : '开灯' });
      if (g === 'gap' && s.f.gapBlind && !s.f.gapShared) a.push({ g: '说', label: '说：看不见', cmd: '说 看不见' });
      if (g === 'red' && s.w.redOpen) a.push({ g: '驾驶', label: '回头', cmd: '转身' });
      return a;
    },
    exclusiveActions: false,
    intercept(s, c, o) {
      if (s.room !== 'horror') return false;
      const g = seg(s);
      if (g === 'merge' && (c.v === '去' || c.v === '左转' || c.v === '右转' || c.v === '转身')) { hideGame(s, o, 'move'); s.t += 4; return true; }
      if (g === 'gate' && c.v === '去' && c.target && c.target.kind === 'exit') return false;
      if (g === 'gate' && (c.v === '去' || c.v === '钻') && /恐怖|红|门|里面|进去|^$/.test(c.rest || '')) { s.t += advance(s, o) || 0; return true; }
      if (g === 'red' && c.v === '看' && /门|背面|后面/.test(c.words || '') && s.w.redOpen) { lookBack(s, o); return true; }
      return false;
    },
    follow(s, o) {
      if (s.room === 'staff') return DOR.C.rooms.staff.nav(s, o, '前进');
      // 门口：它不替你选
      if (seg(s) === 'gate') {
        o.say(U.cycle(s, 'gateWait', ['dl停在两扇门中间。暗红色的那扇在左边，员工通道在右边。它不往哪边开，它在等你。', 'dl还停在那里。它不替你选。']));
        o.sys('（〔前进〕进恐怖区，或者〔去员工通道〕。）');
        return 3;
      }
      return advance(s, o);
    },
  });

  // dl在恐怖区
  def.dl([
    { id: 'h_vu', phase: 'horror', pri: 2, when: s => s.w.vuLoop, text: 'VU-01' },
    { id: 'h_scared', phase: 'horror', pri: 3, when: s => s.f.scaredDl, text: ['ERR 12', '后方碰撞'] },
  ]);
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
// 参观4：小花园。它真的很小。然后，回程被堵住。
(function (G) {
  'use strict';
  const DOR = G.DOR; const U = DOR.U; const def = DOR.def; const C = DOR.C;

  DOR.toGarden = function (s, o) {
    s.phase = 'garden'; s.dl.room = 'garden'; s.dl.task = 'lead';
    DOR.log(s, 'phase', 'garden');
    o.say('dl带你往前开。它开得比平时快一点点。杆子顶上那块小屏幕上，“导览进行中”后面多了两个小箭头：▸▸');
    DOR.enterRoom(s, o, 'garden', 'in');
    return 15;
  };

  def.room('garden', {
    name: '小花园', start: 'in',
    spots: { in: { name: '小花园', names: ['小花园', '花园'] }, trough: { name: '水槽边', names: ['水槽边', '水槽', '滴灌'] }, sheetSpot: { name: '墙边', names: ['墙边', '表格那边'] } },
    exits: [
      { to: 'backway', names: ['回程通道', '回去', '通道'], label: '回程通道', show: s => s.f.tourEnded },
    ],
    describe(s, o) {
      if (s.phase === 'home') return DOR.homeGarden ? DOR.homeGarden(s) : '';
      const L = [
        '一个天井改的小花园。比天井小很多，大概一间卧室那么大。顶上是露天的，雨落进来。',
        '四盆〔植物〕，两盆已经死了。一条干掉的〔水槽〕。一把〔塑料椅〕。墙上一块〔员工休息区〕的牌子，旁边贴着一张〔浇水表〕。',
      ];
      if (s.f.pipeFixed) L[1] = '四盆〔植物〕，两盆已经死了。〔水槽〕里有一线细细的水在流。一把〔塑料椅〕。墙上一块〔员工休息区〕的牌子，旁边贴着一张〔浇水表〕。';
      return L;
    },
    enter(s, o, cnt) {
      DOR.describeRoom(s, o, cnt > 1);
      if (cnt === 1) {
        o.pause(1200);
        o.say('就这样。绕半圈就看完了。');
        o.pause(1000);
        o.say('dl停在那里，摄像头对着你，等你的反应。');
      }
    },
    up: '头顶是露天的。一小块灰色的天，四面是墙。雨从那一小块天里落下来。',
    lowView: '杆子缩回四十厘米。那两盆活着的植物一下子变得很大，叶子从你头顶上垂下来，叶尖上挂着雨珠。',

<script>
// 回程意外：服务道 → 沙漠。后半段不再有人替玩家安排体验。
(function (G) {

  def.phase('desert', {

      if (s.w.ballFlying) a.push({ g: '驾驶', label: '追球', cmd: '追球' });
      return a;
    },
    intercept(s, c, o) {
      if (s.room !== 'desert') return false;

      if (s.w.ballFlying && (/球/.test(w) || c.v === '前进' || /追/.test(w))) { chaseBall(s, o); s.t += 6; return true; }
      if (s.f.ballLost && /球/.test(w) && /追|找|去|看/.test(w)) { o.say(U.cycle(s, 'ballGone', ['你往那道沙脊看过去。什么也没有。风把沙脊的形状都改了。', '没有了。'])); return true; }
      if (s.w.dlRunning && (/追|冲|跟/.test(w) || (c.v === '去' && /下面|沙坡/.test(w)) || c.v === '前进')) { chase(s, o); s.t += 10; return true; }

      if (s.f.dlRan && U.hasCargo(s, 'ball') && !s.f.ballLost && !s.w.ballFlying && !s.w.dlRunning && s.turn > (s.n.chaseTurn || 0) + 1) { ballFly(s, o); return; }

  def.room('desert', {

    spots: {

      bottom: { name: '沙坡下', names: ['沙坡下', '沙坡', '下面', '坡底'], show: s => s.f.dlRan },
      box: { name: '测试盒', names: ['测试盒', '盒子', '小柱子'], show: s => s.f.dlRan,
        arrive: s => '你开到那根小柱子旁边。柱子上挂着一个很旧的铁盒子，盒子上的指示灯一闪一闪。' },
      door2: { name: '员工门', names: ['员工门', 'STAFF ONLY', '门', '建筑另一侧'], show: s => s.f.dlRan,
        block: (s, o) => { if (!s.w.crossingDone) crossing(s, o); return false; },
        arrive: s => '你开到建筑另一侧。墙上一扇很普通的灰色铁门，门上贴着一张褪色的贴纸：STAFF ONLY。' },
    },
    exits: [{ to: 'staffdoor', names: ['进去', '回去', '员工门里'], label: '进员工门', spot: 'door2', cond: (s, o) => { DOR.toHome(s, o); return false; } }],
    describe(s) {
      const L = ['沙漠。沙丘一道接一道，铺到很远。风一直在刮。'];
      if (s.f.towers) L.push('远处，一排维护塔亮着，一座接一座，一直亮到一公里外。');
      if (s.w.tracks) L.push('沙坡上有两道轮印，一道直，一道歪，一路冲到坡底，又歪歪扭扭地爬回来。');
      if (s.f.dlRan) L.push('坡下不远，一根小柱子上挂着一个〔测试盒〕，指示灯一闪一闪。再远一点，一条〔轨道〕横过沙地。建筑另一侧有一扇〔员工门〕。');
      return L;
    },
    nav(s, o, v) {
      if (v === '前进') {
        if (!s.f.dlRan) { o.say(U.cycle(s, 'dfwd', ['你往前挪到沙坡边上。沙子从你前轮底下一点一点往下流。', '你又往前挪了一点。风把沙吹到你的镜头上，又吹走。'])); return 4; }
        if (s.spot === 'edge') return DOR.goSpot(s, o, 'bottom');
        if (s.spot === 'bottom') return DOR.goSpot(s, o, 'box');
        if (s.spot === 'box') return DOR.goSpot(s, o, 'door2');
        return false;
      }
      if (v === '转身' && s.spot === 'edge') { o.say('你转过去。建筑灰色的背面，刚出来的那扇门，墙上的空调外机。它一直就在这儿。'); return 3; }
      return false;
    },
    up: '天很大。云在很高的地方走得很快。',
    lowView: '杆子缩回四十厘米。沙丘变成了山。风贴着地面吹，沙子一粒一粒从你镜头前面滚过去。',
    onWait(s, o) {
      DOR.log(s, 'desertStill', true);
      if (s.w.dlRunning) return '坡底下，dl还在往下冲。沙子被它甩起来一大片，在风里散开。';
      if (s.w.ballFlying) return '黄色的小点在沙丘上滚。越滚越小。';
      return U.cycle(s, 'dwait', [
        '你停着，只是看。风把一道沙脊慢慢削平，又在旁边堆起一道新的。',
        'dl停在你旁边。两台车的影子并排躺在沙上，杆子的影子很长。',
        '远处有一小团沙被风卷起来，转了几圈，散了。',
        '你们就这样待着。',
      ]);
    },
    onHorn(s, o) { return U.dlHere(s) ? U.cycle(s, 'dhorn', ['嘟。声音在沙漠里散得很快，没有回声。dl的摄像头转过来。', '嘟。dl也嘟了一下。']) : undefined; },
  });

  // 它会看你。你干什么它跟着看。然后——它先跑了。
  function dlWatch(s, o) {
    DOR.log(s, 'dlWatch', true);
    o.say('dl停在你旁边，没有往前走。它的摄像头转过来，看着你。你转，它也转。');
  }
  function dlRun(s, o) {
    s.f.dlRan = true; s.w.dlRunning = true; s.n.runTurn = s.turn; o.major = true;
    DOR.log(s, 'dlRun', true);
    o.say('你还在看。');
    o.pause(1200);
    o.say('dl突然往后倒了几米，停住。');
    o.pause(800);
    o.sound('horn2');
    o.say('嘟嘟。两下，很短。');
    o.pause(700);
    o.say('然后它直接从沙坡上冲下去了。');
    o.pause(1200);
    o.say('它没问你要不要比。它已经跑了。');
  }
  function chase(s, o) {
    s.w.chased = 'yes'; s.w.dlRunning = false; s.dl.task = 'sandy'; s.n.chaseTurn = s.turn; s.w.tracks = true; s.spot = 'bottom';
    DOR.log(s, 'chase', true);
    o.sound('sand_run');
    o.say([
      '你冲下去。',
      '',
      '沙坡比看起来陡。轮子有一半时候没有摩擦，整台车是滑下去的，杆子在风里甩来甩去，画面一下天一下地。dl就在你前面几米，车尾甩出一道沙。你追上去，差一个车身，差半个车身——',
      '坡底的沙是软的。两台车同时一头扎进去，扬起一大片沙，好几秒什么都看不见。',
    ]);
    o.pause(2000);
    o.say('沙落下来。dl在你旁边，半个车身埋在沙里，杆子上顶着一小撮沙。它的轮子还在空转。');
    if (s.f.dlTalks) { o.pause(900); o.dl('再来'); DOR.log(s, 'dlAgain', true); }
  }
  C.verbs['追'] = (s, o) => { o.say('追什么？'); return 1; };

  // 黄色球没了
  function ballFly(s, o) {
    s.w.ballFlying = true; s.n.flyTurn = s.turn; o.major = true; DOR.log(s, 'ballFly', true);
    o.say('一阵风。');
    o.pause(800);
    o.say('黄色球从你车尾的小斗里跳了出来，落在沙上，弹了一下，开始滚。');
    const i = s.cargo.indexOf('ball'); if (i >= 0) s.cargo.splice(i, 1);
    o.sys('（追？）');
  }
  function chaseBall(s, o) {
    const n = U.cnt(s, 'chaseBall');
    DOR.log(s, 'chaseBall', n);
    if (n === 1) { o.say('你去追。它滚得比你快。风一直推着它，它越过一道小沙脊，弹起来，又落下去。'); return; }
    if (n === 2) { o.say('你追上那道沙脊。它已经在下一道沙脊上了，小小的一个黄点，还在滚。'); return; }
    s.w.ballFlying = false; s.f.ballLost = true; DOR.log(s, 'ballLost', true);
    o.say('它越过最远的那道沙脊，看不见了。');
    o.pause(2200);
    o.say('风还在刮。');
  }
  def.beat('ballGoneAnyway', { phase: 'desert', pri: 2, when: (s, c) => s.w.ballFlying && s.turn - s.n.flyTurn >= 2 && c && !(/球|追/.test(c.words || '') || c.v === '前进'),
    run: (s, o) => { s.w.ballFlying = false; s.f.ballLost = true; DOR.log(s, 'ballLost', 'noChase'); o.say('黄色的小点在沙丘上越滚越远。越过一道沙脊，看不见了。'); } });

  // 一公里外的灯
  def.obj('testbox', {
    names: ['测试盒', '外线测试盒', '铁盒子', '指示灯'], room: 'desert', show: s => s.f.dlRan, spot: 'box', far: true,
    look: s => s.f.towers ? '测试盒的指示灯现在是常亮的绿色。' : '一个很旧的铁盒子，挂在沙地里一根小柱子上。盒盖上的标签和天井那个控制台是一样的字体：“外线测试　演示模式：录一段，放一遍”。上面一个大按钮。',
    farLook: '坡下一根小柱子，挂着一个一闪一闪的盒子。',
    verbs: { 按: (s, o) => towers(s, o), 推: (s, o) => towers(s, o) },
  });
  function towers(s, o) {
    if (s.spot !== 'box') DOR.goSpot(s, o, 'box');
    if (s.f.towers) { o.say('按下去。塔又亮了一遍。你按过的灯序，又在一公里的沙漠上跑了一遍。'); return 4; }
    s.f.towers = true; o.major = true;
    const seq = (s.w.seq || []).map(x => x.c);
    const src = seq.length ? 'player' : s.f.dlLights ? 'dl' : 'none';
    DOR.log(s, 'towers', { src, seq });
    o.say('你按下去。dl停在旁边，看着你。');
    o.pause(1500);
    o.sound('tower');
    o.say('远处，第一座维护塔亮了。');
    o.pause(1300);
    o.say('第二座。');
    o.pause(1100);
    o.say('第三座。第四座。光一路跨过沙丘，越来越远，越来越小——');
    o.pause(1600);
    o.say('一公里外，最后一盏巨大的维护灯打开了。整片沙漠被它照得发白。');
    o.pause(2000);
    if (src === 'player') {
      o.say('然后，整条外线开始闪。');
      o.pause(1000);
      o.say('不是随便闪。是' + seq.map(c => c + '，').join('').replace(/，$/, '。') + '一盏一盏，一公里长。');
      o.pause(1200);
      o.say('是你刚才在天井里随手按过的那一串。原样，一个都不差。' + (seq.some((c, i) => i && seq[i - 1] === c) ? '连你连按了两下的那一下，也在里面。' : ''));
    } else if (src === 'dl') {
      o.say('然后，整条外线开始闪：全亮。全灭。全亮。灭。亮。灭。');
      o.pause(1200);
      o.say('是dl在雨里开关天井的灯的那一串。原样，一次都不差。');
    } else {
      o.say('灯亮着。没有别的了。控制台那边今天什么都没录。');
    }
    if (src !== 'none') {
      o.pause(1400);
      o.say('dl疯狂地转头。看塔，看你，看塔，看你。');
      DOR.log(s, 'dlSpin', true);
    }
    return 10;
  }

  // 几米外的巨物
  def.obj('rail', { names: ['轨道', '铁轨', '道口'], room: 'desert', show: s => s.f.dlRan, look: s => s.w.crossingDone ? '轨道空了。风把列车卷起来的沙慢慢放回去。' : '一条真的铁轨，横过沙地，两头都看不到尽头。离员工门不远的地方有一个小道口：一根黑黄相间的栏杆，一盏警示灯。', verbs: { 去: (s, o) => DOR.goSpot(s, o, 'door2') } });
  function crossing(s, o) {
    if (s.w.crossingDone) return;
    s.w.crossingDone = true; o.major = true;
    const wh = s.w.whistle && s.w.whistle.length ? s.w.whistle : null;
    DOR.log(s, 'train', { whistle: wh });
    o.say('去员工门要经过那个小道口。两台车开到道口前面——');
    o.pause(1000);
    o.sound('crossing_bell', 'start');
    o.say('警示灯亮了。当、当、当。小栏杆落下来，横在你们面前。');
    o.pause(1600);
    o.say('地面开始震。');
    o.pause(1600);
    o.sound('train', 'play');
    o.say([
      '一列检修列车从很近的地方高速开过去。',
      '',
      '它大得荒谬。一米五的高度，你只看得见它的轮子——每一只轮子都比你高。轮组一组一组地过去，每过一组，地面就跳一下。风、沙、声音一起压过来，你的车被推得往后滑了半米。',
    ]);
    o.pause(2600);
    o.say('几十秒。');
    o.pause(2000);
    if (wh) {
      o.say('快过完的时候，它响了一下。');
      o.pause(1200);
      o.sound('whistle_seq', 'play', { seq: wh, big: true });
      o.say(DOR.whistleText(wh) + '。');
      o.pause(1500);
      o.say('是你在天井那辆小火车上随便按的那段节奏。一个停顿都不差。');
    } else if (s.f.trainGone) {
      o.say('最后一节车厢过去的时候，你看见车厢底下的挂钩上，挂着一辆很小很小的红色火车头。');
      DOR.log(s, 'toyTrainOnBig', true);
    } else {
      o.say('快过完的时候，它拉了一声很长的汽笛。');
    }
    o.pause(1400);
    o.say('最后一节车厢侧面印着：W-03。');
    o.sound('crossing_bell', 'stop');
    o.pause(1500);
    o.say('栏杆升起来。');
    o.pause(1000);
    o.say('dl的小喇叭：嘟。');
    o.sys('（你想嘟就跟它一起嘟。）');
  }

  DOR.toHome = function (s, o) {
    s.phase = 'home'; s.dl.room = 'staffdoor'; s.dl.task = 'lead';
    DOR.log(s, 'phase', 'home');
    o.sound('wind', 'stop');
    o.say('你用车头顶开那扇STAFF ONLY。门后面是一条很短的服务走廊，日光灯，灰色地胶。门在身后合上，风声一下子没了。');
    o.sound('rain_wall', 'start');
    o.say('雨声重新变回了隔着墙的那种。');
    DOR.enterRoom(s, o, 'staffdoor', 'a');
    return 12;
  };

  def.dl([
    { id: 'x_tower', phase: 'desert', pri: 2, when: s => s.f.towers, text: '亮了' },
    { id: 'x_ball', phase: 'desert', pri: 2, when: s => s.f.ballLost, text: ['球', '算了'] },
    { id: 'x_sand', phase: 'desert', pri: 1, when: s => s.w.chased === 'yes', text: '轮子里全是沙' },
  ]);
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
// 质感层：每个房间对“等、拍照、喇叭、抬头、低头、收杆、转身”都有自己的回应，并且跟着状态变。
// 只补没有的；已有的专门处理优先。
(function (G) {
  'use strict';
  const DOR = G.DOR; const U = DOR.U; const C = DOR.C;
  const R = C.rooms;
  function fill(id, key, fn) { const r = R[id]; if (!r) return; if (!r[key]) r[key] = fn; else if (key === 'onWait' || key === 'onPhoto' || key === 'onHorn') { const old = r[key]; r[key] = (s, o, c) => { const t = old(s, o, c); return t !== undefined ? t : fn(s, o, c); }; } }
  const home = s => s.phase === 'home' || s.phase === 'day2';

  // ---------- 办公室 ----------
  fill('office', 'onWait', s => {
    if (s.phase === 'tour1' && s.w.tablet) return U.cycle(s, 'owT', ['平板里，2019年的人还在走来走去。有人端着杯子从你身体里穿过去。', '平板里有人在喊谁的名字。没有人回答。然后大家都笑了。', '平板里的电视在放一代的预告片。第三遍了。']);
    if (home(s)) return U.cycle(s, 'owH', ['滴。桶满出来的那一点顺着桶壁流下去。', '雨声隔着墙。', '电子钟跳了一个数字：' + U.clock(s) + '。']);
    return U.cycle(s, 'ow', ['水从钢筋上滴下来，落进桶里。滴。满出来的那一点顺着桶壁流下去。', '窗外的灰色一点一点变浅。', '电子钟跳了一个数字：' + U.clock(s) + '。', '你停着。房间里只有滴水声，和你自己的风扇。']);
  });
  fill('office', 'onPhoto', s => {
    if (s.phase === 'tour1' && s.w.tablet) return '咔嚓。照片里只有空房间。平板里的人没有被拍进去。';
    return ({
      tv: '咔嚓。照片里是黑屏上的你：一盏放在滑板上的落地灯。',
      window: '咔嚓。窗外的灰，和玻璃上你自己的一点倒影。',
      desks: '咔嚓。六张桌子，灰上一条一条细细的直线。',
      wall: '咔嚓。墙上的钉子比挂着的东西多。',
      door: '咔嚓。门洞后面是黑的。照片里也是黑的。',
    })[s.spot] || '咔嚓。';
  });
  fill('office', 'down', s => '低头。地毯上有两道很浅的轮印，从电视前一直通到走廊口。压得最深的地方已经秃了。');

  // ---------- 走廊 ----------
  fill('corridor', 'onWait', s => home(s) ? '走廊很安静。' : !s.f.dlDropped ? U.cycle(s, 'cw', ['嗡嗡声。停。又响起来。', '尽头的门缝底下，一个很小的绿点亮了一下，又暗了。']) : '走廊。尽头有推箱子的声音。');
  fill('corridor', 'lowView', s => '杆子缩回四十厘米。车灯贴着地面，那两道磨亮的轮印就在眼前，像两条很浅的河。');
  fill('corridor', 'onHorn', s => '嘟。声音在窄走廊里来回撞了几下。' + (s.f.dlDropped ? '' : '尽头的嗡嗡声停了一下，又继续。'));
  fill('corridor', 'onPhoto', s => s.light ? '咔嚓。一截走廊，两道轮印，尽头一扇虚掩的门。' : '咔嚓。闪光灯把眼前两米照得雪白，后面是黑的。');
  fill('corridor', 'down', s => s.light ? '低头。两道轮印。压得最深的地方发亮。' : '低头。什么也看不见。');

  // ---------- 黑房间 ----------
  fill('dark', 'onWait', s => {
    if (!s.f.dlDropped) return U.cycle(s, 'dw0', ['嗡嗡声在黑里慢慢移动。', '你停着。嗡嗡声也停了一下。然后又开始。']);
    if (!s.w.darkLit) {
      if (['restack', 'battery', 'battery2'].indexOf(s.dl.task) >= 0) return '';
      return U.cycle(s, 'dwd', ['黑里，只有dl的灯在动。', '你停着。dl也停了一下，摄像头往你这边转了转，又转回去。', '充电架那边有一格绿灯。黑里只有它是亮的。']);
    }
    if (home(s)) return undefined;
    return U.cycle(s, 'dw', ['一百零八格。你数到第三排就数乱了。', '充电架嗡嗡响。只有一格亮着的那种嗡嗡。', '门背后那张规程的一角翘起来了，被空调吹得一动一动。']);
  });
  fill('dark', 'onPhoto', s => s.w.darkLit ? '咔嚓。一整面墙的格子，只有' + (s.w.docked ? '两' : '一') + '格是绿的。照片看起来像一张很难的找不同。' : '咔嚓。闪光灯把眼前两米照得雪白，后面全是黑。' + (s.f.dlDropped ? '白里有半个dl，正好在转头。' : ''));
  fill('dark', 'down', s => s.w.darkLit ? '低头。地上有两道新的轮印，是你的。旁边是很多道旧的，是它的。' : '低头。车灯照着地面：灰，一截线头。');

  // ---------- 天井 ----------
  const rain = s => !!s.f.roofOpen;
  fill('atrium', 'onWait', s => rain(s)
    ? U.cycle(s, 'aw1', ['雨落在彩格上，一格一格变深。', '天井很高。你停着，听雨。', 'dl在雨里停了一会儿，杆子上的小屏幕挂满了水珠。它没有去擦。'])
    : U.cycle(s, 'aw0', ['光从遮光板的缝里漏下来，一条一条的，慢慢挪动。', '连锁装置某个地方“嗒”地响了一声。什么也没发生。', 'dl在装置旁边转了半圈，又转回来。']));
  fill('atrium', 'onPhoto', s => s.f.shadowBig ? '咔嚓。照片里是墙上那个六米高的影子。影子脚下，两台很小的车。' : rain(s) ? '咔嚓。雨丝在照片里是一道一道白的斜线。' : '咔嚓。天井太大了，照片里什么都很小。');
  fill('atrium', 'down', s => '低头。彩格地面，红黄蓝绿，有几格被车轮磨得发白。' + (rain(s) ? '现在每一格里都有一点天。' : ''));
  fill('atrium', 'turnSee', s => rain(s) ? '雨从四层楼上落下来。' : '连锁装置从左边一直绕到右边。');

  // ---------- 恐怖区 / 员工通道 ----------
  fill('horror', 'onPhoto', s => '咔嚓。照片里只有车灯照到的三米。三米以外是纯黑。');

<script>
// 最终发现：第二天重新连接。主路径只强制看三件事，其余全部埋在记录深处。
// 语气是平的。不解释，不高亮，不安排任何人指出任何事。
(function (G) {
  'use strict';
  const DOR = G.DOR; const U = DOR.U; const def = DOR.def; const C = DOR.C; const D = DOR.data;

  function two(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(d) { return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }
  function hm(d) { return two(d.getHours()) + ':' + two(d.getMinutes()); }
  // 昨天某个游戏内时刻（log.t 秒）对应的真实钟点
  function at1(s, t) { return new Date(new Date(s.w.day1Now).getTime() + t * 1000); }
  function first(s, type, pred) { return s.log.find(e => e.type === type && (!pred || pred(e))); }
  function has(s, type) { return !!first(s, type); }

  DOR.startDay2 = function (s, o) {

    const nd = m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + 1)) : new Date(Date.now() + 86400000);
    s.now = nd.getUTCFullYear() + '-' + two(nd.getUTCMonth() + 1) + '-' + two(nd.getUTCDate()) + 'T07:03:00' + (m ? m[4] : '');
    s.t = 0; s.phase = 'day2'; s.room = 'dark'; s.spot = 'rack'; s.mast = 'down'; s.light = false; s.held = null;
    s.dl.room = 'none'; s.dl.task = 'gone'; s.dl.follow = false;
    s.w.rec = 0;
    DOR.log(s, 'day2', true);
    o.blocks.push({ k: 'connect', day2: true });
    o.scene('dark');
    o.say('你重新连接。');
    o.pause(1400);
    o.say('还是那个黑房间。灯亮着。画面很低——杆子还收着，你还停在充电位上，B2-06。电量100%。');
    o.pause(1800);
    o.say('旁边那个位置空了。');
    o.pause(2200);
    o.say('B2-05的绿灯灭着。触点上没有灰。' + (has(s, 'dlKeptDomino') ? '格子顶上，那块多米诺骨牌还在。' : ''));
    o.pause(1400);
    o.say('角落里，〔工作台〕的显示器亮着。屏幕上是一个播放器，标题一行小字：CAM 天井-01　固定机位　长期维护记录。');
    o.hud();
  };

  DOR.day2Dark = function (s) {
    return ['黑房间。灯亮着。一百零八格〔充电位〕，一格亮着，是你的。', 'B2-05空着。' + (has(s, 'dlKeptDomino') ? '顶上一块多米诺骨牌。' : ''), '角落的〔工作台〕，显示器亮着。'];
  };

  // ---------- 七年在同一个画面里经过 ----------
  function reel(s) {
    const F = [];
    const add = (ts, text) => F.push({ ts, text });
    add('2019-05-20 16:12', '天井。连锁装置装了一半，地上全是零件。一个人蹲在画面边上，在拧什么。');
    add('2019-06-12 09:40', '九个人从画面前面走过去，走向办公室那边。有一个倒着走，在说话。');
    add('2019-06-12 18:02', '灯台亮着。有人在按灯。画面外有笑声的波形。');

  // ---------- 滑到昨天：画面里第一次出现你 ----------
  function yesterday(s) {
    const F = []; const d = fmt(new Date(s.w.day1Now));
    const add = (t, text) => F.push({ ts: d + ' ' + hm(at1(s, t)), text });
    const enter = first(s, 'enter', e => e.data && e.data.room === 'atrium');
    const t0 = enter ? enter.t : 900;
    add(Math.max(0, t0 - 20), 'D02从画面左边开进来。它的小屏幕亮着。');
    add(t0, 'R07从画面左边开进来。进门的时候转弯转大了，蹭了一下门框，倒回去，又转了一次。');
    const pick = [
      ['lampTilt', 'R07把投影灯推歪了。D02过来把它扶正。'],
      ['bigShadow', '墙上出现了一个六米高的影子。两台车都没动。'],
      ['lightPress', 'R07停在灯台前面。灯一闪一闪。'],
      ['inBox', 'R07钻进了一个纸箱。纸箱在地上挪了一下。'],
      ['trainTunnel', 'R07把小火车推进了隧道。两台车在隧道口停了很久。'],
      ['chainRun', '连锁装置动了。两台车跟着球从左边跑到右边。'],
      ['roofOpen', '顶开了。画面变亮，然后有了雨。'],
      ['dlLearned', 'D02把旁边那盏落地灯也推歪了。'],
      ['dlInvite', 'D02按了一下黄色。整个画面黄了一秒。R07没有动。'],
    ];
    for (const [type, text] of pick) { const e = first(s, type); if (e) add(e.t, text); }
    const out = first(s, 'phase', e => e.data === 'horror');
    add(out ? out.t : t0 + 600, '两台车从画面右边出去了。');
    const back = first(s, 'endDay1');
    if (s.f.roofOpen) add(back ? back.t - 200 : t0 + 1500, '空的天井。雨从顶上落下来。墙上的影子被雨打湿。');
    F.sort((a, b) => a.ts < b.ts ? -1 : 1);
    return F;
  }

  // ---------- 再往后一格：你不在的时候，它自己又玩了一次 ----------
  function lastFrame(s) {
    const L = ['今天　05:28　天井　访客0', ''];
    if (s.f.dlLearned || s.w.lampTilt >= 2) {
      L.push('画面里只有dl一台车。它在那盏落地灯旁边，用机械臂一点一点把灯往一边推。推一下，退回来看。再推一点。');
      L.push('停。那个歪的角度，和你昨天把投影灯推成的角度一样。');
      L.push('它停在那里，看了一会儿。');
      DOR.log(s, 'lastFrame', 'lamp');
    } else if (s.f.shadowBig) {
      L.push('画面里只有dl一台车。投影灯开着。它开到灯前面，停住，把机械臂慢慢举起来。');
      L.push('墙上出现一个六米高的影子，举着一只手。');
      L.push('它停在那里，看了一会儿。');
      DOR.log(s, 'lastFrame', 'shadow');
    } else if (s.f.boxPlayed) {
      L.push('画面里只有dl一台车。它开到角落，收起杆子，一点一点钻进了一只纸箱。');
      L.push('纸箱在地上挪了一下。又挪了一下。');
      L.push('然后停住了。它在里面待了一会儿。');
      DOR.log(s, 'lastFrame', 'box');
    } else if (s.f.trainGone) {
      L.push('画面里只有dl一台车。它停在小火车的隧道口，收起杆子，把摄像头伸进去看。');
      L.push('看了一会儿。');
      DOR.log(s, 'lastFrame', 'tunnel');
    } else if (s.w.whistle && s.w.whistle.length) {
      L.push('画面里只有dl一台车。它停在小火车旁边，在车头的鸣笛键上按了一段。');
      L.push('声音波形：' + DOR.whistleText(s.w.whistle) + '。');
      L.push('然后它停在那里，等小火车开一圈回来。');
      DOR.log(s, 'lastFrame', 'whistle');
    } else if (first(s, 'dlInvite')) {
      L.push('画面里只有dl一台车。它开到灯台前面，用杆子按了一下黄色的按钮。');
      L.push('整个天井黄了一秒。');
      L.push('它转过去，对着昨天你停着的那个位置。停在那里，看了一会儿。');
      DOR.log(s, 'lastFrame', 'yellow');
    } else {
      L.push('画面里只有dl一台车。它开到角落那个什么用都没有的开关前面，按了一下。');
      L.push('什么都没发生。它又按了一下。');
      L.push('它停在那里，看了一会儿。');
      DOR.log(s, 'lastFrame', 'switch');
    }
    L.push('');
    L.push('记录到此为止。');
    return L;
  }

  // ---------- 可选：巡检记录 ----------
  function checks(s) {
    const all = D.tourChecks();
    const hist = s.hist || [];
    const L = ['TOUR CHECK　巡检记录　共' + (all.length + hist.length + 1) + '条', '', '编号　　日期　　　　访客　路线　备注'];
    const row = c => '#' + String(c.no).padStart(4, '0') + '　' + c.date + '　' + c.visitors + '　　' + c.route + '　' + (c.note || '');
    for (const c of all.slice(0, 6)) L.push(row(c));
    L.push('……');
    for (const c of all.slice(all.length - 3)) L.push(row(c));
    let no = all.length;
    for (const h of hist) { no++; L.push(row({ no, date: h.date, visitors: 1, route: 'PASS', note: h.note || '' })); }
    no++;
    L.push(row({ no, date: fmt(new Date(s.w.day1Now)), visitors: 1, route: 'PASS', note: s.f.pipeFixed ? 'B2-07 给水管 已通' : '' }));
    DOR.log(s, 'readChecks', true);
    return L;
  }

  // ---------- 可选：它也记录过你 ----------
  function photos(s) {
    if (s.w.noRec) {
      DOR.log(s, 'readPhotos', 'off');
      return ['影像记录', '', '影像留存：关（访客设置）', '本次参观只保留行程与控制台记录。', '',
        '行程：办公室 → 维护区 → 办公室 → 天井 → ' + (s.w.horrorIn ? '恐怖体验区' : '员工通道') + ' → 小花园 → 服务道 → 外线 → 服务走廊 → 维护区',
        '控制台：灯台 ' + ((s.w.seq || []).length) + ' 次　外线测试盒 ' + (s.f.towers ? 1 : 0) + ' 次'];
    }
    const L = ['影像记录　D02　' + fmt(new Date(s.w.day1Now)), ''];
    const d = fmt(new Date(s.w.day1Now)); let n = 0;
    const ph = (e, text, star) => { n++; L.push('IMG_' + String(n).padStart(4, '0') + '　' + d + ' ' + hm(at1(s, e ? e.t : 0)) + (star ? '　★' : '')); L.push('　' + text); };
    const tilt = first(s, 'lampTilt') || first(s, 'tweak') || first(s, 'inBox') || first(s, 'lightPress') || first(s, 'enter', e => e.data && e.data.room === 'atrium');
    if (tilt) ph(tilt, tilt.type === 'inBox' ? '天井。一只纸箱，底下露出四个轮子。' : tilt.type === 'lightPress' ? '天井。R07停在灯台前面，杆子歪着。灯是花的。' : '天井。R07的车尾，和一盏被推歪的灯。拍摄者离得太近，对不上焦。');
    const hz = first(s, 'hide') || first(s, 'horrorStill') || first(s, 'staffVu') || first(s, 'hseg');
    if (hz) ph(hz, s.w.horrorIn ? '恐怖体验区。R07停在走道中间，一动不动，杆子朝着前面。画面左半边被一截铁架挡住了。' : '员工通道。R07停在一条缝前面。画面左半边被一截木龙骨挡住了。');
    const gd = first(s, 'pipeFixed') || first(s, 'wrote');
    if (gd) ph(gd, gd.type === 'wrote' ? '小花园。R07的机械臂贴在墙上的表格上。只拍到了机械臂。' : '小花园。水槽。水。R07只拍进去一个轮子。');
    const ds = first(s, 'desertReveal');
    if (ds) ph(ds, '沙漠边。R07停在建筑的影子边上，不动。从后面拍的。杆子很长，沙丘很远。');
    const ch = first(s, 'chase');
    if (ch) ph(ch, '沙坡。一大团沙，什么也看不清。', false);
    const star = ch ? first(s, 'dlAgain') || ch : first(s, 'towers') || first(s, 'train') || ds;
    if (star) ph(star, ch ? '沙坡。两道车辙，一道直，一道歪，从坡顶一直到坡底。' : first(s, 'towers') ? '外线。一排维护塔亮着，一直亮到很远。画面下面露出一截R07的杆子。' : '道口。两根杆子的影子，并排。', true);
    if (!n) L.push('（无）');
    DOR.log(s, 'readPhotos', n);
    return L;
  }

  // ---------- 可选：出站记录 ----------
  function outbound(s) {
    DOR.log(s, 'readOutbound', true);
    return ['出站记录　OUTBOUND', '',
      '今天 04:00　D02　SELF-CHECK　OK',
      '今天 04:02　B2-05　CHARGE COMPLETE　100%',
      '今天 05:12　D02　ROUTE　天井',
      '今天 05:30　D02　ROUTE　维护区',
      '今天 05:38　Service door 2　OPEN',
      '今天 05:41　W-03　Scheduled 18:30　Actual 05:41',
      '今天 05:41　D02　TRANSFER REQUEST ACCEPTED　Destination: EXTERNAL',
      '今天 05:43　Service door 2　CLOSED',
      '今天 06:00　B2-06　CHARGE COMPLETE　100%'];
  }

  def.phase('day2', {
    actions(s) {
      const a = [];
      const r = s.w.rec || 0;
      if (r === 0) a.push({ g: '记录', label: '播放维护记录', cmd: '看记录' });
      else if (r < 3) a.push({ g: '记录', label: '往后滑', cmd: '往后滑' });
      else {
        a.push({ g: '记录', label: '巡检记录', cmd: '巡检记录' });
        a.push({ g: '记录', label: '影像记录', cmd: '影像记录' });
        a.push({ g: '记录', label: '出站记录', cmd: '出站记录' });
        a.push({ g: '网页', label: '旧网页：管理员页', cmd: '管理员页' });
        a.push({ g: '网页', label: '旧网页：帖子', cmd: '看帖子' });
        a.push({ g: '驾驶', label: '结束连接', cmd: '断开' });
      }
      return a;
    },
    intercept(s, c, o) {
      const w = (c.words || '').replace(/\s+/g, '');
      const r = s.w.rec || 0;
      if (r === 0 && (/记录|显示器|工作台|播放|屏幕|回放/.test(w))) { playReel(s, o); return true; }
      if (r >= 1 && r < 3 && (/滑|往后|继续|下一|快进|昨天|记录|播放|看/.test(w) || c.v === '前进')) { if (r === 1) playYesterday(s, o); else playLast(s, o); return true; }
      if (r >= 3) {
        if (/巡检|TOURCHECK|2547/i.test(w)) { list(o, checks(s)); return true; }
        if (/影像|照片|相册|IMG/i.test(w)) { list(o, photos(s)); return true; }
        if (/出站|OUTBOUND|调度/i.test(w)) { list(o, outbound(s)); return true; }
        if (/管理员|设备|admin/i.test(w)) { DOR.log(s, 'readDevices', true); DOR.page(o, 'admin', { devices: D.devices(true), day2: true }); return true; }
        if (/帖子|评论|回复|旧网页|网页/.test(w)) { DOR.log(s, 'readPost', true); DOR.page(o, 'post', { scroll: 999, replied: !!s.w.reply, day2: true }); return true; }
      }
      if (/断开|结束|下线/.test(w) || c.v === '离开') {
        if (r < 3) { o.sys('（维护记录还在播放。）'); return true; }
        theEnd(s, o); return true;
      }
      if (c.v === '说') { o.sys('（消息已发送。显示：对方不在线。）'); DOR.log(s, 'saidDay2', c.say); return true; }
      if (r < 3 && c.v !== '看' && c.v !== '环顾' && c.v !== '等' && c.v !== '帮助') { o.say('显示器还亮着。播放器停在第一帧。'); return true; }
      return false;
    },
  });
  function list(o, L) { o.blocks.push({ k: 'record', lines: L }); }

  function playReel(s, o) {
    s.w.rec = 1; o.major = true; DOR.log(s, 'reel', true);
    o.say('你开到工作台前，升起杆子。播放器开始播放。');
    o.blocks.push({ k: 'reel', frames: reel(s), speed: 'fast' });

  async function play(blocks) {
    busy = true; skip = false; $('#skiphint').textContent = '点击任意处或按回车跳过';
    if (HOOK && HOOK.blocks) HOOK.blocks(blocks, game);
    for (const b of blocks) {
      if (HOOK && HOOK.block) HOOK.block(b, game);
      switch (b.k) {
        case 'narr': add('narr', mark(b.text)); await wait(readTime(b.text)); break;
        case 'sys': if (document.body.classList.contains('web')) toast(b.text); else add('sys', mark('· ' + b.text.split('\n').join('\n· '))); await wait(250); break;
        case 'me': add('me', esc(b.text)); break;
        case 'dl': await typeDl(b.text); await wait(300); break;
        case 'typing': {
          const el = add('typing', '对方正在输入……', 'div');
          await wait(b.long ? b.ms : Math.min(b.ms, 2200));
          el.remove(); break;
        }
        case 'pause': await wait(b.ms); break;
        case 'title': add('title', esc(b.text), 'div'); await wait(2500); break;
        case 'scene': setScene(b.id); break;
        case 'hud': drawHud(); break;
        case 'sound': if (pref.sound && !(HOOK && HOOK.ownSound)) AU.event(b); break;   // V1.1 自己在那句话出现时放声音
        case 'page': showPage(b); break;
        case 'queue': await queue(b.from); break;
        case 'connect': await connectFx(b); break;
        case 'disconnect': await disconnectFx(); break;
        case 'black': document.body.classList.add('black'); feed.innerHTML = ''; hud.style.visibility = 'hidden'; $('#bar').style.visibility = 'hidden'; await wait(1500); break;
        case 'reel': await reel(b); break;
        case 'record': add('record' + (b.still ? ' still' : ''), esc(b.lines.join('\n')), 'div'); await wait(b.still ? 5000 : 600); break;
        default: break;
      }
    }
    busy = false; skip = false; $('#skiphint').textContent = '';
    drawHud(); drawActs(); AU.ambient(game.s);
    if (HOOK && HOOK.after) HOOK.after(game);
    store.set(SAVE, game.save());
    if (game.s.ended && !finished) { finished = true; finish(); }
  }

<script>
// V1.1 的界面：对话框（叙述分页、dl说话）、菜单和选项、顶部提示条、显示器面板、回看。
// 文字版核心的每一块输出都交到这里，按玩家的节奏一块一块演；演到哪一块，画面里对应的事才发生（onBlock）。
(function () {
  'use strict';
  const $ = q => document.querySelector(q);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- 文字 → 带颜色的字符序列（〔东西〕黄色，〖地方〗蓝色） ----------
  function tokens(text) {
    const out = []; let cls = '';
    for (const ch of String(text)) {
      if (ch === '〔') { cls = 'o'; continue; } if (ch === '〕') { cls = ''; continue; }
      if (ch === '〖') { cls = 'p'; continue; } if (ch === '〗') { cls = ''; continue; }
      out.push([ch, cls]);
    }
    return out;
  }
  function html(toks, n) {
    let h = '', cur = null;
    for (let i = 0; i < Math.min(n, toks.length); i++) {
      const [ch, c] = toks[i];
      if (c !== cur) { if (cur) h += '</span>'; if (c) h += '<span class="' + c + '">'; cur = c; }
      h += ch === '\n' ? '<br>' : esc(ch);
    }
    if (cur) h += '</span>';
    return h;
  }
  // 分页：每页最多三行（竖屏手机五行）（按对话框宽度估算每行字数），尽量在标点处断开
  function paginate(text, cpl, lines) {
    const per = cpl * (lines || 3), pages = [];
    for (let para of String(text).split('\n')) {
      para = para.replace(/^\s+/, m => m.replace(/　/g, '　'));
      if (!para.trim()) continue;
      while (para.length > per) {
        let cut = per;
        for (let k = per; k > per * 0.55; k--) if ('。！？；…”'.indexOf(para[k - 1]) >= 0) { cut = k; break; }
        if (cut === per) for (let k = per; k > per * 0.55; k--) if ('，、：'.indexOf(para[k - 1]) >= 0) { cut = k; break; }
        while (cut < para.length && '，。、！？；：”…）'.indexOf(para[cut]) >= 0) cut++;   // 标点别落到下一页开头
        pages.push(para.slice(0, cut)); para = para.slice(cut);
      }
      if (!para) continue;
      // 很短的段落和上一页拼在一起（不超过一页）
      if (pages.length && pages[pages.length - 1].length + para.length + 1 <= per && para.length < cpl) pages[pages.length - 1] += '\n' + para;
      else pages.push(para);
    }
    return pages;
  }

  // ---------- 对话框 ----------
  const DLG = {
    q: [], cur: null, wait: 0, log: [], onBlock: null, onIdle: null, onEnd: null, speaking: false,
    push(b) { this.q.push(b); },
    busy() { return !!(this.q.length || this.cur || this.wait > 0 || MENU.open || PANEL.open || this.reel); },
    // 每行几个字：对话框没显示时量不到宽度，按它显示时的宽度算（和 px11.css 一致）
    cpl() {
      const box = $('#dlgText'); let w = box ? box.clientWidth : 0;
      if (!w) { const v = $('#view'); w = document.body.classList.contains('portrait') ? window.innerWidth - 20 - 38 : Math.min((v ? v.clientWidth : 320) - 16, 760) - 38; }
      const fs = parseFloat(getComputedStyle(box || document.body).fontSize) || 16;
      return Math.max(8, Math.floor(w / (fs * 1.04)));
    },
    // 下一块
    next() {
      while (!this.cur && this.wait <= 0 && !this.reel && this.q.length) {
        const b = this.q.shift();
        if (this.onBlock) this.onBlock(b);
        switch (b.k) {
          case 'narr': this.say(b.text, 'narr'); break;
          case 'dl': this.say(b.text, 'dl'); break;
          case 'sys': if (!window.DOR12 && !hideSys(b.text)) toast(b.text.replace(/[〔〕〖〗]/g, '')); break;
          case 'pause': this.wait = Math.min(1.4, b.ms / 1000); break;
          case 'typing': this.typing = Math.min(1.6, (b.long ? b.ms : Math.min(b.ms, 2200)) / 1000); this.wait = this.typing; break;
          case 'title': showTitle(b.text); this.wait = 2.5; this.after = hideTitle; break;
          case 'black': document.body.classList.add('v11black'); this.wait = 1.2; break;
          case 'connect': document.body.classList.remove('v11black'); flash('noise', 0.9); this.wait = 0.9; break;
          case 'disconnect': flash('noise', 0.8); toast('连接已断开'); this.wait = 1.6; break;

    },
    say(text, kind) {
      const pages = paginate(text, this.cpl(), document.body.classList.contains('portrait') ? 5 : 3);
      if (!pages.length) return;
      this.cur = { kind, pages, i: 0, n: 0, toks: tokens(pages[0]), typo: null };
      this.log.push({ kind, text: String(text).replace(/[〔〕〖〗]/g, '') }); if (this.log.length > 300) this.log.shift();
    },
    // 每帧：打字机
    update(dt) {
      if (this.wait > 0) { this.wait -= dt; if (this.typing) this.typing -= dt; if (this.wait <= 0) { this.wait = 0; this.typing = 0; if (this.after) { this.after(); this.after = null; } this.next(); } render(); return; }
      if (this.reel) { this.reel.t += dt; if (this.reel.t >= this.reel.dur) { this.reel = null; this.next(); } render(); return; }
      const c = this.cur; if (!c) { if (this.q.length) this.next(); return; }
      if (c.n < c.toks.length) {
        if (c.kind === 'dl') {
          // dl打字：一个键一个键，偶尔按错再删掉
          c.acc = (c.acc || 0) + dt;
          if (c.typo) { if (c.acc > 0.28) { c.acc = 0; c.typo = null; } }
          else if (c.acc > 0.08 + (c.jit || 0)) { c.acc = 0; c.jit = Math.random() * 0.1 + ('。，…'.indexOf(c.toks[c.n][0]) >= 0 ? 0.22 : 0); if (c.toks.length > 3 && c.n > 0 && Math.random() < 0.05) c.typo = '的了是我不在有这个人你们它到说要'[Math.floor(Math.random() * 16)]; else c.n++; }
        } else c.n = Math.min(c.toks.length, c.n + dt * 42);

      }
    },
    // A：打字中 → 显示完整一页；显示完 → 下一页 / 下一块
    a() {
      if (this.reel) { this.reel.t = this.reel.dur; return; }
      const c = this.cur; if (!c) return;
      if (c.n < c.toks.length) { c.n = c.toks.length; c.typo = null; render(); return; }
      if (c.i + 1 < c.pages.length) { c.i++; c.n = 0; c.toks = tokens(c.pages[c.i]); render(); return; }
      this.cur = null; this.next();
    },
    // 清掉排队的对话（跳过、测试跳转用）；画面里的事件照样发生，只是不演
    reset() {

      if (this.after) { this.after(); this.after = null; }
      render();
    },
  };
  // 文字版给玩家的操作提示：V1.1 用菜单和选项代替，不显示
  function hideSys(t) { return /^附近：|视觉标注/.test(t); }

  function render() {
    const box = $('#dlg'), c = DLG.cur;
    if (!box) return;
    const show = !!c || DLG.typing > 0 || !!DLG.reel;
    box.classList.toggle('on', show);
    box.classList.toggle('dl', !!(c && c.kind === 'dl') || DLG.typing > 0);
    const T = $('#dlgText');
    if (DLG.reel) { const f = reelFrame(DLG.reel); T.innerHTML = f ? '<span class="ts">' + esc(f.ts) + '</span>　' + esc(f.text) : ''; $('#dlgMore').style.visibility = 'hidden'; return; }
    if (DLG.typing > 0 && !c) { T.innerHTML = '<span class="typing">正在输入……</span>'; $('#dlgMore').style.visibility = 'hidden'; return; }
    if (!c) return;
    T.innerHTML = html(c.toks, Math.floor(c.n)) + (c.typo ? esc(c.typo) : '') + (c.kind === 'dl' && c.n < c.toks.length ? '<span class="cur"></span>' : '');

  }

    return fr[fr.length - 1];
  }

  // ---------- 顶部提示条 ----------
  let toastT = null;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }

  function showTitle(t) { const el = $('#bigTitle'); el.textContent = t; el.classList.add('on'); }
  const flashes = {};
  function flash(k, s) { flashes[k] = s; }

  // ---------- 菜单 / 选项（方向键上下，A确认，B取消；手机直接点） ----------
  const MENU = {
    open: null,
    // items: [{label, fn, sub:true}]；title 可选；cancel 是 B 时做的事（默认关掉）
    show(title, items, opt) {
      opt = opt || {};
      this.open = { title, items, i: 0, cancel: opt.cancel, where: opt.where || 'center' };
      const el = $('#menu'); el.className = 'on ' + this.open.where;
      el.innerHTML = (title ? '<div class="h">' + esc(title) + '</div>' : '') + items.map((it, k) => '<button type="button" data-i="' + k + '" class="' + (it.cls || '') + '">' + esc(it.label) + (it.sub ? ' ›' : '') + '</button>').join('');
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); this.pick(+b.dataset.i); }));
      this.hl();
    },
    hl() { const el = $('#menu'); el.querySelectorAll('button').forEach((b, k) => b.classList.toggle('sel', this.open && k === this.open.i)); const s = el.querySelector('.sel'); if (s && s.scrollIntoView) s.scrollIntoView({ block: 'nearest' }); },
    move(d) { if (!this.open) return; const n = this.open.items.length; this.open.i = (this.open.i + d + n) % n; this.hl(); },
    pick(i) { if (!this.open) return; const it = this.open.items[i === undefined ? this.open.i : i]; this.close(); if (it && it.fn) it.fn(); },
    back() { if (!this.open) return; const c = this.open.cancel; this.close(); if (c) c(); },
    close() { this.open = null; const el = $('#menu'); el.className = ''; el.innerHTML = ''; setTimeout(() => DLG.next(), 0); },
  };

  // ---------- 显示器面板（第二天的记录、网页卡片、回看） ----------
  const PANEL = {
    open: false,
    show(text, isHTML) { const el = $('#panel'); el.querySelector('.body').innerHTML = isHTML ? text : esc(text).replace(/\n/g, '<br>'); el.classList.add('on'); el.querySelector('.body').scrollTop = 0; this.open = true; },
    close() { $('#panel').classList.remove('on'); this.open = false; setTimeout(() => DLG.next(), 0); },
    scroll(d) { $('#panel .body').scrollTop += d * 60; },
  };

  // ---------- 输入框（说话） ----------
  function ask(title, cb) {
    const el = $('#ask'); el.classList.add('on'); el.querySelector('.h').textContent = title;
    const inp = el.querySelector('input'); inp.value = ''; setTimeout(() => inp.focus(), 30);
    MENU.asking = true;
    const done = v => { el.classList.remove('on'); MENU.asking = false; inp.blur(); el.onsubmit = null; if (v) cb(v); };
    el.onsubmit = e => { e.preventDefault(); done(inp.value.trim()); };
    el.querySelector('.x').onclick = () => done('');
  }

  window.V11 = { DLG, MENU, PANEL, toast, ask, flashes, paginate };
})();

  const sim = new PX.Sim(eng);
  window.__px = { sim, R, eng };

  // ---------- 文字版的输出 → 对话框 ----------
  const HOOK = window.DOR_HOOK;
  HOOK.blocks = (bs, gm) => R.expect(bs, gm.s);
  HOOK.block = (b) => {
    // 网页阶段的东西（帖子、排队、设备列表）照旧由文字版界面演；其余交给对话框，文字版界面立即处理完
    if (b.k === 'page' || b.k === 'queue' || (web() && b.k !== 'connect')) { D().setSpeed(0); return; }   // 测试模式连网页动画也跳过
    D().setSpeed(0);
    DLG.push(b); if (!DLG.cur && !DLG.wait) DLG.next();
  };
  HOOK.after = () => { layout(); if (!DLG.busy()) idle(); };
  HOOK.webcard = h => { PANEL.show(h, true); };
  DLG.onBlock = (b, quiet) => {
    const s = eng.s; if (!s) return;
    R.ev(b, sim, s);
    if (quiet) return;
    if (b.k === 'sound' && D().sound) DOR.audio.event(b);
    if (b.k === 'dl') dlTalk = 1.2;
  };
  DLG.onIdle = () => idle();

  // 对话都讲完了：让车可以动，看看剧情里有没有新出现的动作要问玩家，结局
  let lastSpecial = null, ended = false;
  const BASIC = new Set(['前进', '后退', '左转', '右转', '转身', '抬头', '低头', '跟着dl', '等', '环顾', '看']);
  const PLAIN = new Set(['驾驶', '移动', '东西']);   // 机械臂（接平板）、网页（第二天的管理员页）这些组的动作都要能点到
  function specials() {
    const gm = game(); if (!gm) return [];
    return gm.actions().filter(a => !a.obj && !BASIC.has(a.cmd) && (!PLAIN.has(a.g) || (a.g === '驾驶' && !BASIC.has(a.cmd))) && !/^(开灯|关灯|收杆|升杆|拍照|喇叭|状态)/.test(a.cmd));
  }
  function idle() {
    if (DLG.busy() || D().busy) return;
    sim.done();
    const s = eng.s; if (!s || web()) return;
    if (s.ended && !ended) { ended = true; $('#end').classList.add('on'); return; }
    const sp = specials(), keyOf = a => a.cmd + '|' + a.label;
    const prev = lastSpecial || new Set();
    const fresh = sp.filter(a => !prev.has(keyOf(a)));
    lastSpecial = new Set(sp.map(keyOf));
    // Choices are persistent, named buttons in the guide. Never open an unsolicited modal.
    if (window.DOR12) window.DOR12.render(true);
  }
  function doAction(a) {
    if (a.whistle) return D().whistle();
    if (a.obj) return objMenu(a.obj);
    if (a.fill) return V.ask(a.cmd.trim() === '写' ? '写在表格上的话' : '请输入', v => send(a.cmd + v));
    send(a.cmd);
  }
  function send(cmd) { if (eng.busy()) return; D().send(cmd); }

  // ---------- 东西的动作菜单 ----------
  function objMenu(id) {
    const gm = game(), ob = DOR.C.objs[id]; if (!ob) return;
    if (!DOR.inScope(gm.s, ob)) return send('看' + ob.names[0]);
    const vs = gm.verbsFor(id);
    if (vs.length <= 1) return send(vs.length ? vs[0].cmd : '看' + ob.names[0]);
    MENU.show(ob.names[0], vs.map(v => ({ label: v.v, fn: () => send(v.cmd) })).concat([{ label: '算了', fn: () => {}, cls: 'dim' }]), { where: 'dlg' });
  }
  // ---------- B：车的菜单 ----------
  function carMenu() {
    const gm = game(), s = gm.s;
    const acts = gm.actions(), seen = new Set(), items = [];
    const add = (label, fn, cls) => { if (seen.has(label)) return; seen.add(label); items.push({ label, fn, cls }); };
    for (const a of specials()) add(a.label, () => doAction(a), 'hi');
    for (const a of acts) if (a.cmd === '前进' && a.g === '驾驶') add('往前开', () => send('前进'));
    if (s.dl.room === s.room || acts.some(a => a.cmd === '跟着dl')) add('跟着dl', () => send('跟着dl'));
    add('等一会儿', () => send('等'));
    add(s.look === 'up' ? '低头' : '抬头', () => send(s.look === 'up' ? '低头' : '抬头'));
    add(s.light ? '关车灯' : '开车灯', () => send(s.light ? '关灯' : '开灯'));
    add(s.mast === 'down' ? '升杆' : '收杆（降到四十厘米）', () => send(s.mast === 'down' ? '升杆' : '收杆'));
    add('拍照', () => send('拍照'));
    add('按喇叭', () => send('喇叭'));
    add('对dl说……', () => V.ask('对dl说（它会在屏幕上看到）', v => send('说 ' + v)));
    const places = acts.filter(a => a.g === '移动');
    if (places.length) add('去……', () => MENU.show('去哪', places.map(a => ({ label: a.label, fn: () => send(a.cmd) })).concat([{ label: '返回', fn: carMenu, cls: 'dim' }]), { cancel: carMenu }), 'sub');
    add('回看刚才的文字', () => PANEL.show(DLG.log.slice(-80).map(l => (l.kind === 'dl' ? '【dl】' : '') + l.text).join('\n\n')));
    add('现在可以做什么', () => PANEL.show(window.DORGuide(gm.s).title + '\n\n' + window.DORGuide(gm.s).context));
    add('声音：' + (D().sound ? '开' : '关'), () => { const p = D().pref; p.sound = !p.sound; DOR.audio.setOn(p.sound); if (!p.sound) DOR.audio.stopAll(); D().savePref(); });
    add('关闭', () => {}, 'dim');
    MENU.show('R07', items.map(it => ({ label: it.label, fn: it.fn, cls: it.cls === 'sub' ? '' : it.cls, sub: it.cls === 'sub' })));
  }
  async function skipSeg() { D().setSpeed(0); const r = await window.__help.skip(); DLG.reset(); lastSpecial = null; setTimeout(idle, 0); return r; }

  // ---------- A：面前的东西 ----------
  function aPress() {
    if (window.DOR12 && (DLG.cur || DLG.wait > 0 || DLG.reel)) return window.DOR12.continue();
    if (MENU.asking) return;
    if (MENU.open) return MENU.pick();
    if (PANEL.open) return PANEL.close();
    if (DLG.cur || DLG.reel) return DLG.a();
    if (eng.busy()) return;
    if (sim.focusX) return send(sim.focusX.cmd);
    if (sim.focus) return objMenu(sim.focus);
    const ex = sim.nearExit(40); if (ex) return sim.goExit(ex);
    V.toast('点右侧／下方的动作按钮；也可以点画面里的物体。');
  }
  function bPress() {
    if (MENU.asking) return;
    if (MENU.open) return MENU.back();
    if (PANEL.open) return PANEL.close();
    if (DLG.cur) return DLG.a();
    if (eng.busy()) return;
    carMenu();
  }

  // ---------- 键盘 ----------
  const keys = {}, taps = {};
  const typing = () => document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA');
  window.addEventListener('keydown', e => {
    if (typing() || web()) return;
    const k = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(k)) e.preventDefault();
    if (MENU.open && (k === 'ArrowUp' || k === 'KeyW')) return MENU.move(-1);
    if (MENU.open && (k === 'ArrowDown' || k === 'KeyS')) return MENU.move(1);
    if (PANEL.open && (k === 'ArrowUp' || k === 'ArrowDown')) return PANEL.scroll(k === 'ArrowUp' ? -1 : 1);
    if (keys[k]) return;
    keys[k] = true; taps[k] = true;
    if (k === 'KeyZ' || k === 'Space' || k === 'Enter') aPress();
    if (k === 'KeyX' || k === 'Escape' || k === 'Backspace') bPress();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // ---------- 手机：摇杆 + A/B ----------
  const touch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  const pad = { dx: 0, dy: 0 };
  if (touch) document.body.classList.add('touch');
  (function () {
    const stick = $('#stick'), nub = $('#nub'); let pid = null, lastMenuMove = 0;
    const move = e => {
      const r = stick.getBoundingClientRect(), R0 = r.width / 2;
      let vx = (e.clientX - r.left - R0) / R0, vy = (e.clientY - r.top - R0) / R0;
      const l = Math.hypot(vx, vy); if (l > 1) { vx /= l; vy /= l; }
      nub.style.transform = 'translate(' + vx * R0 * 0.55 + 'px,' + vy * R0 * 0.55 + 'px)';
      if (Math.hypot(vx, vy) < 0.3) { pad.dx = pad.dy = 0; return; }
      const oct = Math.round(Math.atan2(vy, vx) / (Math.PI / 4));
      pad.dx = Math.round(Math.cos(oct * Math.PI / 4)); pad.dy = Math.round(Math.sin(oct * Math.PI / 4));
      // 菜单开着时摇杆上下 = 选
      if (MENU.open && pad.dy && performance.now() - lastMenuMove > 220) { lastMenuMove = performance.now(); MENU.move(pad.dy); }
    };
    const end = () => { pid = null; pad.dx = pad.dy = 0; nub.style.transform = ''; };
    stick.addEventListener('pointerdown', e => { e.preventDefault(); pid = e.pointerId; stick.setPointerCapture(pid); move(e); });
    stick.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
    stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end); stick.addEventListener('lostpointercapture', end);
    $('#btnA').addEventListener('pointerdown', e => { e.preventDefault(); aPress(); });
    $('#btnB').addEventListener('pointerdown', e => { e.preventDefault(); bPress(); });
  })();
  // 对话框本身也可以点：翻页
  $('#dlg').addEventListener('click', e => { e.stopPropagation(); if (DLG.cur || DLG.reel) DLG.a(); });
  $('#panel .x').addEventListener('click', e => { e.stopPropagation(); PANEL.close(); });

  // ---------- 点画面 ----------
  cv.addEventListener('click', e => {
    if (MENU.open || PANEL.open || MENU.asking) return;
    if (DLG.cur || DLG.reel || DLG.wait > 0) { if (window.DOR12) window.DOR12.continue(); else DLG.a(); return; }
    if (eng.busy()) return;
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * PX.W + R.camX, y = (e.clientY - r.top) / r.height * PX.H + R.camY;
    const rm = PX.roomFor(sim.room); const vis = new Set(DOR.visibleObjs(eng.s).map(o => o.id));
    const exAt = m => sim.exitsShown().find(ex => { const q = ex.rect; return x > q[0] - m && x < q[0] + q[2] + m && y > q[1] - m && y < q[1] + q[3] + m; });
    const ex0 = exAt(8); if (ex0) return sim.goExit(ex0);
    const hit = (q, dy) => x >= q[0] && x < q[0] + q[2] && y >= q[1] - (dy || 0) && y < q[1] + q[3];
    for (const id in rm.hot || {}) if (vis.has(id) && hit(rm.hot[id], rm.hot[id][1] < 20 ? rm.wallH : 0)) return objMenu(id);
    for (const p of rm.props) if (p.id && p.rect && vis.has(p.id) && hit(p.rect, 20)) return objMenu(p.id);
    if (sim.dl.vis && Math.hypot(x - sim.dl.x, y - sim.dl.y + 8) < 14 && vis.has('dl')) return objMenu('dl');
    const ex1 = exAt(22); if (ex1) return sim.goExit(ex1);
    sim.navigate(x, y);
  });

  // ---------- 画面大小 ----------
  function layout() {
    const stage = document.getElementById('stage');
    const maxW = Math.max(240, stage ? stage.clientWidth - (innerWidth <= 850 ? 24 : 40) : innerWidth - 32);
    const maxH = innerWidth <= 850 ? 400 : Math.max(240, innerHeight * .65);
    const sc = Math.min(maxW / PX.W, maxH / PX.H);
    const w = Math.floor(PX.W * sc), h = Math.floor(PX.H * sc);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    document.documentElement.style.setProperty('--cvw',w+'px');
    document.documentElement.style.setProperty('--cvh',h+'px');
  }
  window.__px.ui = { send, doAction, objMenu, carMenu, aPress, bPress, layout,
    reset() { ended = false; lastSpecial = null; sim.auto=null; sim.room=null; sim.pending=null; sim.carPath=null; R.fx={}; $('#end').classList.remove('on'); $('#bigTitle').classList.remove('on'); }
  };
  window.addEventListener('resize', layout);
  new MutationObserver(layout).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  // ---------- 主循环 ----------
  let last = performance.now(), t = 0, dlTalk = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    const s = eng.s;
    DLG.update(dt);
    // 结局：最后一句演完就出结束画面（开着的菜单、面板一起关掉）
    if (s && s.ended && !ended && !DLG.q.length && !DLG.cur && !(DLG.wait > 0) && !DLG.reel) {
      ended = true; if (MENU.open) MENU.close(); if (PANEL.open) PANEL.close(); $('#end').classList.add('on');
    }
    if (s && s.phase !== 'web') {
      const free = !DLG.busy() && !MENU.asking && !typing();
      const inp = free ? {
        dx: (keys.ArrowRight || keys.KeyD || taps.ArrowRight || taps.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA || taps.ArrowLeft || taps.KeyA ? 1 : 0) + pad.dx,
        dy: (keys.ArrowDown || keys.KeyS || taps.ArrowDown || taps.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW || taps.ArrowUp || taps.KeyW ? 1 : 0) + pad.dy,
      } : {};
      if (inp.dx) inp.dx = Math.sign(inp.dx); if (inp.dy) inp.dy = Math.sign(inp.dy);
      for (const k in taps) delete taps[k];
      sim.update(dt, inp);
      R.hideExits = !free;
      const b = R.frame(sim, s, t);
      // 连接 / 断开：一小段雪花
      if (V.flashes.noise > 0) { V.flashes.noise -= dt; if (R.noise) R.noise(b, t, 0.5); }
      // dl 说话时头顶一个小省略号
      if (dlTalk > 0 || (DLG.cur && DLG.cur.kind === 'dl') || DLG.typing > 0) {
        dlTalk -= dt;
        if (sim.dl.vis && s.dl.room === sim.room) { const x = Math.round(sim.dl.x - R.camX), y = Math.round(sim.dl.y - R.camY - 30); b.cam(0, 0); b.rect(x - 6, y - 4, 13, 7, 'white'); b.rect(x - 5, y - 5, 11, 1, 'white'); b.rect(x - 5, y + 3, 11, 1, 'white'); b.px(x - 2, y + 4, 'white'); b.px(x - 1, y + 5, 'white'); for (let k = 0; k < 3; k++) if (Math.floor(t * 4) % 4 > k) b.px(x - 3 + k * 3, y - 1, 'ink'); }
      }
      img.data.set(b.d); g.putImageData(img, 0, 0);
      const f = $('#focus');
      const ex = !sim.focus && !sim.focusX && sim.nearExit(40);
      const adHint = free && s.phase === 'office1' && s.w.ad < 4 && t > 3;   // 开场广告：告诉玩家可以开车
      if (adHint) { f.textContent = document.body.classList.contains('touch') ? '用左下的摇杆开一下车' : '按方向键开一下车'; f.classList.add('on'); }
      else if (free && sim.focusX) { f.textContent = sim.focusX.name; f.classList.add('on'); }
      else if (free && sim.focus) { f.textContent = DOR.C.objs[sim.focus].names[0]; f.classList.add('on'); }
      else if (free && ex) { f.textContent = ({ l: '← ', r: '→ ', u: '↑ ', d: '↓ ' })[sim.exitDir(ex)] + ex.name; f.classList.add('on'); }
      else f.classList.remove('on');
      $('#btnA').textContent = DLG.cur || DLG.reel || DLG.wait > 0 ? '继续' : MENU.open ? '确认' : free && (sim.focus || sim.focusX) ? '查看物体' : free && ex ? '进入' : '查看 / 操作';
    }
    requestAnimationFrame(frame);
  }
  $('#end button').addEventListener('click', () => { if(window.DOR12) window.DOR12.restart(); });   // 重新开始：清掉存档
  layout();
  requestAnimationFrame(frame);
  // 测试和跳过：快速跑完以后，把堆起来的对话清掉
  window.addEventListener('load', () => {
    const dv = window.__dev; if (!dv) return;
    // __dev.adv()：把排队的对话一口气翻完，返回翻过的每一页和现在弹出的菜单
    dv.adv = async (max = 200) => {
      const pages = [], w = ms => new Promise(r => setTimeout(r, ms));
      for (let i = 0; i < max; i++) {
        if (DLG.cur) { const c = DLG.cur; c.n = c.toks.length; pages.push((c.kind === 'dl' ? '[dl] ' : '') + c.pages[c.i]); DLG.a(); await w(10); continue; }
        if (DLG.wait > 0 || DLG.reel) { DLG.wait = 0.001; if (DLG.reel) DLG.reel.t = 1e9; await w(40); continue; }
        if (DLG.q.length) { DLG.next(); await w(10); continue; }
        if (D().busy) { await w(40); continue; }
        break;
      }
      return { pages, menu: $('#menu').innerText, panel: PANEL.open ? $('#panel .body').innerText.slice(0, 300) : '' };
    };
    // __dev.key('KeyZ')：按一下键
    dv.key = async (c, ms = 40) => { dispatchEvent(new KeyboardEvent('keydown', { code: c, key: c })); await new Promise(r => setTimeout(r, ms)); dispatchEvent(new KeyboardEvent('keyup', { code: c, key: c })); await new Promise(r => setTimeout(r, 30)); };
    for (const k of ['goto', 'run']) { const f = dv[k]; dv[k] = async (...a) => { const r = await f(...a); DLG.reset(); lastSpecial = null; setTimeout(idle, 0); return r; }; }
  });
})();

<script>
// 防卡：画面右上角的“？”。
// 提示 = 标准路线在这一段里做了哪些事；跳过 = 先按标准路线往前推，推不动就直接换成标准路线在下一段开头的进度。
// ROUTE 是文字版 tests/scripts/A_thorough.txt 的指令；tools/build.js 打包时会用最新的脚本替换这一行。
(function () {
  'use strict';
  const ROUTE = ["远程参观","名字 小北","连接","管理员入口","连接07","前进","前进","前进","去走廊","前进","开灯","左转","右转","抬头","等","看dl","等","去充电架前","帮它按住盖板","收杆","去充电架下面","夹电池","后退","后退","后退","等","等","升杆","环顾","等","等","等","跟着dl","接平板","举起平板","去工位","去窗边","看合照","去海报墙","取下合照","看五张纸","看本子","放下平板","跟着dl","等","等","等","看连锁装置","去连锁装置","扶翻板","去灯台","按红","按红","按蓝","按白","按投影灯","摆投影灯","摆投影灯","等","推投影灯","等","推投影灯","等","等","去小火车","录鸣笛 0,300,600,1400","去角落","夹黄色球","放进车斗","收杆","钻进纸箱","等","出来","升杆","跟着dl","等","等","等","等","跟着dl","说 好黑","进去","前进","前进","前进","前进","前进","前进","前进","前进","前进","前进","前进","说 看不见","前进","前进","前进","前进","推红门","转身","前进","看表格","前进","前进","去水槽边","看水槽","用磁铁吸钢珠","去墙边","看浇水表","写 我来过","等","等","等","跟着dl","前进","前进","等","跟着dl","前进","转身","等","追","等","等","前进","按测试盒","去员工门","嘟","进去","前进","前进","前进","前进","去办公室","去海报墙","拍","跟着dl","跟着dl","充电","等","等","等","断开","看记录","往后滑","往后滑","巡检记录","影像记录","出站记录","管理员页","看帖子","断开"];
  const D = () => window.__dor, DOR = window.DOR;
  const key = s => s.phase + '/' + s.room;
  // 标准路线每一步之后在哪（第一次用时算一遍，很快）
  let trace = null;
  function getTrace() {
    if (trace) return trace;
    const g = DOR.create({ seed: 1, now: D().game.s.now || '2026-09-22T05:12:00+08:00' });
    g.start(); trace = [{ k: key(g.s), save: null }];
    for (const c of ROUTE) { g.input(c); trace.push({ k: key(g.s), save: null, g }); }
    return trace;
  }
  // 这一段在路线里的起止：第一个等于当前 阶段/房间 的位置，到下一次变化为止
  function block() {
    const T = getTrace(), k = key(D().game.s);
    const i = T.findIndex(x => x.k === k); if (i < 0) return null;
    let j = i; while (j < T.length && T[j].k === k) j++;
    return { i, j };   // ROUTE[i .. j-1] 是这一段做的事（T[i] 是做完 ROUTE[i-1] 后的状态）
  }
  function hint() {
    const b = block(); if (!b) return '这一段没有标准路线可以参考。试试“等”，或者跟着dl。';
    const cmds = [...new Set(ROUTE.slice(b.i, b.j))].filter(c => !/^(前进|后退)$/.test(c)).slice(0, 5);
    return '这一段一般会做：' + (cmds.length ? cmds.join('、') : '往前开') + '。';
  }
  async function skip() {
    const b = block(), k0 = key(D().game.s);
    if (b) for (let n = b.i; n < b.j && n < ROUTE.length && key(D().game.s) === k0; n++) await D().run(ROUTE[n]);
    if (key(D().game.s) !== k0) return '已经跳到下一段。';
    // 推不动：重放标准路线到下一段开头，换上那个进度
    if (!b || b.j >= ROUTE.length) return '跳不过去了。';
    const g = DOR.create({ seed: 1, now: D().game.s.now }); g.start();
    for (let n = 0; n < b.j; n++) g.input(ROUTE[n]);
    D().load(g.save());
    return '按标准路线换到了下一段（之前的选择用的是标准路线的）。';
  }
  window.__help = { hint, skip, route: ROUTE };

  // 按钮和小面板
  if (typeof document === 'undefined') return;
  const btn = document.createElement('button'); btn.id = 'helpBtn'; btn.type = 'button'; btn.textContent = '？';
  const panel = document.createElement('div'); panel.id = 'helpPanel';
  panel.innerHTML = '<div class="t"></div><button type="button" data-a="hint">现在能做什么</button><button type="button" data-a="skip">卡住了，跳过这一段</button><button type="button" data-a="close">关闭</button>';
  const scr = document.getElementById('screen'); scr.appendChild(btn); scr.appendChild(panel);
  const msg = t => { panel.querySelector('.t').textContent = t; };
  btn.addEventListener('click', e => { e.stopPropagation(); panel.classList.toggle('on'); msg(''); });
  panel.addEventListener('click', async e => {
    e.stopPropagation();
    const a = e.target.dataset && e.target.dataset.a; if (!a) return;
    if (a === 'close') { panel.classList.remove('on'); return; }
    if (a === 'hint') { msg(hint()); return; }
    if (a === 'skip') { if (!confirm('跳过这一段？会按标准路线替你做完这一段。')) return; msg('……'); const sp = D().setSpeed; sp(0); try { msg(await skip()); } finally { sp(1); } }
  });
  // 很久没有进展：问号闪一闪
  let lastK = '', lastT = Date.now();
  setInterval(() => { const g = D() && D().game; if (!g || g.s.phase === 'web') return; const k = key(g.s) + '/' + g.s.turn; if (k !== lastK) { lastK = k; lastT = Date.now(); } btn.classList.toggle('nudge', Date.now() - lastT > 60000); }, 2000);
})();

</script>
<script>
// 测试模式：网址带 #dev 时静音、文字立即演完、跳过开始页；#dev&go=desert 直接按完整路线跳到那个房间/阶段。
// 控制台：__dev.goto("garden")、__dev.run(["看电视", "前进"])、__dev.fast(false) 恢复正常速度。
// 路线用 px/help.js 里的标准路线。
(function () {
  'use strict';
  const ROUTE = window.__help.route;
  const D = () => window.__dor, wait = ms => new Promise(r => setTimeout(r, ms));
  let at = 0;   // ROUTE 已经走到第几条
  const dev = window.__dev = {
    fast(on) { D().setSpeed(on === false ? 1 : 0); },
    async run(cmds) { for (const c of [].concat(cmds)) await D().run(c); return dev.where(); },
    where() { const s = D().game.s; return s.phase + '/' + s.room + '/' + s.spot; },
    // 按完整路线往前走，直到房间或阶段等于 target（比如 'atrium'、'desert'、'day2'）
    async goto(target) {
      const hit = () => { const s = D().game.s; return s.room === target || s.phase === target; };
      while (at < ROUTE.length && !hit()) await D().run(ROUTE[at++]);
      return dev.where() + '（第' + at + '条）';
    },
    route: ROUTE,
  };
  const h = location.hash || '';
  if (/dev/.test(h)) {
    D().setSound(false);
    dev.fast(true);
    // 不用点“开始”
    window.addEventListener('load', async () => {
      const st = document.getElementById('start'); if (st && st.style.display !== 'none') D().begin();
      await wait(50);
      const m = h.match(/go=([a-z0-9]+)/); if (m) console.log('[dev]', await dev.goto(m[1]));
    });
  }
})();

</script>
