 put(tags.children[2],sim.auto?.tx||0,sim.auto?.ty||0,!!sim.auto&&!busy);
}
function snapshot(){if(!D.game)return null;return{version:VERSION,game:D.game.save(),cur:L.cur,q:L.q,wait:L.wait,reel:L.reel,log:L.log,undo:undo.slice(-8),panel:P.open?$('#panel .body').innerHTML:null,lastGuide,lastSys,sim:{room:px.sim.room,x:px.sim.x,y:px.sim.y,a:px.sim.a},time:Date.now()};}
function persist(){if(restoring||!D.game)return;try{const x=snapshot();localStorage.setItem(KEY,JSON.stringify(x));saveError=false;}catch(e){saveError=true;}}
async function settle(){for(let i=0;i<100&&D.busy;i++)await new Promise(r=>setTimeout(r,10));}
async function restore(x){
 if(!x||typeof x.game!=='string')throw new Error('存档内容不完整');
 const state=JSON.parse(x.game);if(!state||!state.f||!state.w||!DOR.C.phases[state.phase])throw new Error('存档版本不兼容');
 restoring=true;await settle();L.reset();M.close();P.close();$('#ask').classList.remove('on');M.asking=false;px.ui.reset();document.body.classList.toggle('web',state.phase==='web');document.body.classList.remove('v11black','black');
 D.setSpeed(0);D.load(x.game);await settle();L.reset();P.close();D.game.s=state;
 L.log=Array.isArray(x.log)?x.log:[];L.q=Array.isArray(x.q)?x.q:[];L.cur=x.cur||null;L.wait=0;L.typing=0;L.reel=x.reel||null;undo=Array.isArray(x.undo)?x.undo:undo;
 lastGuide=x.lastGuide||DORGuide(D.game.s);lastSys=x.lastSys||'';px.sim.room=null;px.sim.sync();
 if(x.sim&&x.sim.room===D.game.s.room&&Number.isFinite(x.sim.x)&&Number.isFinite(x.sim.y)){Object.assign(px.sim,x.sim);px.sim.nudgeFree();}
 if(x.panel)P.show(x.panel,true);
 if(L.cur)L.cur.n=L.cur.toks.length;L.update(0);restoring=false;lastKey='';render(true);tell(lastSys||'已恢复到离开时的进度。');px.ui.layout();persist();
}
async function restart(){restoring=true;await settle();L.reset();M.close();P.close();px.ui.reset();document.body.classList.add('web');document.body.classList.remove('v11black','black');undo=[];lastGuide=null;lastSys='';try{localStorage.removeItem(KEY);localStorage.removeItem(DOR_HOOK.saveKey);}catch(e){}D.setSpeed(0);D.load('invalid-new-game');await settle();restoring=false;firstIdle=true;lastKey='';render(true);px.ui.layout();persist();}
$('#tool-actions').onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;switch(b.dataset.tool){
 case'log':showLog();break;
 case'tools':if(!blocked())px.ui.carMenu();break;
 case'drive':document.body.classList.toggle('drive-mode');b.textContent=document.body.classList.contains('drive-mode')?'收起驾驶按钮':'显示驾驶按钮';tell('也可以直接点击画面内的空地、物体，或使用地点按钮。');break;
 case'sound':D.setSound(!D.sound);D.savePref();b.textContent=D.sound?'声音：开':'声音：关';break;
 case'undo':if(D.busy||!undo.length)return;if(!confirm('撤回到上一次操作之前？只撤回你这一步，不替换成标准路线。'))return;{let x=undo.pop();let keep=undo.slice();await restore({game:x.game,log:x.log,undo:keep});tell('已撤回：'+x.cmd);}break;
 case'restart':if(confirm('重新开始第一章？本机当前进度会被清除。'))await restart();break;
 }
};
// Only expose genuine help/recovery; the old skip routine fabricated a standard-route save.
window.__help.hint=()=>DORGuide(D.game?.s).context;
window.__help.skip=async()=> '本版不替换你的选择。请使用当前目标，或撤回上一步。';
window.DOR12={version:VERSION,guide:DORGuide,render,invoke,continue:continueReading,restore,restart,persist,get snapshot(){return snapshot();},get undo(){return undo;}};
let stored=null;try{stored=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){saveError=true;}
const start=$('#start');start.innerHTML='<h1>真实的梦 2</h1><p>第一章 · 重新连接<br>一条七年前的远程参观链接。<br>你会控制一辆小车，遇到一个仍在工作的人。</p><p style="font-size:13px">读对话时点“继续”，行动时点写明动作的按钮。<br>不必猜口令，也不必熟悉游戏手柄。</p>';
if(stored&&stored.game)start.append(makeButton('继续上次的连接',async()=>{try{start.style.display='none';await restore(stored);}catch(e){start.style.display='flex';tell('存档无法恢复，可以从头开始。');}}));
else{let old=null;try{old=localStorage.getItem(DOR_HOOK.saveKey);}catch(e){}if(old)start.append(makeButton('继续旧版进度',async()=>{try{start.style.display='none';await restore({game:old});}catch(e){start.style.display='flex';}}));}
start.append(makeButton(stored?'从头开始':'开始连接',()=>{start.style.display='none';restart();}));
$('#end button').onclick=()=>{}; // original listener is replaced in the source patch
window.addEventListener('pagehide',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();});
setInterval(()=>{render();},120);setInterval(persist,1800);px.ui.layout();render(true);
})();
